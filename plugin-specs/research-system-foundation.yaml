# 运行时机制：调研吸收这一业务系统的要求清单。

ldvh_spec:
  spec_key: research-system-foundation
  spec_kind: spec
  title: 调研吸收
  canonical_path: plugin-specs/research-system-foundation.yaml
  positioning: 管一次取证与吸收怎么做：什么时候做、怎么算收敛、证据怎么分三态、结论怎么落
  scope: 要查清一个外部事实、或要判断一次调研是否已经收敛时，查阅本文件

  carries:
    - "research-system-foundation::7. 输入与前置条件/6.6 内部先查与联网提请的前置"
    - "research-system-foundation::17. 风险路由与预检要求/16.1 风险层引用（指向 03 §6）"
    - "research-system-foundation::5. 系统定位与价值（02 §12.1 第 1 项）/5.1 服务对象归属（调研围绕谁）"
    - "research-system-foundation::7. 输入与前置条件/6.5 取证面分流判据"
    - "research-system-foundation::13. 结论承载与回写/12.1 承载载体"
    - "research-system-foundation::5. 系统定位与价值（02 §12.1 第 1 项）"
    - "research-system-foundation::4. 适用范围/4.1.1 目标锚定准入（Human 2026-11-20 决定：调研不再结构化锚定 SubGoal）"

  requirements:

    - id: what-it-is
      title: 这件事只做一件产出
      text: |
        调研吸收只有一件产出：围绕不掌握的问题搜集证据，直到不再产生新的确认认识，
        交出一组已证实、未证实与缺口的三态证据。

        它不产生授权，不产生方案结论，不替代人的决定，也不等于结论已写入事实源。
        不得以证据齐备、引用可回指或审计通过，声称结论正确、适用或有长期价值。
        调研结论是方案收敛的输入，不得被改写成「选哪个」的取舍意见。

    - id: when-it-applies
      title: 什么时候进入这里
      text: |
        出现下列任一情形时进入本系统，而不是按普通求解处理：
        - 判断、方案或决定依赖自己不掌握的外部信息；
        - 关键词汇有多重专业含义，且上下文无法消歧；
        - 问题涉及多个维度、时间范围、版本范围或适用场景而未界定；
        - 既有结论的来源过时或相互冲突，需要重新取证。

        名称相近、来源存在或工具可用，只说明它是候选，不构成它已经适用的依据。

    - id: preconditions
      title: 进入须同时满足什么
      text: |
        进入须同时满足四项：
        一、问题能被界定为可回指来源的取证对象；
        二、存在可访问的来源——外部是网址或已确认存在的文档，
            内部是项目内可回查的记录、载体或运行状态；
        三、当前目标、授权与范围不禁止对外取证；
        四、适用来源要求的行动前事实预检已经完成。

    - id: excludes
      title: 什么不由这里承接
      text: |
        下列不由本系统承接：
        - 需要「选哪个、为什么」的方案结论；
        - 信息已掌握，只需沉淀或取回；
        - 只是执行一个已批准的动作；
        - 只是识别并落实适用的规则；
        - 实质是让人裁夺做什么。

        判定不进入时须说明它该去哪里，不得按最相近的系统猜着做。

    - id: service-object
      title: 调研围绕谁
      text: |
        调研默认服务当前受管辖项目自身的问题——它的技术选型、业务约束、工程方向与产品决定。

        服务于 LDVH 自身该吸收什么的外部做法也可以调研，但不得成为默认方向或唯一方向；
        属于这一类时须显式标明服务对象是 LDVH 自身，而不是当前项目。

        项目本身就是 LDVH 的仓库时，不得以「本仓库就是 LDVH」为由把项目自身的需求当成这类调研；
        判断不了属于哪一类时暂停并提请裁定，不得默认归入任一类。

    - id: evidence-surface
      title: 取证面怎么分
      text: |
        取证面分三种：对外部对象取证属外部调查；对项目内部过程、既有载体与运行记录取证属内部信息吸收；
        一次独立审核或复核的完整结论属审核型报告。

        三者的差别只在来源形态与承载的报告类型；入口澄清、收敛判定、三态证据、引用闭环与交付核对一体适用，
        不为某一面另设一套流程。

        一次调研同时涉及内外时，取第一个成立的归属作为整体，不拆成两个对象；另一面的证据作为输入记录。

    - id: inputs-and-missing
      title: 必需输入与缺失处理
      text: |
        必需输入：待取证的问题（含目标、边界与精度）、取证面归属、来源可及性、
        适用的召回与预检结论、轮次上限。

        来源为空但可以通过检索取得，不构成缺失；问题无法界定或来源完全不可达时，
        不得主观推断补齐，须暂停交还。
        同一事实出现无法判定的矛盾证据时，记为未证实并记入缺口，不得掩盖。

    - id: internal-first
      title: 外部取证之前先查内部
      text: |
        外部调查在打开外部来源之前，须先把项目里已经积累的结论取回来核对：
        过去记下的经验与报告、以及已经生效的事实规范，是否已经回答了本次问题。

        判定只按实质命中：真的回答了问题才算内部已有可用结论；靠通用词或单字偶然撞上的
        只算候选，须继续往下走。
        内部确有相关结论但仍不够用时，须写明内部已有哪一条、还缺哪一部分。

        没找到只说明按机制查过而没找到，不得写成内部根本没有；内部来源读不出来时按未检查记，
        并按部分完成登记。

        没找到时才向人提请是否联网调查：该提请是征询，不构成授权；
        未取得答复不妨碍按既有路径继续，交还时说明这一情况。

    - id: clarify-trigger
      title: 什么时候必须先澄清
      text: |
        问题存在下列任一情形时须进入澄清：
        - 关键词汇有多重专业含义，且上下文无法消歧；
        - 涉及多个维度而优先级未定；
        - 时间范围、版本范围或适用场景未界定。

        没有真实歧义时不得发起澄清提问。

    - id: clarify-manner
      title: 澄清怎么问、怎么留
      text: |
        提问须指出歧义点、可能的解释，以及不同解释对调研范围的影响，不得只问「请说清楚一点」。
        提问不超过三个，每题只针对一个歧义点。

        每条问答的双方内容须如实记录，形成澄清摘要注入当次调研规划，且每条都能回指问答来源。

    - id: clarify-downgrade
      title: 人不回应澄清时怎么办
      text: |
        人不回应或明确拒绝澄清时，须如实记录「调研问题未澄清」并标注具体歧义点，
        据此取最保守的范围假设继续推进；不得以主观推断替代澄清，也不因此无限期暂停。

    - id: evidence-states
      title: 三态证据各自的成立条件
      text: |
        已证实——结论有长期可访问的来源支持，逐字摘录已入库并标注来源与精确锚点，质量分级明确。

        未证实——有线索但证据不足、存在无法判定的矛盾、或来源质量存疑；须写出疑点或矛盾的具体内容。

        缺口——范围内仍需取得而未取得的信息；须写出所缺信息、优先级及其对结论的影响。

        三态不互相冒充，未证实与缺口不得写成已证实；没有真实缺口时不得制造缺口条目。

    - id: verbatim
      title: 摘录须逐字
      text: |
        每项用于支撑结论的证据须逐字摘录入库，并附来源、精确锚点（行号、段落或章节标记）、
        质量分级与摘录时间。

        摘录不得改写或概括，须保留原文；改写过的不构成摘录。

    - id: citation
      title: 报告里的声明须能回指
      text: |
        报告中的每项声明须能从证据库回指到对应的逐字摘录；引用未入库的内容不得出现在正文。
        引用须紧邻引文，并给出声明编号、来源与锚点。

    - id: audit
      title: 交付前须机器核对的四件事
      text: |
        交付前须核对：每个引用编号在证据库中有对应条目；引文与库中原文逐字一致；
        引用位置紧邻引文且格式完整；没有超出库条目的长段引用。

        任一项不通过，报告不得交付。
        引用闭环核对只作用于当次调研的报告与证据库。

    - id: source-required
      title: 有值必有来源
      text: |
        每项事实性声明须附稳定来源引用；没有来源的声明不得进正文，
        可归入待验证假设并明确标注。

    - id: ref-numbering
      title: 来源编号怎么注册
      text: |
        同一次调研里，同一来源的多次引用用同一个编号，按来源出现顺序注册。

        同一来源发生实质性更新时注册新编号，原编号与旧内容保留，不删除也不覆盖。

    - id: carrier
      title: 结论由什么承载
      text: |
        结论统一由报告类事实对象承载，按来源面分三型：外部调查落调研型，
        以外部来源、三态与引用闭环承载；内部信息吸收落总结型，来源逐字摘录进正文并标注内部锚点，
        不设外部资料字段；独立审核结论落审核型，须满足其准入条件。

        内部来源不得改写成外部资料：本机路径、日志、会话与提交定位符不得写进只承载外部网址的字段。

        同时涉及内外时，报告类型由主要来源面决定，另一面以摘录或外部来源补充。

    - id: no-anchor
      title: 给不出内部锚点时怎么存在
      text: |
        内部吸收的结论给不出任何内部来源锚点时，可以作为事实对象存在，但须在结论与边界处
        标注「无锚点·待补证」；呈现与召回时降权，不得与已锚定结论同权；补证后去掉该标注。

    - id: writeback-readback
      title: 写不写、写完怎么确认
      text: |
        不强制每次调研都写入事实源：仅在当次会话使用的临时证据可以不写入，
        但仍须满足三态结构与引用闭环。
        一旦声明为可复用结论，须经受控入口写入，并做写后精确回读，
        确认三态字段与引用编号与当次证据库一致；
        回读不一致或引用缺失时，不得声明已承载。

    - id: delivery
      title: 交付前须过三道
      text: |
        交付报告不得留有未填充的占位符；正文每项事实性声明须挂到证据库中的已证实证据，
        挂不上的须标注为未验证并写出优先级与缺口编号。

        违反任一项时须明确报告失败原因、未满足条件与修复路径，不得静默降级交付。

    - id: convergence
      title: 怎么算收敛
      text: |
        收敛只看三种信号：
        充分——每个子问题都有已证实证据覆盖，且没有阻塞其结论的高优先级缺口，
        也没有未处理或未明确延期的缺口；
        零增益——与上一轮相比没有新增确认认识，连续两轮即强制收敛；
        轮次触顶——启动时设定上限，小范围不超过两轮、大范围不超过四轮，达到上限即强制收敛。

        新增确认认识指本轮证据库新增至少一条已证实证据，且未被既有未证实证据抵消。
        每轮结论输出后、进入下一轮前与交付前都须执行判定；三种信号都未满足且未触顶时不得交付。

    - id: exit
      title: 当次职责何时结束
      text: |
        满足任一收敛信号且交付核对通过，当次职责收口；结论回流支撑方案构建、经沉淀判断后转入经验积累、
        作为已批准行动的输入时，职责转交，由承接方继续。

        需写受控报告或改受保护文档时先升级再继续；出现必停情形时暂停交还。

        当次作用范围到交付报告承载的声明为止，不自动延伸到下游的方案、采纳决定或受控写入。

    - id: target-anchor
      title: 发起不以归属字段为闸门
      text: |
        发起调研不以写明服务哪条子目标为条件：问题里可以说明本次调研服务的方向，
        但该说明不写进结论对象的结构化归属字段，也不构成发起门槛。

        调研服务于哪个目标，由研究目的与正文自述承担，不由结构化归属字段回答。
        发起不因缺该字段而受阻：调研是否值得发起按它自身的价值与风险判断，不以是否填了归属字段为准。

    - id: subagent
      title: 委派取证时须交代什么
      text: |
        委派子任务时须明确传入验收标准与答案空间；子代理不得越出答案空间扩展范围，
        须按三态提交结果，已证实证据须附逐字摘录、来源与锚点，
        不得提交无来源证据，也不得以推测填充缺口。

        子代理完成不等于调研完成：结果由发起方核对整合，
        整体结论、证据完整性与交付由发起方负最终责任。

    - id: risk-path
      title: 默认走哪条路径
      text: |
        默认按标准路径执行：完成适用的行动前事实预检，召回时机成立时完成所需召回。

        不落档的探索环节（入口澄清、来源检索与筛选、材料整理）可以按快通道执行，
        但不得产出带明确取舍倾向的结论，取证所涉的生效、适用与行动允许三段判断仍须完成；
        落档环节（结论写入与引用回写）须走标准路径。

        环节划分须事先声明，不得在执行中临时切分以规避升级；界不清时整体按标准路径；
        某次是否落入探索环节，须逐次判定并在交还中说明依据。

        不得在标准路径与加固路径之间另设中间层。

    - id: escalation
      title: 何时升级、何时降级
      text: |
        出现下列任一情况时升级到加固路径：需写受控报告、需改受保护文档、
        涉及未经验证的技术能力或环境入口、需人决定、已完成部分与预期显著偏离。
        升级不绕过停止，也不自动取得人的授权。

        能力不足、验证失败或结果不可观察时，按缩小范围、风险重分类、切换做法、暂停交还的顺序降级；
        降级不得违反来源强制要求、不得降低最低预检覆盖、不得超出授权。

    - id: human-gate
      title: 这些事须由人决定
      text: |
        下列事项须由人决定：调研范围实质扩张到原始问题之外；高优先级缺口长期无法关闭且无替代路径；
        结论与已有事实或人的决定冲突，需要取舍。

        人的决定只证明该决定及其作用范围，不替代收敛判定、证据完整性与交付核对。

    - id: stop
      title: 这些情况必须停下来
      text: |
        出现下列任一情况须停下：
        - 问题歧义未澄清，而以主观推断替代；
        - 高优先级缺口未关闭，却准备按充分收敛交付；
        - 引用编号在证据库中无对应条目，或引文与原文不符；
        - 报告留有未填充的占位符；
        - 结论未挂已证实证据，也未标注未验证；
        - 把自己的证据当成方案结论；
        - 需写受控报告或改受保护文档，却未升级即继续。

        停下期间只做证据补充、引用修复、占位符填充与收敛条件核实，
        不继续交付受影响报告，也不扩大声明。
        恢复须与触发原因对应，且只覆盖当前依据支持的范围；同一条件恢复后再触发时提请人决定。

    - id: handover
      title: 交还须说明什么
      text: |
        交还须说明：流程走到哪一步；报告或证据库的三态分布；引用核对与交付核对的结果；
        已验证的范围（来源可回指、引文逐字一致、占位符为零）与未验证的范围
        （未证实、缺口、未验证声明、未触发的召回）；
        残留风险（未关闭的高优先级缺口、来源冲突、降级后跳过的环节）；需人决定的事项与需转交的去向。

        覆盖不足时只能形成部分完成或未验证的交还，不得宣称结论成立。
