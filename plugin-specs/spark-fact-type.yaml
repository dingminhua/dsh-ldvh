# 运行时机制：火花这一事实对象的要求清单。
# 身份字段 6 项：spec_key / spec_kind / title / canonical_path / positioning / scope。

ldvh_spec:
  spec_key: spark-fact-type
  spec_kind: spec
  title: 火花
  canonical_path: plugin-specs/spark-fact-type.yaml
  positioning: 管一条值得跨行动保留的方向线：什么算它、怎么登记与分流、什么状态算终结
  scope: 有一个还想不清的问题要留下、要判断某条方向线还推不推，或要处置一条已有火花时，查阅本文件

  requirements:

    - id: what-is
      title: 什么算一条火花
      text: |
        一条火花同时满足三条：
        一、是一个跨行动保留的问题：今天答不完，而下次遇到同类情形还会用到它；
        二、有明确的停止边界：说得清问到什么程度就算这个问题问完了（范围、证据、时限）；
        三、有后续方向：说得清问完之后大概往哪走、要拿它做什么判断。
        三条缺一，就不是火花。

    - id: independence
      title: 一条火花要能单独召回、单独处置
      text: |
        一条火花要能独立召回、独立判断、独立分流：能被单独取回、单独判断还推不推、单独处置去向。
        多个已经可以各自独立处置的问题，不得长期捆成一条；它们一旦各自具备独立的目标、判断或跟踪价值，须拆开。
        反过来，几条线索仍是同一个共同问题的不同切入角度、还不能各自独立处置时，可以留在一条里，不要求立刻拆分。

    - id: not-spark
      title: 什么不算
      text: |
        下列内容不形成火花：
        - 当次行动就能直接处理、不需要跨行动保留的内容；
        - 已由某个既有位置完整承载的内容：指向那个位置，不再重复登记；
        - 过程日志、逐条聊天、工具输出、单纯的执行提醒。

    - id: extract-crystals
      title: 方向里已有的结晶物须提取出去
      text: |
        火花入口不因方向里已有结晶物就拒绝登记，但结晶物不得只留在火花里，须各自提取到该去的位置：
        已结晶的决定交人确认后由项目规则或人的决定承载；执行计划与验收在当次行动里承接；对外部对象的深度调研写成报告；已验证的失败机制归经验记录（一条已经查清机制的坑）；应修未修的系统性阻碍归摩擦账本（一笔待修的毛病）。
        提取后火花继续承载方向本身的演进：更新当前理解、把关键转折记进演变流水，直到方向落地或放弃。

    - id: question-scope
      title: 核心问题能部分已答
      text: |
        核心问题在方向完成或放弃前持续有效，允许部分已答：
        已答结论写进当前理解；已答部分结晶出的决定提取出去；核心问题只保留仍未答的部分；核心问题实质变化时，在演变流水里记一条转折。
        演变流水只在问题焦点、停止边界、判断方向或承接方向实质变化时追加；当前仍适用的内容须先写进当前理解；最多保留 20 项。

    - id: dedup
      title: 登记之前先查重
      text: |
        登记前须查重：把候选的标题与核心问题，对照仍悬置的火花做语义比对，并对照已终结的火花是否已完整承接该问题。
        查重是语义判断，不得用相似度分数或关键词重合度一类的自动裁决代替；结论须写进创建提案，未记录等同未做。
        同题命中时：不新建，转向既有那条推进，或把新信息补进它的当前理解。
        合并火花是另一个独立动作，须取得人的明确回应，被合并的那条转终态——不得用「登记时并进去」代替合并。

    - id: state-open
      title: open 的成立条件
      text: |
        open：仍有未被某个稳定位置完整承接的内容，需要继续召回、判断、拆分或分流。
        终态去向说明不得出现；已有合并或拆分关系不得被当作内容已被完整承接的证据；处置档位必填，缺档位时拒绝创建与更新。

    - id: state-implemented
      title: implemented 的成立条件
      text: |
        implemented：这条火花范围内的直接工作已落实，或后续责任已交给当次行动。它只结束这条火花的入口职责，不表示下游结晶物已完成。
        终态去向说明必填，须如实限定已落实或已交接的范围；不得带合并或拆分关系；处置档位不得出现。
        不得因下游尚未完成而不敢标记 implemented；也不得因标记了 implemented 就宣称下游完成。

    - id: state-discarded
      title: discarded 的成立条件
      text: |
        discarded：已明确决定不再继续跟踪这条信息；或该议题已被合并、被拆分，原火花不再以原形态存在。
        终态去向说明必填，写明不再跟踪的决定及其边界，或合并拆分的去向与理由；处置档位不得出现。
        若声明了合并或拆分关系，目标须可解析（存在、可读、同项目），且写入那一刻目标为 open；目标日后转终态不使已写入的关系失效。

    - id: terminal-correctable
      title: 终态不可重开，内容可更正
      text: |
        进入终态后状态不得再变：不回到 open，也不在 implemented 与 discarded 之间互转。
        终态内容仍可更正：写错的、超限的、与事实不符的记录须就地改正；更正不得改变状态，也不得借更正洗成一次状态转换。
        后来出现新的未处置信息时，新建一条 open 火花，在其终态去向说明或变更流水里写明接替哪条旧火花；不得把旧对象改写成分流结果。

    - id: priority
      title: 处置档位不是价值声明
      text: |
        处置档位表达这条火花在同类悬置项里的处置次序，不表达重要性，也不表达已获批准。
        open 时必填，缺档位拒绝创建与更新；终态必须省略，与终态去向说明互斥；取值只有 P0、P1、P2、P3，超出拒绝写入，不得代为推定。
        初值由 AI 结合当前目标、所属子目标、停止边界与项目阶段给出，人可按情况调整。
        档位不得被用作入口有效、方向被推进或对象有价值的证据。

    - id: serves-required
      title: 三态都要声明所服务的子目标
      text: |
        每条火花在三种状态下都须声明它服务的子目标，并解析到一条推进中或已达成的子目标；缺失或解析不到时拒绝创建与更新，含终态对象的更正。
        项目还没有子目标时，须先建立一个子目标再建火花，不得以「没有目标可挂」省略这条声明。
        归属是历时属性，不因火花终结而消失。

    - id: refs
      title: 普通关联写进关联引用
      text: |
        普通关联写进关联引用，不写进合并或拆分关系：
        每项须是本项目内存在、可读的事实对象身份，最多 10 项；出现不可解析项时零写入拒绝。
        不校验关联目标当前状态：关联记录的是历史事实，目标日后关闭不使关联失效。
        不得用关联引用指向外部资料、载体内部锚点或合并拆分去向。

    - id: summary-quality
      title: 当前理解要能让人独立读懂
      text: |
        当前理解须使没有读过原始对话的后续执行者能独立读懂：当前已确认什么、依据什么判断、仍需处置什么。
        它只承载当前仍适用的理解，不复制创建原因或过程日志。
        不得以长度合规声称当前理解已经可独立理解。

    - id: limits
      title: 三个长度上限
      text: |
        三个长度上限都是写入前置条件，超限即拒绝写入，不得截断后写入：
        标题不超过 30 字；当前理解不超过 200 字符；终态去向说明不超过 200 字符。
        计数按去除首尾空白后的文本长度算，段内换行与空白照常计入。
        当前理解的上限只校验本次写入新增或改动的内容，逐字未改的既有内容放行。

    - id: carrier-structure
      title: 一条火花是一个独立载体
      text: |
        一条火花是一个独立载体：上面是机器读取的载体头部，下面是给人读的正文。
        一级标题恰好一个且与标题一致；正文自二级标题起，按固定次序分四段：当前理解、调查问题、调查边界、演变；演变段可缺省，其余三段须存在且非空。
        载体头部是索引与摘要、正文是展开，两者不要求逐字一致；读出差异时只如实报告，不阻断写入。

    - id: change-log
      title: 写入留痕由入口托管
      text: |
        每次修改的时间与落款由写入入口代填，AI 只交一句语义摘要；对象的形成时间同样由入口填写，AI 不得自行填写。
        每次实际修改恰好追加一条变更流水，不得合并，也不得一次修改留两条。
        更正、终态处置与关系变更同样各留一条，理由须写清改了什么、为什么改。

    - id: create
      title: 创建一条火花之前须具备什么
      text: |
        创建一条火花之前须同时具备：
        一、核心问题、停止边界与后续方向都说得出来，缺一即不构成火花；
        二、查重已做并记录结论；
        三、声明了可解析的、所服务的子目标；
        四、已跑过只读预检并取得候选内容指纹（对候选入参算出的值），写入请求携带的指纹与预检逐字一致；预检未通过不得提请。
        创建提案由 AI 产出，人确认后经受控入口落盘；落盘之后须逐字回读，回读不通过，这次创建不成立。

    - id: ask-human
      title: 这两类动作须先取得人的明确回应
      text: |
        创建火花、让火花进入终态（implemented 或 discarded，含合并与拆分）这两类动作，须在动作发生前取得人的明确回应；未取得前不得执行，不得以静默、自述或事后补记代替。
        提请前须在对话正文写清呈报内容，提请弹窗只承担「这是什么动作」：创建报查重结论、核心问题、停止边界、所服务的子目标；终态报拟转状态、终态去向说明全文，合并或拆分时报目标火花的身份清单。
        没有答题入口、询问失败或未作选择时一律拒绝写入，并如实报告未取得回应；「没有反对」与沉默都不构成回应。
        合并或拆分的组合确认入口尚不具备时，各步骤仍会各自触发确认；多出的询问属已知实现限制，须如实披露，不得声称「不重复询问」已获保障。

    - id: big-change
      title: 问题或边界的大改只交还对照
      text: |
        更新改变核心问题或停止边界时，须在该次更新的返回结果里交还两者的现值与拟改值对照，由人判断是否构成大改。
        实现不得代为判定是否大改，不得据此拒绝更新，也不得把这一项表述为阻断更新的前置条件。
        不得据「已交还对照」声称人已作出判断，或声称本次确认已取得。

    - id: merge
      title: 合并的去向
      text: |
        合并：多条火花收敛成一个议题。
        原火花转为 discarded，写一条指向合并目标的合并关系；合并目标优先复用已有火花，它能代表合并后的议题就不新建，确需新建时创建一条新的 open 火花。
        目标的变更流水追加一条，记录本次合并的来源。

    - id: split
      title: 拆分的去向
      text: |
        拆分：一条火花分化出多个子议题。
        原火花转为 discarded，写若干条指向各子火花的分拆关系；每条子火花是独立的 open 对象，各自具备核心问题、停止边界、后续方向与当前理解。
        拆分的原火花不得标记为 implemented：它只是搬了家或变了形，没有走出去；子议题将来是否落地，由各子火花自己承担。

    - id: merge-split-order
      title: 关系写入的次序
      text: |
        合并或拆分的关系只能随原火花的终态转换一起写入；受控创建不携带关系与终态去向说明；写入关系那一刻，全部目标须已存在且为 open，否则零写入拒绝。
        次序由目标构成决定：
        目标全是既有火花时，先写原火花的终态与关系，再给每条既有目标补一条来源流水；
        目标全是新建火花时，先逐条创建新目标，再写原火花的终态与关系；
        目标既有又新建时，先建新建的那部分，再写原火花的终态与关系，最后给既有目标补来源流水。
        合并或拆分的前提是：人确认时这组火花没有被并发修改；不得以单对象的指纹或版本比对冒充跨对象并发控制。

    - id: merge-split-recovery
      title: 写入失败后的处置
      text: |
        写入失败时按已完成的部分处置，不得为求两端一致改写任一方：
        原火花已进入终态、关系有效，只是某条既有目标的来源流水没补上——原火花的状态与关系保持有效，不改回 open、不移除关系，只对未补的目标幂等重补，重补前先回读确认尚未写入；
        新目标已建、原火花仍为 open——原火花保持 open，本次合并或拆分未完成，对结转幂等重试；持续完不成时如实记为未完成范围，已建的新目标不得删除或废弃，须由人决定补做结转，或放弃本次合并拆分、把新目标保留为独立火花。
        不得留下「目标已建、原火花仍 open、两者关系不明」的悬置态。

    - id: merge-split-not-atomic
      title: 合并与拆分不是原子操作
      text: |
        合并与拆分不是一次原子操作；全部步骤完成并逐次回读通过之前，不得声明这次合并或拆分已完成。
        不得先写孤立的新对象再补关系，使目标长期停在无人指向的未承接状态；不得用多个单对象写入成功拼接成整体成功；不得为「回滚」而伪造中间状态。
        失败时须交还完整拟变更范围、实际已完成部分、能力缺口与残留状态，不得只报告失败的那一步。

    - id: recall
      title: 什么时候主动取回火花
      text: |
        需要时主动取回火花：
        当前输入涉及悬置的未决问题、未收敛的点，或精确引用了某条火花的身份、所服务子目标、处置档位、关联对象时，进入候选发现。
        火花不进入每回合自动注入，由 AI 主动查询取回。
        默认候选只含 open；终态火花只在精确引用或追溯历史基线时展开。
        取回火花不提高它的档位，也不使被关联对象自动进入候选。

    - id: historical-pointer
      title: 关系目标转终态后怎么读
      text: |
        合并或拆分关系的目标日后转为终态时，关系保留且有效，但读作历史指向：它回答「这条议题当时去了哪里」，不回答「目标当前仍在承载它」。
        不得因为目标已终结就删除或隐藏这条关系。
        呈现时须如实标明目标当前状态，使读者不至于据一条历史边推断目标仍在悬置；反向导航到该目标时同一条阅读纪律适用。

    - id: stop
      title: 这些情况必须停下来
      text: |
        出现下列任一情况须停下：
        - 要建的火花没有声明服务的子目标，或所声明的子目标解析不到；
        - 核心问题为空或读不成一个待答问题；
        - 停止边界缺失；
        - 没有取得人的明确回应就要创建或进入终态；
        - discarded 声明了合并或拆分关系，但目标不可解析；
        - 把一次拆分写成 implemented；
        - 创建前没有查重，或查重结论没有记录。
        停下期间只做：证据补取、引用修复、授权补走、条件核实。恢复须与触发原因逐项对应；同一停止条件恢复后再次触发的，交人决定。

    - id: no-overclaim
      title: 火花存在不构成问题真实或工作完成的证据
      text: |
        不得据火花存在、处于 open 或已终结，声称问题真实存在、值得调查、调查已完成或下游已承接；这些须由使用它的地方与人的决定共同核对。
        implemented 只结束入口职责，不得读成或说成下游完成；合并与拆分也不产生完成结论，被合并或被拆分的原火花一律不得标记为 implemented。
        机械校验通过不得被当作问题真实、值得推进或下游已完成的证据。

    - id: no-delete
      title: 不存在删除操作
      text: |
        不存在删除操作：存量火花随事实源保留，不通过删除、归档或作废之外的方式移除。
        不得以删除代替终态处置，也不得删掉一条历史关系来让记录看起来一致。
