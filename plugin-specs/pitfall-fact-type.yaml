# 运行时机制：一条已经踩过、并且已经查清机制的坑的要求清单。

ldvh_spec:
  spec_key: pitfall-fact-type
  spec_kind: spec
  title: 踩坑经验
  canonical_path: plugin-specs/pitfall-fact-type.yaml
  positioning: 管一条已经踩过、并且已经查清机制的坑：这个坑怎么识别、记下来之后怎么用、什么时候作废
  scope: 要记一条已验证的失败机制、或要查某个故障以前踩过没有时，查阅本文件

  carries:
    - "pitfall-fact-type::13. 受控操作"
    - "pitfall-fact-type::12. 召回与消费"
    - "pitfall-fact-type::9. 状态与生命周期/9.4 配对的复审义务"
    - "pitfall-fact-type::10. 来源与证据"
    - "pitfall-fact-type::6. 对象边界/6.2 查重"
    - "pitfall-fact-type::9. 状态与生命周期/9.3 勘误与补充级更新"
    - "pitfall-fact-type::17. 必停情形"

  requirements:

    - id: what-is
      title: 什么算一条踩坑经验
      text: |
        一条经验是一项可独立引用的已验证失败机制，须同时具备七样内容：失败实际发生后的可观察症状、会触发它的前置条件、当前经验范围内能解释它的根因判断、已实际采用的处理方式与成功信号、后续识别与预防的规避方式、已观察与未覆盖的验证说明、它何时可能被踩到与何时可信的适用范围。

        准入前提是四项同时成立：失败已实际发生、根因已查明、解决已采用、验证已有观察；四项都须能写出对应内容，写不出的对象不成立。

        它须可独立召回、可独立参与匹配、可独立作废。一次调试过程尚未收敛成经验的，不是经验。

    - id: not-pitfall
      title: 什么不算经验
      text: |
        下面这些不形成一条经验：
        - 未查明、未解决或未验证的问题 → 留在当次行动记录里；
        - 没有实际发生过的预防性风险假设；
        - 已定下的决策 → 由人的决定与方向规范承载；
        - 已经收敛的认识 → 写成调研报告；
        - 日志片段与自由标签；
        - 已经被方向规范吸收为强制做法的规避 → 规则归方向规范，经验不再独立承担约束。

        症状相近但根因不同的，各自成对象。

    - id: body-sections
      title: 正文固定七段且各段非空
      text: |
        正文的一级标题只有一个，由写入路径按标题生成；各段都从二级标题起书写。
        经验正文固定七段，创建时与每次更新后都须齐备且各段非空：症状、触发条件、根因、解决、规避、验证、影响与适用范围。

        「验证」段须同时写出已经观察到的结果与尚未覆盖的范围，不得以验证摘要冒充全面覆盖。

        另有一段可选的外部证据段；该条引用了外部网页证据时，这一段必填且非空。

    - id: carrier
      title: 一条经验一份文件
      text: |
        一条经验一份文件，平铺存放，路径形如 ldvh-base/pitfalls/pitfall-<uid>.md，文件名带上这个对象的稳定身份。

        文件头只放薄索引：类型、身份、标题、状态、适用范围、可选的重审信号、外部证据链接、终态处置说明、创建时间、变更流水。
        分析性长文本一律住正文，不拆成文件头的独立字段：不设症状、触发条件、根因、解决、规避、验证这类分析字段，也不设严重级、优先级、标签、可复现性这类装饰字段。

        文件头与正文不要求逐字一致：文件头是索引与摘要，正文是展开；差异如实报告，不阻断写入。

    - id: identity
      title: 身份与标题
      text: |
        每条经验有一个由写入路径生成、终身不变的身份，下游按它来指这条经验；身份不得改写，也不得挪给另一项机制用。

        供人扫读的标题必填、不超过 30 字，须简短标识机制本身，不复制症状全文；平台或环境专属时须在标题里凸显平台。

        创建时间与变更流水由写入路径填写，AI 不得自行填写。

    - id: dedup
      title: 建之前先查重
      text: |
        创建前须查重：对照全部生效中经验的归因落点与机制模式做语义比对，不以标题相似度或关键词重合裁决。

        同一失败机制的新表现或新触发样例已经存在 → 不新建，走补充级更新补进既有那条。
        不同机制的相似症状 → 各自成对象。

        查重结论须写进创建提案，缺它不得落盘。

    - id: cross-type-pairing
      title: 与摩擦账目同源时的处置
      text: |
        同源的另一条记录若属摩擦账目，不并入本类型，也不因此拒绝创建本条经验：两类记录的类型边界不因同源而消失。

        不论走哪条创建通道，落盘前都须读摩擦账本做配对核对，对照其中尚未销账的账目；本条只写经验，配对边由摩擦侧单侧记录，本侧不得写反向边。

        未做对照或对照未命中的，须在交还里如实登记对照范围。

    - id: entry-channels
      title: 创建只有两条通道，落点相同
      text: |
        创建只有两条通道，落点都是生效中：
        - 人直接提出：人给出经验内容，AI 整理成提案，经人确认后落盘；
        - 主控主动记录：主控在当次行动中发现一条已查明验证的失败机制时，整理该发现所需的上下文材料，
          派生一个以该材料为输入的代理起草记录，再由主控在同一动作内经受控写入并写后精确回读。

        同一触发不得同时走两条通道。两条通道落盘后都须精确回读整个对象文件。创建不必事前经人确认，人保留事后废止权；创建本身不含废止。

    - id: delegate-draft
      title: 起草代理只起草，不写入
      text: |
        派生的起草代理只起草，不写入经验目录、不取得授权或完成效力。

        主控须先把草稿精确落盘再交出，并以落盘草稿为准：落盘草稿缺失即判无结论，不得以交付消息的内容起草或写入。

        起草不合规、归属不符、写入失败或写后回读不完整时，不创建对象，并在同一次交还里如实登记未完成范围与残留风险。

    - id: context-supply
      title: 代理的判断材料全部由主控交付
      text: |
        起草代理零上下文派生：它判断所需的材料全部由主控交付，须包含与该失败机制对应的现象、触发条件、根因判断、
        已采用的解决、验证方式、影响范围各自对应的原始片段，以及既有生效经验与摩擦账目的候选投影。

        代理不得自行读取主控的完整上下文，继承不是可选的供给形态。

        引用的片段必须确实落在主控交付的材料内，不在其中的判断不成立；不得为凑满七段而援引无关材料。

    - id: create-quality
      title: 创建时须能据证据写全七段
      text: |
        生效中须能据证据写出七段：各段非空，不以占位符或「待查明」标记冒充。

        「验证」段的依据是逐字引证的证据片段与来源标识，不得凭记忆补写。

        会话留痕是第一来源，人提出的历史经验是第二来源。

        写不出症状、根因或解法中的任一段，说明材料不足，对象不成立——不得先落一条再补。

    - id: state-active
      title: 生效中意味着什么
      text: |
        生效中表示经验已验证且仍可信，参与执行前预检与故障调查。

        创建即进入该态；该态下不得出现终态处置说明。

        不得据「处于生效中」声明这条经验当前适用、被消费过或确实避免了损失。

    - id: state-discarded
      title: 已废弃意味着什么
      text: |
        已废弃表示经验不再适用，保留为历史基线，不进入普通候选。

        流转时须同时具备非空的处置说明，写清哪个前提消失了，且不超过 200 字符（按字符串长度计）；超限时拒绝写入，不得截断后写入。

        长度合规不构成处置正确的依据，不得据以声称终态处置已正确。

    - id: no-middle-state
      title: 不设中间态
      text: |
        经验一经创建即为生效中，不设「待确认」「待复核」一类中间态，也没有「先落候选、再升格」的两拍。

        不得以任何状态为名保存未查明的失败机制——那属于当次行动记录，不是经验。

        正文七段须据实写全的要求不因状态简化而降低。

    - id: no-reopen
      title: 终态不重开，内容可更正
      text: |
        已废弃是终态，不得回到生效中。

        终态对象的内容仍可更正；更正不得借机改变状态，也不得靠伪造一次状态转换洗白一条写错的终态记录。

        要重启一项已经不再适用的机制判断，按新对象路径建新的。

    - id: correct-vs-new
      title: 补充级更新与新对象的区别
      text: |
        下列走受控更新，每次恰好一条变更记录，不改状态：错别字与引用修正、不改变机制语义的表述澄清、
        同一机制的新表现与新触发样例补充、配对复审结论的登记、其他主体事后复现结论的登记。

        更新后适用范围须逐字段不变，变了就不是补充，走新对象。

        根因、解决、规避三段的实质更换不得以补充名义放行：判别锚是与既有根因判断相容，
        新触发要被当前根因解释得了，解释不了的属新机制。

        事后独立复现不构成创建或流转的前置，也不因此阻断任何创建或流转。

    - id: retire-human
      title: 废止一条经验须由人决定
      text: |
        废止一条经验须由人决定，AI 不得自行废止。

        提请前须精确读取该条，核对处置依据是否与事实相符；写入侧核对状态闭集、处置说明必填非空且不超 200 字符、写后回读。

        创建通道不得执行废止。

        不得以人的决定代替查重、载体核对或匹配判断。

    - id: recall-plan
      title: 方案收敛时怎么用
      text: |
        方案收敛装配前，须取相关生效经验的影响范围与触发条件作为规避依据：方案不得重蹈已知陷阱。

        方案违背某条经验时，该方案淘汰，并须记下违背的具体条目。

        只取生效中的，已废弃的不作为现行依据。

    - id: recall-precheck
      title: 执行前预检时怎么用
      text: |
        行动可能落入某条经验的已知影响范围时，取它的标题、适用范围、触发条件与规避，
        判断当前行动是否可能踩到、踩到怎么规避。

        预检匹配是语义判断：机械命中不等于适用，须逐个核对当前行动与适用范围的相容性；不建症状相似度自动匹配。

    - id: recall-failure
      title: 故障调查时怎么用
      text: |
        出现失败症状时，按可观察表现匹配已知经验，取标题与症状段回溯根因与解决，再核对规避是否适用于当前情形。

        匹配不上时，不得把一条症状相近、根因不同的经验当作依据。

    - id: recall-pairing
      title: 取用一条经验时反查同源的摩擦账目
      text: |
        执行前预检选中某条经验、或故障调查取用某条经验时，须反查与本条同源的摩擦账目，判断这套规避背后有没有尚未修掉的债。

        判据属于摩擦账目那一侧：本侧只负责取回并说明取回范围；取不到时按无配对处理，并在交还里说明反查范围。

        这一步不产生任何状态变化。

    - id: pairing-on-retire
      title: 废止一条经验时处置它的配对账目
      text: |
        本条经验要废止时，须先反查与本条配对的摩擦账目，再对每条作去向判定：债仍成立（机制仍在，只是不再用这套规避）、债已不成立（机制前提消失，对应账目应收窄范围或废弃）、或本侧判不了而移交人。

        判定与理由须在废止的同一次交还里给出，并能在处置说明或正文里回读到。

        判定不产生期限、优先级或排期，也不等于废止决定——废止仍由人决定。

    - id: pairing-resolved
      title: 配对账目已销账时复审规避
      text: |
        反查发现配对账目已被销账（问题已修）时，须复审这条经验的规避是否还需要：
        不再需要绕开就该提请废止；仍需绕开（回归、他处复用、同类接口）则保留，并在正文里注明触发条件已变。

        复审在下次触及这条经验时进行，不自动改状态。

    - id: pairing-voided
      title: 配对账目已作废时复审根因
      text: |
        反查发现配对账目已被作废（原账记错了）时，须复审这条经验的根因判断是否建立在同一错误前提上。

        判定根因同错时，按受控更新更正或按新对象路径重建，不得直接改状态。

    - id: recall-default
      title: 默认只看生效中的
      text: |
        默认候选只含生效中的经验；已废弃的只在精确引用或历史追溯时展开。

        召回分三层：先给生效经验的条数与可完整枚举的入口，再按类型、状态、命中词给候选，最后按需展开正文。

        按需索引须做到三条：给出的总数真实、枚举入口可用、不得声称这些经验已经核对过；放不下或取不到入口时须如实说明，不得让「没列出来」被读成「没有」。

        不得把词法命中说成已经找到全部相关经验，也不得因为候选被召回就认定它当前适用。

    - id: no-relations
      title: 不建关系边，配对不存副本
      text: |
        不设结构化关系字段，也不建第二张关系图：废止的谱系由处置说明的自然语言承载，与某次行动的贡献关联由行动侧承载。

        与摩擦账目的配对只在摩擦侧单侧存储，本侧不写反向边，也不得另存一份配对副本。

    - id: no-overclaim
      title: 存在不等于适用
      text: |
        不得以对象存在、处于生效中或经验条数增长，声明它仍然适用、被消费过或确实避免了损失。

        经验的价值只在预检与故障调查的真实消费中核对；不得以条数、被召回次数或页面呈现推断效用成立。

    - id: avoidance-not-rule
      title: 规避不取得强制规则的权威
      text: |
        规避是经验不是规则：不得把它当作强制要求执行，也不得据它拒绝一项行动。

        确实需要强制做法时，须另行立一份方向规范承载该做法；此时经验可以作为来源被引用，但不再独立承担约束。

    - id: stop
      title: 这些情况必须停下来
      text: |
        出现下列任一情况须停下：
        - 查重结论没完成就准备创建；
        - 无法据证据写出七段中的某一段；
        - 适用范围为空或不可读；
        - 准备以更新改写适用范围的实质，或更换根因、解决、规避的语义；
        - 终态流转缺少处置说明；
        - 未经人决定就准备废止；
        - 预检时引用了已废弃的经验作为现行依据。

        停下期间只做补取证据、修引用、补授权与条件核实。恢复须与触发原因逐项对应；同一条件恢复后再现，交人决定。

    - id: no-delete
      title: 不存在删除操作
      text: |
        不存在删除操作：已废弃的经验留在原目录里作为历史基线。

        终态对象的更正走受控更新，不改状态，也不把它搬走或改名。
