ldvh_spec:
  spec_key: norm-fact-type
  spec_kind: spec
  title: 方向规范
  canonical_path: plugin-specs/norm-fact-type.yaml
  positioning: 管项目自己定的一条方向性规则：这个方向管什么、什么时候该看它、怎么立起来、怎么退役
  scope: 要给项目立一条自己的方向性规则、或要判断某条方向性规则是否仍然有效时，查阅本文件

  carries:
    - "norm-fact-type::10. 召回与消费"
    - "norm-fact-type::6. 对象边界/6.1 什么构成一个对象"
    - "norm-fact-type::11. 受控操作"
    - "norm-fact-type::14. 验证与证据边界"
    - "norm-fact-type::15. Human Gate/15.2 确认的承载与呈报"
    - "norm-fact-type::5. 类型定位与价值"
    - "norm-fact-type::8. 字段契约/8.1 状态与生命周期"

  requirements:

    - id: what-is
      title: 什么算一条方向规范
      text: |
        一条方向规范承载项目里一个完整工程方向的成体系规则，供事前约束与事后核对。构成一个对象须同时成立四条：方向可独立召回；核心规则体系段里每条可强制执行规则都声明了它的强制面、保证面或核对主体；方向定位有清晰边界；正文有成体系的规则内容。它不同于项目目标、单条决定与执行计划。

    - id: systematic-test
      title: 什么时候算「成体系」
      text: |
        一个方向的规则算不算成体系，看三条中是否至少满足两条：
        - 有多条可独立执行的规则，每条都能被检查遵从性；
        - 有明显的管辖边界，与其它方向不严重重叠（重叠看核心规则与约束反模式两段，不看定位段篇幅）；
        - 有持续消费价值，在方案工作、代码实现、审计核对里被反复用到。
        三条都说不上的不立方向规范。

    - id: same-direction
      title: 两个候选方向是不是同一个
      text: |
        满足任一条就分设：
        - 主语不同：一个管机制或能力，一个管职责或判定；
        - 变更频率不同：一个随业务变，一个随技术变；
        - 责任面不同：违反的后果由谁承担、向谁负责不同。
        三条都高度重合才可以合成一份。

    - id: not-norm
      title: 什么不写成方向规范
      text: |
        下列不写成方向规范：单条决定或取舍记录；执行计划与已批准的行动；项目目标与子目标；外部证据调查；教训与规避经验；改进账本；对话里的临时约定；方向内子主题的拆分文件——它作为正文扩展或附件承载，不新建方向，也不分配新方向键。
        管的是插件自身机制、随插件版本对所有项目生效的开发规范，不属本类。
        零散决定沉淀成一个方向的成体系规则后，规则由本类承载，原决定记录不再承担约束；正文可以用自己的话交代该决定来自何处。

    - id: project-layer
      title: 只管项目层
      text: |
        方向规范只约束单一受管辖项目，随该项目走，不随插件版本发布。插件自身机制层与某一项目层可以各有一个同名方向，二者不算重复，因为约束对象不同。

    - id: carrier
      title: 一份规范怎么放
      text: |
        一个方向一份文件，平铺存放，路径形如 ldvh-base/norms/norm-<uid>.md。文件头是机器读的字段区，只放索引：方向键、标题、状态、创建时间、变更流水；规则整体住正文，不要求正文逐字复现文件头标量。
        正文只允许一个一级标题，由写入路径依标题生成；规则内容一律从二级标题起。
        正文若用文本声明方向键，须与文件头一致——文件头是唯一权威文本，正文不得声明与之矛盾的方向键。

    - id: identity
      title: 身份与标识怎么写
      text: |
        每份规范有一个由写入路径生成、终身不变的对象身份，下游按它指这份规范；身份不得改写，也不得挪给另一份用。
        方向键是小写 kebab-case 的扁平标识，不得做成层级或树状，方向怎么分层在正文里说。标题不超过 40 字。状态只有生效与退役，创建时只能是生效。创建时间与变更流水由写入路径填，AI 不得自行填写。同一方向键在生效集合里至多一份，历史里可有多份。

    - id: body-sections
      title: 正文固定四段
      text: |
        正文固定四段，创建时都须存在且各段非空：
        - 方向定位与适用范围：只写职责定位与查阅时机；
        - 核心规则体系：该方向的核心规则，可再分子节；
        - 约束与反模式：明确禁止什么、违反的后果；
        - 验证与遵从性检查：怎么检查是否遵守。
        缺段或有空段时不得落盘。

    - id: positioning-two-lines
      title: 定位段只写两句
      text: |
        定位段恰好两段，每段一条语句，段内不得有其它内容，两句各以固定标签起首：
        - 「管什么」：只作职责定位，不夹带规则条目、授权措辞、依据沿革或时间叙事；
        - 「何时查阅」：写行动场景（做某类事之前查阅本方向规范），不写成「本规范适用于某事」这种适用性断言，也不夹带授权措辞。
        两条各不超过 60 字（含标点，按去掉强调标记与反引号后的字符计），都须能脱离本段其余文字读懂，不以指代开篇；这两句随每回合注入。
        任一条不合上述形态时，两句都不外发：须标为机械导不出并点名是哪一项不合，注入面照旧列出标题行；不得只发半套，不得截断后外发，也不得改发整段。

    - id: enforcement-declaration
      title: 每条可强制执行规则要声明它的强制面
      text: |
        核心规则体系段里，每条能改变行动是否允许、何时必须停止、责任如何分配、必经哪些入口或验证、结果能否声明成立的规则，末行须写明三者之一：强制面、保证面、无机械强制面并注明由谁核对（写主体，不写机制名）。
        带种类的声明只有 gate、writer、pre-injector 三种；名称按首个冒号切分，须对得上写入侧可解析的登记。种类不在其中或名称解析不到的属假声明，创建与更新时逐条披露，只披露不阻断。
        更新时须复核已声明「无机械强制面」的条目，看它的强制面是否已经落地。
        声明存在只满足结构要求；不得据声明声称该规则已受机械保障，只有它的强制面已落地且会实际阻断时才可以这样声称。

    - id: enforcement-minimum
      title: 至少要有一条落在强制面或保证面
      text: |
        核心规则体系段内至少有一条可强制执行规则声明了强制面或保证面；整段只有「无机械强制面」的规范不满足这条结构要求。未满足时须在交还中如实披露这一项，不得说成已满足，也不因此拒绝落盘。

    - id: two-faces
      title: 强制面与保证面不能混说
      text: |
        强制面指已在机械面落地、会实际阻断的检查；只产提示不阻断的、规则写了没落地的都不计入。保证面指保证义务在场或输出完整的机械改写，它不拒绝、不暂停、不退回，不计入阻断覆盖，也不得据以主张已受机械阻断；每条保证面须写明适用范围与失效条件。两类互斥：同一条规则不得同时声明两者。

    - id: dedup
      title: 建之前先查重
      text: |
        创建前须查重：对生效中的规范做方向键精确匹配，再对标题与定位做语义比对。命中同方向已有生效规范时不得新建——修订走受控更新；方向本身变了，退役旧的、按创建路径建新的（新方向键），不得改写旧方向的方向语义。查重结论须写进创建提案，缺它不得提请。同义异名与上下位重叠机械层识别不了，靠语义比对。

    - id: create-needs-human
      title: 创建必须由人决定
      text: |
        方向规范的确立属项目规则架构决定，只能由人决定；AI 只能出创建提案，没有直接写入路径。提请前须把下列内容写进对话正文：查重结论、标题、方向键、定位段整段原文（两句都在，不截取要点）。边界主要靠核心规则条目界定时，还须给出那些条目的内容或准确指向。缺任一项不得提请；这些内容由对话正文承载，不得依赖提请弹窗携带。落盘后须精确回读整个文件。

    - id: retire-needs-human
      title: 退役必须由人决定
      text: |
        退役是把规范送进终态的唯一动作，须由人决定。理由只有三种：被新的一份替代（替代者须已存在且可读）、环境或前提变化使规范失效且无单一替代者、管辖范围整体不再属于本项目。进入终态须同时有理由与退役时间，缺一不得流转。提请前须在对话正文写清拟转状态、理由与这次改了什么，不得依赖提请弹窗携带。

    - id: terminal
      title: 终态不能回退
      text: |
        已退役的规范不得回到生效；要重启一个方向，按创建路径建新的，对象标识是新的，方向键可复用。已退役的保留为只读历史档案，不进入默认候选，只在精确引用或追溯时展开。不存在删除操作：退役且终态字段齐备即处置完成；生效中的方向规范不得带终态字段。

    - id: revise-active
      title: 生效中怎么改
      text: |
        生效中的规范可受控更新：每次以完整文件为界提交完整新内容，每次变更恰好一条流水，写明改了什么与为什么，首次修改后必有。方向键不得改变，纯标题修正不改方向键。管辖边界扩大或缩小、或删掉仍在生效的规则内容，都不算更新，须走退役加新建。只改表述、不改边界与规则含义的修订可走更新，并在变更流水注明属勘误；移出的内容须换个承载位写回去，不得借改写删掉活规则。

    - id: no-relations
      title: 方向规范之间不建结构化关系
      text: |
        方向规范之间不写关系字段，不建第二张关系图。跨方向约束由主方向的规范承载完整规则，别处用自然语言引用，不建双向关系；同一规则只在一个方向定义，别处只引用不重述。零散决定沉淀成方向规范后，规则归这份方向规范、原记录不再承担约束，但方向规范不写指回它的关系边；承接了哪些历史决定由读取侧派生，不落字段。

    - id: recall-duty
      title: 相关方向的义务召回
      text: |
        方案工作、代码实现、审计核对涉及某方向既有规则域时，开工前须召回并核对相关生效规范；不得以「用到时再看」替代这一步。未核对就开工，视同违背该方向规范。
        注入面每回合列出每份生效规范的标题行与两句定位摘录；摘录只用来判断该读哪份，命中者须先展开正文核对再动手。被列出不等于规则适用，也不占候选名额。
        标题行必出，摘录可以降级：放不下时只降级摘录并在段尾披露还有几条摘录未附出、几条定位机械导不出，不得静默丢弃，也不得以撤掉标题行换披露位置。

        常驻注入只保证每回合看得见，不得以它已生效声明规则已被读到或已被遵守。

    - id: read-by-stage
      title: 不同环节读哪一段
      text: |
        遵守预检时读方向键、约束与反模式、验证与遵从性检查，判断这次行动是否触及或违背规则。方案收敛装配时读核心规则体系：违背即淘汰，淘汰须记下违背的方向与条目。事后追溯与独立复核时读全文。默认候选只含生效中的；已退役的只在精确引用或历史追溯时展开。

    - id: direction-catalog
      title: 方向清单只是参考
      text: |
        方向参考清单帮项目识别自己需要哪些方向，不是强制枚举：不要求为清单每个方向都建规范。超出清单建规范时，须说明它为何不能归入已列方向，并经受控创建的查重核对。不得据清单断言某方向已有承载或某份规范正确。清单增减与重新分层属规范修改，须由人决定。

    - id: collision
      title: 方向键冲突时怎么处置
      text: |
        同一方向键同时存在多份生效规范时禁止继续：写入前须拒绝并报出冲突方向键；提交前须拒绝，载体解析不出方向键时同样拒绝；读取或呈现时两份冲突规范都不得作为当前生效规则返回，须按冲突披露。同义异名与上下位重叠机械层管不了，由创建前查重与人的判断承担。任何情形下不得把方向键唯一性说成已获完整机械保障。

    - id: stop
      title: 这些情况必须停下来
      text: |
        出现下列任一情况须停下：
        - 同方向键已有生效规范仍要新建；
        - 方向键为空或不符合小写 kebab-case；
        - 正文缺段或有空段；
        - 要在生效状态下改方向键或实质改管辖边界；
        - 要退役但理由或退役时间缺失；
        - 没取得人的确认就要创建或退役；
        - 消费时发现方向冲突。
        停下期间只做取证、修引用、补授权与条件核实。恢复须与触发原因逐项对应；同一条件恢复后再现，交人决定。

    - id: no-overclaim
      title: 存在不等于正确
      text: |
        不得以「对象存在」「处于生效」「四段齐备」「机械校验通过」声明规则正确、适用、已被遵守或方向覆盖完整；这些只能在遵守预检、方案装配与审计核对的真实使用中核对。
        报告时须区分已证实、未证实与缺口；未实现与不可用的范围须登记为缺口，不得以已有规范或检查已通过代替结论。

    - id: no-overdesign
      title: 不为了齐整造规范
      text: |
        不为小差异或低频场景单独建规范；不为清单每个方向造空壳规范；不把方向键扩展成层级键或树；不为方向规范建缓存、索引或投影副本。四段骨架只验形态，语义质量由人的审核承担，不因形态齐备就声称成体系。
