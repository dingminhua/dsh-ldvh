# 运行时机制：把关请示这一业务系统的要求清单。

ldvh_spec:
  spec_key: gate-consult-system-foundation
  spec_kind: spec
  title: 把关请示
  canonical_path: plugin-specs/gate-consult-system-foundation.yaml
  positioning: 管向人请示这件事：什么时候必须请、问什么、答复算不算数、痕迹留在哪
  scope: 要决定某件事是否该先问人、或要问人时，查阅本文件

  requirements:

    - id: what-it-is
      title: 产出是一次请示与一次答复的痕迹
      text: |
        这道把关的产出是过程痕迹：一次请示与它得到的答复被记下，
        或在不逐次征询时留下一次执行痕迹。

        三处请示：动手之前、收口之前、自查发现依赖外部信息时。
        它只提问，不写入、也不改变任何工作对象；风险恒为低，不设风险分层，不走快通道。

        不得以「请示已发出」或「答复已记录」声称当次工作做对、做完或价值成立。

    - id: complex-task
      title: 什么算复杂任务
      text: |
        一件事判为复杂任务，须至少命中一项：
        - 它要建立或修改一个结构性事物（体系、机制、契约、接口、规则集一类）；
        - 它在多个可选路径之间需要选型；
        - 它的方向可能与已经作出的决定冲突。

        下列不算复杂任务：方向未定、还没有可执行方案的议题；
        当次就能处理且不需跨会话保留的低风险改动；已经定下的决策的表达；
        需要持续跟踪的系统性阻碍；过程日志、逐条聊天、工具输出与单纯的执行提醒。

    - id: before-action-entry
      title: 动手之前那一处的进入条件
      text: |
        一件事判为复杂任务、整件没有命中点位排除、且尚未产生副作用时，
        须在动手之前请示：这次对候选的核对做不做、由谁做（安排代理／主控自审／跳过）。

        这一处问的是挑错，不是请人肯定方案；请示里不得写成「请看这个方案是否可行」。

        这一处的请示须带一段候选方案的摘要：不是字符串、去除首尾空白后为空、或超过 200 字符时，
        不得据这一次调用发出请示或派发代理，机械层直接拒绝这一次调用；补足摘要后可再次调用。
        计数按去除首尾空白后的文本长度算，段内换行与空白照常计入；超限时拒绝，不得截断后写入请示面。
        摘要写入请示面供人仅凭问题作答。静默档同样须带候选摘要；缺摘要被拒时按无法安排处理，
        停下并交还，保持该处所在工作未收口。
        摘要闸先于开关与档位读取判定，不因开关关闭或静默档而免。

    - id: before-closing-entry
      title: 收口之前那一处的进入条件
      text: |
        一件复杂任务的实际工作已经完成、准备形成完成声明或交还、尚未收口、
        整件没有命中点位排除时，须在收口之前请示：这次对已发生工作的逐条核对做不做、由谁做（安排代理／主控自查／跳过）。

        这一处的对象是「声称做到的事」逐条，不是方案，也不是还没做的事。没有确定结论就发起请示是空问。

        这一处的请示须带当前工作结论摘要（conclusion_summary），机械要求与 before-action-entry 的候选摘要闸完全对称
        （必填 1–200 字、进请示面、缺或超长即拒绝、不询问不派发不进静默档），把那里的「候选」换作「结论」即可。

    - id: research-entry
      title: 自查发现依赖外部信息时那一处的进入条件
      text: |
        自查判断当前的判断依赖外部对象的信息、而自己不掌握时，还须先查一遍项目内部：
        这个项目此前留下的经验记录、报告与事实规范，是否已经有过能回答这个问题的结论。
        查过之后才提请这一次联网取证做不做、由谁做（联网调查／主控自调查／先不查）。

        查过而没找到，只能是「按机制查过、未命中」这一读数，不能转写成「内部没有相关经验」。
        通用词相撞带来的命中仍算候选，不算「内部已有可用结论」，此时不因命中而免去提请。
        内部材料读不出来时记作未检查，不得记作未命中。

    - id: point-exclusions
      title: 三类工作不发出请示，排除不成立时照旧请示
      text: |
        当次工作整件属于下列三类之一时，两处请示都不发出：
        止于取得证据并形成调研结论；只是把已经形成的改动按提交契约落盘并推送；
        只是对既有事实对象做状态转换、补充记录、勘误级更新或受控退休。

        依此不发出请示时，须在交付说明里写明命中哪一类、当次工作的整体范围与判定理由；
        未写这一行，按未请示处理。

        当次工作不是整件只属于那三类时，排除不成立，照旧按复杂任务的判据请示；
        典型形状是还含规则文本或代码的实质改动、建立或修改结构性事物、
        新建事实对象或改变既有对象的适用范围、存在多个可选路径的选型、
        把调研结论落成规则或代码的那一步。

        判定以当次工作整体为单位，不按动作切分，不设一部分豁免、一部分请示的中间形态。
        把不属于那三类的工作记为已排除，属误用排除：须回到复杂任务的判据重新判定，照旧请示。

        排除只免去这两处征询，不免任何须人决定事项的提请，也不免方案收敛自查与自查本身。

    - id: exclusion-beats-mode
      title: 排除优先于档位
      text: |
        命中排除时，无论该处处于征询档还是静默档，都不发出请示，也不派发核对。
        不得因为该处处于静默档就照常派出核对执行体。

        这条优先关系只在两处请示之间成立，不外推。

    - id: independence
      title: 开关与档位各自独立
      text: |
        两处请示的询问开关相互独立：只开一处就只在那一处请示，都关就都不请示；
        第三处按自己的开关独立判定，不受前两处影响。

        执行档位逐点位判定，行动前与收口前各判一次，互不代替；
        不得用一处的档位推断另一处。两处档位可以相同也可以不同，差异是否可达由设定决定。

    - id: silent-subordinate
      title: 静默档从属于该处的开关
      text: |
        静默档是对「这一处的询问还要不要逐次发生」的预先答复，只在对应开关开着时成立。

        该处开关关闭时，静默档不成立：该处既不请示也不安排。
        不得把静默档当作对开关关闭的覆盖。
        开关关闭也不得被表述为禁止 AI 自行安排核对：关闭只表示这一处不发出征询。

    - id: silent-keeps-check
      title: 静默只免征询，不免那一次核对
      text: |
        进入静默档时该处不发出请示，但仍须安排这一环本该安排的那一次核对：
        行动前是对候选的独立核对，收口前是对已发生工作的逐条核对。

        免去的是询问，不是核对；不得以已进入静默档为由跳过该环。
        行动前那一环须带候选摘要；摘要缺或超长被拒时，按无法安排处理，停下并交还。

    - id: silent-not-expand
      title: 静默不外推到须人决定的事项
      text: |
        静默档只作用于这两处征询，不改变任何须人决定事项的提请义务：
        改变规则、受保护内容的同意、管辖登记的明确意图、各类型对象的建立与终态确认，
        都不受它影响。

        不得据静默档缩短这些事项的提请，也不得据它声明某件工作已完成。

    - id: unreadable-values
      title: 读不到取值时怎么处理
      text: |
        每一处发出请示前，须先读到该处开关与执行档位的当前取值。

        前两处的执行档位读不到时，按征询档处理：照常请示并声明这是回落，
        不得把取不到当作已进入静默档。

        前两处的开关状态读不到（配置未加载、读取失败）时，按关闭处理：不发出请示，
        并在交付说明里写明开关状态不可读、按关处理；
        不得报成关闭而不加说明，也不得反向默认开启。

        第三处不适用「开关读不到按关闭处理」这一条：该处开关读不到时不发出提请、
        也不安排外部取证，并在交付说明里写明该处开关不可读、按不可用处理；
        不得把它表述为该处开关已关闭。

    - id: silent-arrange-fails
      title: 静默档下安排不成立时
      text: |
        进入静默档后，若无法派生核对执行体（例如派发失败或结论不可回传），
        须停下并交还，保持该处所在工作未收口。

        执行痕迹须写明未能安排，不得记为已安排。

    - id: research-no-silent
      title: 第三处只有征询，不设静默
      text: |
        第三处用一枚与前两处同形的开关，缺省关闭：开着逐次提请，关着既不提请也不安排外部取证；
        关掉是配置行为，不得记为失败。

        它不设静默档：取舍对象是每一次具体的外部取证需求，
        两次需求即使主题相近，其问题、范围与关键词也可能不同，逐次征询不构成同一件事重复问。

    - id: uncertain
      title: 判不了的时候
      text: |
        判不了当次任务算不算复杂任务时，不请示，并在交付说明里写明本次未按复杂任务处理及理由；
        不得为回避判断而一律请示，也不得一律不请示。

        判不了当次工作整件是否命中三类排除时，按未命中处理，照常请示。

    - id: scope-once
      title: 一次请示只覆盖当次工作
      text: |
        一次请示只覆盖当次工作，不外延到后续任务。

        同一内容指纹的重试复用既有答复、不再发问；内容变更后须重新请示。
        行动前请示的候选摘要参与内容指纹；摘要内容不同即不复用既有答复，须重新请示。

    - id: question-form
      title: 每处只问一个问题，三选一
      text: |
        每处请示只问一个问题，须让人仅凭问题本身判断问的是哪件事、要决定什么：
        行动前问那次对候选的核对做不做、由谁做；收口前问那次对已发生工作的核对做不做、由谁做；
        第三处问这一次外部取证做不做、由谁做。

        每处三个选项，分界是两件事：安排代理与主控自己做分在「由谁执行」（那次都做，前者委托独立代理、主控收答案，后者主控按同一份任务要求亲自做）；主控自己做与跳过分在「做不做」（前者实做，后者不做直接推进）。前两处标签是安排代理／主控自审（自查）／跳过；第三处是联网调查／主控自调查／先不查。

        请示面须自足：人不回读对话也能作答；第三处须带一句要查清什么。
        行动前题面须带「候选摘要：…」、收口前须带「结论摘要：…」，摘要简明扼要。
        选项须直接表明后果，不得用「是／否」这类没有信息的措辞。
        主控自己做一档少了独立性这一层，选项说明须如实标注，不得把主控自审说成独立核对结论。
        第三处问的不是这件事该不该做；那是人的意图裁夺，不在请示面提出。

    - id: not-in-question
      title: 什么不写进请示面
      text: |
        不写入请示面：自己的推理过程与判据推导；规则条文复述；冗长的背景铺陈；
        「为什么我认为这是复杂任务」的自我论证。

        查过内部而未命中的读数写在对话正文与交还里，不塞进问题。

    - id: missing-input
      title: 必需输入缺失时
      text: |
        必需输入缺失时（尤其是当次任务的一句话描述），须以明确的占位形态标出缺，
        不得以推测填补。

        带占位的请示不进入答复复用；占位不被当作同一任务的标识。

        两处摘要是机械闸必需输入，不得以占位充当：缺摘要须先补齐再请示，不得据此发问。

    - id: answer-means
      title: 答复表明什么、不表明什么
      text: |
        答复只表明人在此处被问过，并给出了三档中的哪一档。闭集是 review（安排代理）／self-review（主控自己做）／skip（跳过）；第三处标签是联网调查／主控自调查／先不查。

        三档语义：review 委托独立代理做那次核对、主控收答案；self-review 由主控按同一份任务要求亲自实做一遍，不派代理，是硬要求——须在交付里逐条写明核对了什么、依据落点与残留风险，且少了独立性这一层、不得称独立核对结论；skip 那次不做、直接推进。

        答复不构成行动授权、范围放行、完成结论、质量判定或责任转移；
        取得安排不等于行动已被批准，取得不安排不等于工作不被要求把事做对；
        取得 self-review 也不证明那次核对真的发生了。

        请示不是行动放行的前提，也不使行动在取得答复前暂停；
        没有答复即没有决定，不得读成不安排。

        取得答复后这一处的职责即结束：核对的执行与结论判定不属本系统，本系统只留下这次请示与答复的痕迹；self-review 的实做由主控在本系统之外履行，本系统也无权校验它是否真做了。

    - id: silent-answer-distinct
      title: 预先答复与逐次答复须可区分
      text: |
        静默档的答复由人事先用配置作出，表明人已就该处询问给出不必逐次征询、按安排办理的预先答复。

        它与逐次答复效力相同、指称不同：逐次答复回答这一次要不要安排，
        预先答复回答以后这一处还要不要问。

        痕迹不得把前者写成后者，也不得写成人同意安排某一次具体工作。

    - id: trace-record
      title: 留痕记什么、放在哪
      text: |
        留痕记四项：请示点位、当次任务描述、答复值、时间。答复值取三档闭集之一：review／self-review／skip。
        第三处与前两处共用同一份痕迹，以点位区分，它的任务描述是要查清的那一句话；第三处的 self-review 同样记 self-review，不另立答复值。

        留痕不进事实源、不构成事实对象：它是过程痕迹，不按事实对象的准入条件处理，
        也不承担可被引用的证据义务。不得为痕迹另立一种事实对象，也不得另建第二份账本。
        内部查找的读数属过程信息，不进留痕。

    - id: silent-trace
      title: 静默档的痕迹
      text: |
        静默档的痕迹须写明：该处点位与该处自己的档位（不得以另一处的档位代替）；
        该处未发出请示，依据是配置里的预先答复而非当次答复；仍然将安排哪一次核对；
        与当次选择安排、当次选择主控自己做、当次选择不安排在措辞上可辨。

        不得写成已安排，更不得写成核对已完成。
        免去征询使当次人不在场；这一处的痕迹不得省略，也不得由另一处的痕迹代替。

    - id: trace-access
      title: 谁能读、能用到什么程度
      text: |
        主控与人可以读取留痕；后续会话可以按需回查同一内容的既有答复，以避免重复提问。

        跨会话的可回查性不被保证，它依赖宿主存储；不得把留痕当作长期证据，
        也不得据有记录声称某次核对真的发生过、真的安排过。

    - id: initiator
      title: 请示由谁发起
      text: |
        把关请示由主控发起，不由代理辅助任务发起；代理辅助任务不得代行请示。
        第三处同样只由主控在自查遇到依赖外部信息时发出。

        请示的答复只能由人给出，AI 不得代答或预设答复。

    - id: human-decide
      title: 这些事须由人决定
      text: |
        下列事项须由人决定，AI 不得自行改动：三处请示是否存在及其点位；
        三处请示的答复闭集有哪些档、各档「谁执行／做不做」的语义与主控自做档的实做义务；
        开关与执行档位的缺省值；执行档位由一枚开关统一作用于两处、还是按点位分别设定；
        三类不发出请示的工作的构成；
        行动前必带候选摘要、收口前必带结论摘要，及其字符数上限、是否进请示面、是否进指纹。

        人的决定只证明该决定及其作用范围，不替代当次是否算复杂任务的判断，
        也不替代核对是否发生过。

    - id: handback
      title: 交还须能回答什么
      text: |
        交还须能回答：在哪一处、该处处于哪个档位、答复或依据是什么。
        征询档答问了什么与答复是什么；答复为 self-review 时还须答主控自审/自查/自调查实做了什么、依据落点、结论与残留风险；
        静默档答依据哪一处预先答复未发出请示、将安排哪一次核对；
        命中排除答命中哪一类、当次工作的整体范围与判定理由。

        答不出时如实说明本次未请示及其理由，不得以已请示自述代替记录，
        不得以已按设置执行代替痕迹，也不得以这类工作不必问代替那一行声明。
        第三处另须写出内部查找的读数与提请结果；未取得答复须这样写，不得写成不安排。

    - id: stop
      title: 必须处置的情形
      text: |
        出现下列任一情况须处置：该处档位取值不可读，按征询档回落并声明，不阻断工作本身；
        静默档下无法派生核对执行体，停止并交还，保持该处工作未收口；
        开关或档位的读取结果与痕迹互相矛盾（例如痕迹声称静默而存在请示记录），
        暂停该处动作并报告。

        暂停期间只做读取、核对取值、登记观察与向人报告；
        不得据暂停前取得的默认值继续推进该处动作。

    - id: no-mechanical-guarantee
      title: 不对复杂度判断与核对是否发生构成机械保障
      text: |
        开关与档位只决定问不问；算不算复杂由 AI 判断，机械层不判定，判错或没判它不会拦。

        不得以按设置执行、开关已打开或有记录，声称请示已发生或核对已安排。
        不得据候选摘要闸或结论摘要闸声称空问已被拦住：它们只拦缺摘要与超长，不判摘要是否真是方案或结论。
        行动前那处若交还了本轮正文里主张与正文是否逐字对应的读数，那只是参考信息，
        不判定对错、不阻断分支，也不证明候选合格。

        本系统的请示不产生预检落实记录；触发判据是否被正确适用不由机械校验。

    - id: no-overdesign
      title: 不得为之增设层级与通道
      text: |
        不得为不问再增一层开关，也不得在开关与档位之外再造免问级别、审批权重一类没有对象的层级。

        不得把静默档做成授权通道：它只免征询，不得据以缩短须人决定的事项，
        也不得据以声明工作已完成。不得以档位判断代替复杂度判断。

        不得把第三处请示变成取证的授权闸门：不得据答复跳过外部取证的收敛判定与交付，
        也不得把已提请、未取得答复读成不许取证。
