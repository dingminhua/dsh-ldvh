# 运行时机制：火花记录的要求清单。

ldvh_spec:
  spec_key: spark-record-system-foundation
  spec_kind: spec
  title: 火花记录
  canonical_path: plugin-specs/spark-record-system-foundation.yaml
  positioning: 管一条方向线的出生与登记：什么值得留下来、怎么登记、怎么分流
  scope: 有一个还想不清的问题要留下、或要判断某条方向线是否值得保留时，查阅本文件

  requirements:

    - id: what-is
      title: 什么算一条值得跨行动保留的方向线
      text: |
        一条内容要成为方向线，须同时成立四件事：
        一、当次行动解决不了它，它须跨行动推进；
        二、核心能说成一个待答问题，而不是一段情绪或一堆关联想法；
        三、能说出什么条件下就不再推进它；
        四、能说出将来打算用它做什么。

        四项缺一，就不是方向线，不得登记。退出条件或后续用途说不出来的，直接判定不构成方向线，
        不得先登记再补。

        方向线不是目标：一条方向不因看起来重要、也不因被某个目标的声明引用而升格为目标。

    - id: not-a-direction
      title: 什么不算方向线
      text: |
        下面这些不登记为方向线：
        - 当次就能办掉的事，直接处理；
        - 已由某个位置完整承载的内容，指向那个位置，不再重复登记；
        - 过程日志、聊天残片、工具输出，留在会话记录里；
        - 单纯的执行提醒，归当次行动；
        - 已定的决策，归人的决定；
        - 已验证的失败机制，归经验记录；
        - 应修未修的系统性阻碍，归摩擦记录；
        - 已有同题方向，转向既有那条。

        内容的本质须是一个待答问题，才留在本系统：已经有结论、或已经有归宿的，不得留在本系统。

        一份内容同时含方向与其它去向时，按各自去向分别落位；每一项都须各自满足其去向的成立条件，
        不得以「反正已经有一个对象了」硬塞。

        无法判定一份内容该留在本系统还是交给别的承载时，不得先登记再分流；
        须按去向逐项核对，仍不能判定时登记为待决定事项交人裁定。

    - id: judgement-reason
      title: 不构成方向线的判定须说明理由
      text: |
        判定某份内容不构成方向线时，须在交还正文里写出理由，不得只给一个「未登记」的结论。

        该理由没有受控的落盘位置：不得据「理由已写」声称该判定已被核对或已有依据；
        理由是否成立由人判断。
        不得为此另开一份只记「不算」的清单。

    - id: stop-boundary
      title: 停止边界须在登记前写出
      text: |
        没有停止边界的方向不得登记，也不得以「先开着、以后看情况」补全。
        登记前须把停止边界写出来；写不出来，就判定它不构成方向线。

    - id: core-question
      title: 核心问题须能说成一个待答问题
      text: |
        只能说出「关于某事的若干想法」时，不得落盘为方向线。
        须先收成一个具体的待答问题，或退回不登记；宽泛的表述不能作为核心问题。

    - id: exclusive-options
      title: 互斥方案的处理
      text: |
        同一问题的两个互斥方案不必合并为一条，也不必强行择一：
        它们可以作为同一个问题下的不同当前理解，或作为两条相互引用的方向线各自保留。

        互斥关系本身须在两侧都写明，使后来的读者能看出二者冲突。

    - id: scope-of-one
      title: 一条方向只覆盖一个问题
      text: |
        一条方向线只覆盖它的问题与停止条件所界定的范围。
        后续出现相近但不同的问题，须重新判定是否同题，不得因相近而并入。

    - id: birthplace
      title: 出生地记的是什么
      text: |
        登记须把「这个问题第一次以一个可推进的形态被提出」记下来；
        不得把「这条内容曾经在对话里出现过」当作登记。

        登记时须使问题与停止条件本身就能读成一个待答形态。

    - id: single-entry
      title: 主线入口只有一个权威位置
      text: |
        方向线的主线入口只有一个权威位置。
        不得在会话状态、笔记或其它文件里维护一份「当前方向清单」并据以推进，
        也不得为方向线另建索引、看板或缓存。

    - id: priority-tier
      title: 处置档位不是价值声明
      text: |
        悬置中的方向须带处置档位，缺档位的方向不得创建或更新；AI 可以出初值，人可以调。
        悬置项须能按处置档位筛出与选取。

        档位只表达处置次序，不表达重要性，也不表达批准：
        不得为了让入口看起来整齐而推定档位，也不得以档位或其分布作为入口有效、方向被推进的证据。

    - id: dedup
      title: 登记之前先查重
      text: |
        登记前须查重：对照仍悬置方向的标题与问题做语义比对，
        并对照已终结的方向是否已完整承接该问题。

        查重是语义判断，不得建立相似度、词权重一类的自动裁决。
        查重结论须记录；未记录等同未做。

    - id: dedup-outcomes
      title: 查重结果怎么处置
      text: |
        同题且既有方向仍悬置：不新建，转向既有那条推进，可以更新它的当前理解。
        同题且既有方向已完整承接：不新建，登记为已存在并指向它。
        判为同题而处置须不同时：提请人裁定，不得在既有方向之外另开一条来规避判定。

        判不了是否同题时，不得按「先各建一条、以后再合并」处理：先查重，仍判不了就提请人裁定，
        并把查重结论记录下来。

    - id: merge
      title: 合并的判据
      text: |
        合并成立的条件是：它们回答的是同一个待答问题，只是从不同角度切入。
        各自的核心问题不同时，即使互相关联也不得合并，也不得为减少条目数而合并。

    - id: split
      title: 拆分的判据
      text: |
        拆分成立的条件是：一条方向里已经能分出若干具有独立目标、判断或跟踪价值的子问题。
        判据是能否独立处置，不是内容多少：内容再多而仍由同一个停止边界约束的，不构成拆分理由；
        内容很少但其中一个子问题已具备独立处置条件并会被分别安排的，构成拆分理由。

        多条潜在分流方向仍属同一个共同线索、尚未各自形成独立目标时，不要求立即拆分。

    - id: merge-split-not-done
      title: 合并与拆分只改变议题在哪
      text: |
        合并与拆分只改变议题在哪里，不改变做完没有。

        原对象进入终结只表示它不再以原形态悬置；
        被合并或被拆分的原对象一律不得标记为已落实，即使其中部分内容后来真的落地——
        那部分由承接它的对象自己承担完成语义。

    - id: business-not-order
      title: 只判业务，不写次序
      text: |
        本系统只判定业务上是否该合并、是否该拆分，
        不决定多对象写入以什么次序进行、失败后怎么恢复。
        不得为使两端一致而改写任一方为虚假内容。

    - id: suspended-not-progress
      title: 悬置不等于推进
      text: |
        方向线存在、处于悬置、档位已分档，都不说明它被推进过。
        推进的判据是可回指的动作：更新了当前理解、被当次行动承接、被拆分、被回答。

        仅仅被重新列出不是推进；也不得以召回次数或最后浏览时间冒充推进记录。

    - id: stale-not-discard
      title: 很久没动不是废弃理由
      text: |
        长期未被触碰不自动构成废弃理由。
        不得自建定时清理或「过期即废弃」来维护入口；废弃须有理由并取得人的确认。

    - id: terminal-not-done
      title: 终结不是完成
      text: |
        终结只结束该方向的入口职责，不表示下游对象已完成。
        消费一条终结方向时须读作「此处不再悬置，去向见它的记录」；
        不得把终结声明为完成。

    - id: recall-manner
      title: 方向线由人按需主动查询取回
      text: |
        方向线不进入每回合自动注入的路径：它不是每回合都须知道的内容，
        不得被动送进上下文。
        它由 AI 在需要时主动查询取回；诊断与显式检索同样可以取到，这一收窄只排除注入路径。

    - id: query-narrowing
      title: 主动查询须能收窄并报出命中字段
      text: |
        主动查询须能按状态、标题与问题里的字面子串、已声明的处置档位、以及所服务的目标锚收窄。

        命中的字段须逐个报出，不得只挑一个报。
        字面匹配只用于把候选缩到可读范围，不是同题裁决。

    - id: narrowed-vs-full
      title: 收窄结果与全量列举不是一回事
      text: |
        未收窄的全量列举回答「有哪些悬置方向」，不带命中依据。
        收窄后的结果是按字段命中的匹配集，每条须带命中依据。

        两者不得混为一谈；收窄过的结果须标注为筛过的命中集、不是全量，
        零命中不得被读成「没有这类方向」。

    - id: consumption
      title: 什么时候值得查、什么算被消费
      text: |
        值得主动查的时机有四种：讨论与规划时看是否已有前情；
        行动前看能否顺带推进某条；交还时看是否产生了新方向、或使既有方向发生实质变化；
        周期性浏览时由人处置积累的悬置项。
        这四种只说明什么时候值得查，不产生自动调度义务。

        一条方向被真实消费的标志是：它使某次判断、某个讨论方向或某项行动与没有它时不同；
        仅被列出、被检索到、被浏览过，不构成消费。

    - id: human-gate
      title: 这些处置须取得人的明确回应
      text: |
        合并、拆分、落实与交接、废弃、同题争议的裁定、归属存疑内容的最终归类，
        均须取得人的明确回应；本系统给出判据与候选处置，不产生决定。

        提请须带上核心问题、停止边界、查重结论与拟处置方式，使人能对「这条方向怎么处置」作实质判断；
        不得只提交一份结构完整的对象而不说明处置意图。

        人的确认只证明该决定及其作用范围，不使被合并的内容自动获得承接对象的完成语义。

    - id: readback
      title: 落盘之后须读回什么
      text: |
        落盘之后须把刚写下的那一条读回来核对：字段齐、结构全、说明与状态对得上。
        合并、拆分这类多对象处置，须在全部步骤完成且每一条都读回通过之后才可以声明完成；
        不得以部分成功拼成整体成功。

        读回来的内容与原候选不一致时，该次落盘不成立；落盘失败、读回不了时停下。

    - id: risk-path
      title: 默认走哪条路径
      text: |
        默认按标准路径执行：四项判据已核对，查重已作且结论已记录，内容的事实归属已核对。

        单条方向线的登记与当前理解更新可以走快通道，但查重结论仍须记录。
        合并与拆分须走加固路径：须有业务判据说明与影响面界定，并经人确认。

    - id: stop
      title: 这些情况必须停下来
      text: |
        出现下列任一情况须停下：
        - 查重结论指向既有方向却仍另开一条；
        - 没有停止边界的方向被登记；
        - 核心问题说不成待答问题却落盘；
        - 已有结论的内容留在方向线上；
        - 把终结读成或说成完成；
        - 合并或拆分未走完全部步骤即声称完成；
        - 受控写入失败且回读不可用；
        - 在别处维护方向副本并据以推进。

        停下期间只做：补做查重、补齐停止边界、补登记缺口、把已有结论的内容迁出方向线。
        不得继续以悬置冒充推进，也不得在查重未完成时新建同题方向。

    - id: not-authorization
      title: 方向线不构成授权，也不证明在推进
      text: |
        方向线存在、处于悬置、档位已分档，都不使任何行动获得授权；
        优先级只表达处置次序，不表达重要性，也不表达批准。
        登记、合并、拆分、转终结，都不产生完成结论。
        方向线也不产生约束：推进中的行动仍须通过行动前的检查。
        不得以方向线数量或推进速度声称项目在有效推进。

    - id: entry-not-log
      title: 入口不得做成全量日志
      text: |
        登记放宽时须以分流与终结纪律收口，不得只放宽不收口。
        不得让一条方向长期承载多个已可独立处置的子问题，该拆则拆；
        同样不得为了整齐而过度拆分。

    - id: handback
      title: 交还须说明什么
      text: |
        交还须如实说明：
        当次是登记了哪条方向、判为同题、发生了合并或拆分，还是判定不构成方向线；
        四项判据的自检结论、查重结论与分流核对结果；
        已核实的是入口与去向的可回指性，未核实的是这条方向是否值得推进、是否会被真正推进；
        残留风险与待决定事项逐项列出；
        未查重、未回读、入口尚存噪音等未兑现范围据实说出。
