# 运行时机制：子目标这一事实对象的要求清单。
# 身份字段 6 项：spec_key / spec_kind / title / canonical_path / positioning / scope。

ldvh_spec:
  spec_key: subgoal-fact-type
  spec_kind: spec
  title: 子目标
  canonical_path: plugin-specs/subgoal-fact-type.yaml
  positioning: 管目标下面的一个可核对的下级事项：它怎么算达成、什么时候算完、挂在谁下面
  scope: 要把一个目标拆成可核对的下级事项、或要判断某个下级事项是否达成时，查阅本文件

  requirements:

    - id: what-is
      title: 什么算一条子目标
      text: |
        一条子目标要同时具备五样东西：
        一个稳定身份（终身不变，下游按它来指这条子目标）；
        一条可判定的达成条件（写成「出现哪类材料即说明达成」）；
        一段对齐说明（它为什么服务于上层目标）；
        一个状态；
        一个可选的显示次序。
        粒度是单条子目标：不是一次拆解、不是一组判据，也不是某件工作。
        不得据一条子目标存在、字段齐备，声称它正确、充分、确实围绕上层目标。

    - id: two-layers
      title: 层级只有两层
      text: |
        上层是目标（一个项目一个），下层是子目标（可以有多个）；子目标之下不再设第三层子目标。
        子目标名下的工作由当次行动或火花声明「服务于哪条子目标」来指向它；拆解情况与落实情况一律按这些声明反查派生。

    - id: not-subgoal
      title: 什么不算子目标
      text: |
        下列内容不形成子目标：
        上层目标陈述本身；单个方向、或还有待调研的问题；已定下的决策；某轮执行的计划与验收；项目自己的价值约束；永远判不了的使命式表述；属于别的项目的子目标。

    - id: criterion-is-not-task
      title: 达成条件不得写成任务完成
      text: |
        写成「完成工作 X」「关闭 N 件工作」的，不是达成条件——那是拿任务完成冒充子目标达成。
        达成条件须描述「出现哪类可判定材料」，行动收口只是其中一类材料的来源之一，不自动等于达成。

    - id: criterion-kind
      title: 达成条件须带一个判据类型
      text: |
        每条达成条件须带一个判据类型，从三种里取一种：可核对的度量值达到某阈值或区间；某类对象的关闭记录链构成达成材料；一个可复现的核验动作通过。
        判据类型是对象自身的一部分，随条件一起建立、一起被引用；它若变更，判定口径随之改变，属实质修订，须人确认。
        给了类型却指不出材料从哪来，条件仍不可判定；不得据类型已给声称条件可判定。

    - id: alignment
      title: 对齐说明要指向具体内容
      text: |
        每条子目标须带一段非空的对齐说明，指向上层目标陈述里的具体内容，并说清为什么不是别的手段。
        它使「围绕总目标」成为可逐条核对的文本；写成放哪里都成立的套话即失去这个作用。
        不得据说明非空声称对齐成立；对齐是否真实属语义判断，须逐条核对。

    - id: identity
      title: 身份与标题
      text: |
        每条子目标有一个由机械生成、终身不变的身份，下游一律按它来指这条子目标；身份一经生成不得改写，也不能转给另一条子目标使用。
        供人扫读的名字由标题承担：标题必填、不长于四十字、不承载完整条件；列表按标题呈现，不按序号呈现。
        标题可以改，身份不可以改；文件名与身份一致，文件名变更不产生新身份，但须按受控更新留痕。

    - id: display-order
      title: 显示次序可以自由调整
      text: |
        显示次序是一个可选的正整数：可以不填、不必唯一、不必连续，也不需要给作废的对象留位。
        它只决定列表里的先后，不承担任何引用职责，因此可以随时按人的意图调整。
        缺失次序的对象按创建时间排在已有序的对象之后。

    - id: states
      title: 三种状态与各自的成立条件
      text: |
        三种状态：
        推进中——已确立、仍在推进；建立即进入，条件与对齐说明齐备。
        已达成——达成条件已被证据判定成立；判据所指材料可回读、证据清单可逐条回指、人作终判。
        已作废——原位作废（失效、不再有意义、或被上层修订吸收）；人作决定，作废说明非空并写明去向与既有引用怎么处置。
        已达成与已作废都是终态；作废说明只在已作废时出现，其余状态不得出现。

    - id: no-reopen
      title: 终态不重开
      text: |
        已达成、已作废都不得回到推进中。
        条件失效时新建一条子目标，而不是重开旧的那条——这样「曾经达成过」这一历史事实不被抹去。
        不存在不经人确认的自动流转：任何状态变化都须人决定。

    - id: achievement-evidence
      title: 判定达成前要做什么
      text: |
        判定达成前先把这条子目标与它名下的工作精确读一遍，按判据类型汇总一份证据清单，逐条说明材料如何满足达成条件。
        发现缺口就列出缺口，不得补造、不得掩盖。
        不得用「名下工作都完成了」代替达成判定。
        机械层给出的是记录存在与格式；是否真的满足条件属语义判断，最终由人判定。

    - id: dedup
      title: 建立之前先查重
      text: |
        查重只看一层：新条件的语义是否与既有子目标的达成条件互相蕴含或实质重复。
        不得用相似度分数、关键词重合度或序号是否冲突来裁决——这里没有可机械裁决的一层。
        查重结论是提案的必填部分；未经查重的候选不得提请人确认。
        查重不成立时，换条件，或把新条件并进既有那条的达成条件；不得「先建起来、之后再合并」。

    - id: precheck
      title: 提请人确认前先跑一次机械预检
      text: |
        把一份子目标候选提请人作建立决定之前，先对这份候选跑一遍机械核对：由机械生成的身份不得自带、字段合法、标题不超四十字、次序为正整数或缺失、条件非空、条件类型是三选一、对齐说明非空、初始状态为推进中且没有作废说明。
        没通过的候选不得提请；修好之后重跑预检，不得反复试写。
        预检只读、不落盘、不生成对象标识；预检通过不得被当作条件充分或对齐真实的证据。
        预检通过后，提请与写入之间候选内容须逐字一致（生成身份、字段类型与创建时间除外，初始状态由写入钉死为推进中）；内容改了，就重跑预检。

    - id: create-human
      title: 建立子目标须取得人的确认
      text: |
        每条子目标的建立都须取得人的明确确认，不得由 AI 代为完成。
        AI 只产出提案对象（含查重结论与完整字段），人确认后经受控创建入口落盘。
        沉默、没有反对都不算确认；确认只在当次有效，确认的是当次那份提案。

    - id: substantive-change
      title: 实质修订与补充级更新的区别
      text: |
        改达成条件、改条件类型、重写对齐说明，改变了判定口径，属实质修订：须经人确认，并说明理由。
        只改条件表述、补对齐说明、更正标题、调整次序，不改变状态，属补充级更新：走原样更新，不动身份。
        更正只改错述，不得借更正之名改变已作出的判断结论。

    - id: serves
      title: 下游怎么指向一条子目标
      text: |
        下游声明「服务于哪条子目标」时，那个身份须解析到一条推进中或已达成的子目标，且它挂的上层目标可解析为当前项目目标。
        任一条件不成立即拒绝受理，不得降级为空值，也不得指向替身。
        已作废的子目标不再是有效目标，新的声明不得指向它；已达成的仍是有效目标——「这件工作曾服务于那条已达成的子目标」是历史事实。
        既有声明的原值不改写。

    - id: parent-anchor
      title: 每条子目标都带着上层目标的引用
      text: |
        每条子目标都带着它服务的上层目标，该值须与目标载体里的目标身份一致、且目标载体可读。
        目标载体缺失或对不上时，这条子目标是悬空锚：须报告，不得静默降级，也不得拿别的文件顶替。

    - id: no-derived-copies
      title: 不在子目标一侧存副本
      text: |
        不得在子目标一侧存储名下工作的状态、进度百分比或聚合计数；拆解情况与落实情况一律按下游声明反查派生。
        同一个事实在两处各存一份，两处会分叉，且无法判定哪一处权威。

    - id: empty-set
      title: 名下没有声明时怎么说
      text: |
        名下没有任何声明指向时，呈现须标注为「未声明或未拆解」，不得折算成某个进度值。
        空集既可能真没拆解，也可能是拆了但下游没声明——这两种情形机械不可区分，须显式提示，由人在核对时分清。
        不得用一个状态值去猜缺声明的原因。

    - id: body-structure
      title: 正文的两块固定内容
      text: |
        正文有两块固定二级标题段：达成条件（条件的展开：判据全文、判定材料从何而来、判定时的核对动作）与对齐说明（对应目标陈述的哪一部分、为何不是别的手段）；两段须存在且非空。
        一级标题只有一个且与标题一致，由写入入口生成；正文从二级标题写起。
        字段承担索引、正文承担展开，二者无需逐字对应；出现差异只做如实报告，写入照常进行。

    - id: change-log
      title: 写入留痕由入口托管
      text: |
        对象形成时间由受控创建入口填写，AI 不得填写、不得改写。
        每次实际修改恰好追加一条变更流水，时间与署名由受控入口托管，AI 只提供一句话语义摘要；更正与状态流转同样各留一条。

    - id: no-delete
      title: 删除不存在
      text: |
        不设删除操作：项目退役时子目标随项目目录留作历史档案，不通过删除移除。
        不得以删除代替作废，也不得以删除抹掉一条历史引用。

    - id: no-batch-atomic
      title: 不声明多对象原子变化
      text: |
        本类型不声明多对象原子变化：批量迁移与批量状态流转须逐份受控执行、逐份回读，不得宣称原子性。
        一次操作只处理一个对象；多个对象同时变化不构成一次成功。

    - id: recall
      title: 什么时候取回、默认取哪些
      text: |
        子目标走候选召回，不走单例直读。
        行动起点、授权提请、达成证据汇总与目标修订后的对齐核对，都是取回它的时机；行动起点没有适用的子目标时须如实说明，不得硬挂。
        默认候选只含推进中；已达成与已作废只在精确引用、历史追溯或达成证据汇总时展开。
        召回按标题与达成条件匹配；召回一条子目标不使它获得授权，也不使其判据变得可判定。

    - id: mechanical-bound
      title: 哪些能机械核对、哪些不能
      text: |
        机械层只核对字段闭集、次序形状、条件非空、条件类型在闭集、上层锚可解析、正文与字段差异、状态与作废说明互斥、身份未被改写。
        四件事不可机械判定：条件是否真能判定、对齐是否真实、查重结论是否成立、证据是否覆盖条件；它们由 AI 判断加人确认承担。
        不得把语义判断包装成机械结论，也不得为「子目标是否服务于总目标」另设机械门禁。

    - id: stop
      title: 这些情况必须停下来
      text: |
        出现下列任一情况须停下：
        准备把一条子目标的身份当成另一个事项的身份来用；
        没有取得人的明确确认就要建立或流转；
        条件判不了却准备落盘；
        上层目标无法解析；
        同一个身份出现在两条载体上；
        子目标一侧存了名下工作的状态副本；
        写入失败、回读不可用。
        停下期间只做：补齐条件自检与对齐说明、修正身份冲突、登记悬空引用与未验证范围、把判不了的表述退回重写。
        不得继续用带着停止原因的子目标推进行动或受理行动提请。

    - id: not-authorization
      title: 子目标不构成授权，也不是质量证据
      text: |
        有一条子目标挂着，不构成做任何事的授权，也不替代行动前的检查。
        不得以字段齐备、次序连续、序号整齐作为子目标质量的证据。
        不得为子目标设统一数量配额，也不得给每件工作都立一条子目标——数量由真正可判定的达成条件决定。
