# 运行时机制：一份自足的要求清单（所有事实对象共有的公共规则）。
#   本文件不引用任何其它载体；需要别处的东西时，用自己的话把要求写出来。
#
# 运行时机制没有编号：唯一标识是 spec_key（不参与规范模型的编号登记）。
# 身份字段 6 项必填：spec_key / spec_kind / title / canonical_path / positioning / scope

ldvh_spec:
  spec_key: fact-model-common
  spec_kind: spec
  title: 事实对象公共规则
  canonical_path: plugin-specs/fact-model-common.yaml
  positioning: 管所有事实对象共有的那几条：写之前必须满足什么、来源怎么记、关系什么时候失效、写入后必须做什么
  scope: 要新建或修改任何一条事实对象、要在事实源里写东西时，查阅本文件

  requirements:

    - id: stable-fact-not-auto-object
      title: 稳定内容不因模型存在而自动对象化
      text: |
        普通文件能无损承载的稳定内容，不因这套事实模型存在而自动变成事实对象。
        聊天记录、运行状态、缓存、索引、工具响应、提交记录和网页视图都不自动成为事实对象，
        也不构成事实对象之外的第二个事实源。

        一条内容要成为事实对象，须同时具备稳定身份与唯一权威位置，
        并且需要被独立读取、核对、关联或更新。缺一项就不对象化。

    - id: admission-before-create
      title: 新建之前先回答准入问题
      text: |
        新建对象前须能据实回答六件事：为什么要在当次上下文之外保留它；
        为什么需要独立身份、边界、状态或证据管理；普通文档或已有的对象为什么不能无损承载它；
        它服务谁；维护、查重、召回与迁移的成本会不会抵掉它的净价值；它的定义由哪条当前规则承担。

        「文件已存在」「历史上同名」「已经有页面或解析器」不能单独支持新建。

    - id: ai-assertion-not-source
      title: AI 自己的判断不构成内容来源
      text: |
        AI 自己的断言、推断或偏好，未经人明示，不构成事实内容的合格来源。

        AI 的产出可以是提案、草案或候选；它不因为被写进候选而取得「这是事实」的地位。
        要让一条内容以事实身份落盘，须另有可指出的来源或人的明确确认。

    - id: unique-scope
      title: 每次读写先钉住唯一范围
      text: |
        每次读写前须先形成唯一范围：哪个管辖项目、哪份实际工作树、哪条当前规则、哪套类型定义，
        以及当次的作用范围与未验证范围。类型定义就是这一范围里的类型权威：目录位置、Schema、代码或工具响应都不替代它。

        任一项不唯一、缺失、互相冲突，或与上位要求、人已定决策冲突时，受影响范围零写入，并按不可用或部分交还。
        不得用计划、缓存、候选编号、路径猜测或工具成功替代实际范围。

    - id: one-authority-carrier
      title: 一个对象只有一个权威载体
      text: |
        每个事实对象只有一个当前权威载体。读取以当前工作树中该载体此刻的内容为准；
        暂存区、历史提交、缓存、投影卡与网页视图都是派生结果，不替代它。

        找不到载体、出现两份候选载体或身份冲突时，不得静默挑一份继续读或写，
        须交还实际检查范围并停下。

    - id: identity-by-machine
      title: 身份与创建时间由机械生成
      text: |
        对象身份与创建时间由机械生成并写入，创建后身份不变。
        AI 不得自造、填写、覆盖或按标题推导这两项；创建入口也不得接受调用方提供的身份、
        创建时间或其它托管值。

        更新不得更换身份。旧标识只作迁移输入，不进入当前对象、关系目标或并发基线。

    - id: header-mirror
      title: 正文自二级标题起，一级标题由机械镜像
      text: |
        对象正文自二级标题起；一级标题由机械从对象标题镜像生成，恰好一个，位于正文最前。
        调用方提交的正文不得自带一级标题，也不得在正文其它位置重复一级标题。

        二级标题及以下各段的次序与必填性由该事实类型自己规定；
        「正文自二级标题起」这一层对所有事实类型一致。

    - id: fingerprint-baseline
      title: 写前持有当前指纹作为并发基线
      text: |
        写入前须持有由目标对象当前完整载体内容算出的指纹，作为并发基线；
        该指纹只能来自实际载体内容，不得用重新序列化、缓存摘要或自述替代。

        指纹不匹配、目标消失或目标不可读时零写入并报告拒绝范围。
        写入成功后须取得新指纹，不得继续沿用旧指纹。只读查询不因此被强制先取写入基线。

    - id: input-required-set
      title: 入参必填面以类型登记为准
      text: |
        写入入参的必填面，以该事实类型登记的必填项为准，且只算调用方提供、不由机械托管的字段；
        托管字段不经入参提供，不计入必填面。

        工具声明与登记不一致时以登记为准，并把该不一致作为实现漂移在交还中报告：
        不得因工具更宽就放行缺项，也不得因工具更严就自行加设登记里没有的必填项。
        登记缺失时该通道按未确认处理并零写入。

    - id: precheck-equivalent
      title: 有预检入口就先跑等价预检
      text: |
        该通道有只读预检入口时，写入前须跑一次与写入内容等价的预检，按指出的问题修正后重跑，
        确认通过才执行实际写入；预检结果不可判定或取不到时按未通过处理。
        不得以多试几次的方式绕过预检结论。

        没有预检入口的通道不虚构预检义务，但须在交还中把「未做入参预检」登记为未兑现范围，
        不得把「未声明有预检入口」当作「确定没有」。

    - id: after-complete
      title: 修改须提交完整的目标后态
      text: |
        修改须用完整的目标后态替换，不得使用未定义的差量合并或静默补丁。

        后态须原样携带基线中仍然存在、未被本次改动、且仍有消费价值的全部字段。
        少一个字段即按不完整处理，零写入并报告拒绝范围；
        不得让这种缺失以「调用成功」的形式呈现。

    - id: field-channel
      title: 只有经字段通道提交的才算改动
      text: |
        只有经该事实类型规定的字段通道提交的赋值，才算对某个字段的改动。
        工具参数面上、通道之外的同名字段不构成赋值，也不构成「后态已保留该字段」的主张。

        该形态须在参数层被拒绝，或由实现方明确报告，二者不得缺一；
        不得静默并入，也不得静默忽略后照常返回成功。

    - id: change-log-once
      title: 每次实际修改追加恰好一条变更记录
      text: |
        每次实际改变对象内容，须在同一写入事务里追加恰好一条变更记录；
        时间、署名与对象身份由机械填写，AI 只提供一条简短的语义摘要。

        摘要缺失、为空或无法据实说明变化时写入不成立。
        零变化、拒绝、失败、未落盘与只读访问都不追加记录；
        变更记录不扩张成完整差异、工具日志或责任流水。

    - id: source-recorded
      title: 写清内容从哪里来
      text: |
        写入时须在对象里写清内容从哪里形成或观察到，并写清该来源能支持到什么范围。

        来源回指只回答「从哪来」，不证明内容正确、证据充分、当前适用或已获授权。
        来源缺失或无法对照的，须在交还中如实标注为未验证范围。

    - id: evidence-self-contained
      title: 权威对象的证据须自带
      text: |
        依据有容量上限或保留期的中间材料形成的对象，须在自身正文完整写下据以形成结论的
        证据片段与来源标识；中间材料只能作为来源指针。

        不得让一个长期成立的对象把证据链挂在可被淘汰的载体上：
        载体一旦被淘汰，对象就降级为无法核对的转述。

    - id: relations-minimal
      title: 关系条目只存最少三样
      text: |
        每条关系只保存三样东西：该事实类型定义的关系键、可稳定解析的目标引用，
        以及该类型采用证据定位时的证据指向。

        不复制目标标题、关系解释、授权、责任编号、反向导航或网页投影；
        这些由机械派生，不写回对象。

    - id: relation-key-closed
      title: 关系键取自闭集，目标须可解析
      text: |
        关系键须属于该事实类型当前定义的闭集，出现未知键即拒绝。

        目标须能按当前事实源规则稳定解析；跨项目关系默认不视为已获允许，
        须有人明确决定才能建立。关系方向、目标类型、基数和目标状态条件由定义该关系的类型规定，
        不另立通用关系家族。

    - id: commit-target
      title: 解药未对象化时可以指向一次提交
      text: |
        解药本身是一次受控提交、且没有任何对象身份可指时，目标可以直接取一次提交：
        须是 40 位十六进制、能在受控仓库中解析为提交的哈希。
        短哈希、分支或标签名、非十六进制串一律拒绝。

        同一修复已有可指对象时，须指向那个对象，不得用提交替代。
        提交形态与附加在对象目标上的证据定位不同时使用。

    - id: relation-failure
      title: 目标失效时保留边与失败范围
      text: |
        目标缺失、不可读、已退役，或关系被过滤、来源未检查时，须保留实际存在的边和失败范围，
        不得报告为「无关系」，不得静默删除或改写这条边。

        消费方须能区分五种情况：当前可解析、已声明但目标缺失、目标不可用、关系被过滤、
        关系尚未检查。

    - id: relation-vs-content-ref
      title: 生命周期关系与内容关联各走各的
      text: |
        合并、拆分、替代这类生命周期关系只能走关系键闭集，不得写进普通内容关联。

        普通内容关联不得自立成关系键，也不能改变任一方的状态或生命周期；
        外部资料只进外部链接字段，不用本机路径、日志或提交定位符替代；
        载体内部的锚点不进关系，按该字段自身的语义处理失效。

    - id: read-back-after-write
      title: 写后精确回读再往下走
      text: |
        写入后须从实际定位精确回读当前载体，核对对象内容、指纹与当次机械结果，
        并检查有没有未完成、未验证的范围和残留。

        回读通过只证明当次写入在当次范围内成立。回读失败或结果不一致时，
        不得继续下一步，也不得复用写入前的指纹。

    - id: stop-on-residual
      title: 有残留就停下，不绕回直接改
      text: |
        创建或更新结果不确定、部分成立、回读失败，或无法排除残留时，
        须停止后续写入、提交与成功声明，并交还实际残留范围。

        失败后只可使用被允许且范围匹配的回滚或更正入口；
        不得直接编辑权威载体绕过它。

    - id: multi-object
      title: 多对象一次成立须先有原子能力
      text: |
        只有在当前规则已定义覆盖该范围的一次原子操作、且能同时保证目标、关系、基线与回读时，
        才可以声明多对象一次成立。

        做不到时不得先写孤立的新对象再补关系，不得用多个单对象成功拼成整体成功，
        也不得用补偿更新制造假原子性：保持全部对象原状，
        并交还拟变更范围与能力缺口。

    - id: partial-handback
      title: 部分结果分开交还
      text: |
        部分或不可用的结果须分开交还：哪些已完成、哪些未完成或未检查、
        有哪些已观察或无法排除的残留风险、以及可以继续的精确入口。

        任一分页、关系边、对象集合、审计或写入范围未完成时，
        不得用空值、工具成功或已完成的那部分代表整体完成；
        已完成部分可以继续用，但不得越过未完成部分宣布成功。

    - id: mechanical-not-semantic
      title: 机械结果不等于事实结论
      text: |
        机械有效、指纹匹配、工具成功、对象存在、页面能显示，都不能单独证明事实真实、
        证据充分、当前适用、已获授权或工作完成。

        这些结论须由当次语义判断承担，并如实写明依据与未验证范围；
        不得把机械结果写成事实结论或完成声明。

    - id: type-routing-order
      title: 内容归属按固定次序核对
      text: |
        一段内容要跨行动保留时，须按固定次序核对归属，取第一个成立项：
        必须被遵守的约束归规则源；尚待推进的方向或未决问题；主张这里有笔该修的账；
        主张这里有套可复用的规避；已收敛的调研、阶段性总结或独立审核的完整结论；
        以上皆不成立时不进入事实源，作为普通文档保留。

        次序的意义是门槛高者先命中：同一内容既像约束又像别的东西时，先按约束处置。
        进入规则源须经人决定，归属核对本身不构成该决定；判成约束不等于已经获准进入。
        同一根源可以既是一笔该修的账、又是一套可复用的规避，两条都写、各自满足成立条件，不取第一个成立。
        一份内容含多个去向时按项分别落位，每项各自满足其成立条件。

        一个项目至多一个目标、子目标依附于它，这两者不是本判断的对象。
        归属判定是语义判断，不设机械门禁；交还须说明据以判定的对象边界依据。

    - id: common-field-adoption
      title: 公共字段按类型登记采用，缺省不得伪造
      text: |
        每个类型分别登记自己采用的公共字段与专属字段；不采用的字段不得用空值、空字符串、
        空列表或占位时间伪造出现条件。

        公共身份字段的值与含义跨类型一致：类型只声明采用范围与专属增量，不改写公共语义。
        公共字段的修改须评估全部当前适用类型与消费者。

        召回与主动查询按各类型自己登记的核心语义字段取值，不存在跨类型的统一关键词字段；
        任何类型都不为召回另维护一套词面。

    - id: object-designation
      title: 指称一个对象时怎么写
      text: |
        指称一个对象时，最小可读形态是「类型短名 + 8 位小写十六进制短标识」；裸短标识不构成可读形态，
        因为读者读不出它属于哪一类。

        需要据此辨认对象本身时，指称后紧随标题。
        同一文本里需要绝对唯一、或两个短标识前缀相同时，改用完整标识。
        不可解析的短标识不得使用，也不得为它补一个类型短名。
        路径片段是载体定位，不属指称，不受本形态约束。
        会话标识、批次号等取同样形状的串，不因形状而成为对象身份的证据。
        单例类型以它自己的固定标识指称，不使用本形态。

        本形态在对话正文与提交消息面只是书写约定，不设机械门禁；
        工具响应与契约测试面的门禁是否建立，不由本要求保证。

    - id: read-path-kinds
      title: 只读能力分四类，各自允许范围不同
      text: |
        只读事实能力须区分四类：
        候选发现只形成候选与最小卡片，允许分页与确定性过滤，不修改事实源，不建立持久索引；
        精确读取按稳定引用读出当前对象全文，并返回实际路径、指纹与机械问题，不做模糊搜索；
        证据展开按类型定义读必要来源，不把来源内容自动写回对象；
        完整性审计对单个对象或当前对象集合独立机械校验，并报告完整、部分或不可用及具体未完成范围。

        读取结果里的「机械有效」只表示当次已实现的机械规则通过，
        不证明语义、来源真实、证据充分、适用、授权或完成。

    - id: consumption-four-conclusions
      title: 事实消费分成四个结论
      text: |
        事实消费须区分四件事：发现了哪些对象引用；召回了哪些少量候选并带命中依据与未检查范围；
        展开了哪些稳定引用的对象全文；以及当次是否相关、适用、授权或影响行动的语义判断。

        候选返回、机械有效、文本命中、关系存在与对象状态，都不能替代最后这一步判断。

        已明确当次目标后，只有事实对理解、判断、验证或行动确实必要，或输入精确引用了稳定事实时，
        才进入消费；新会话、上下文压缩、委派或生命周期事件本身不证明必要，也不证明事实不存在。
        中间产物不是事实对象，不进任何一层候选，也不因被读到而取得适用性。
