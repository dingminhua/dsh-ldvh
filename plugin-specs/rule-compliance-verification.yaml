# 运行时机制：双源召回——核对面这一侧的要求清单。

ldvh_spec:
  spec_key: rule-compliance-verification
  spec_kind: spec
  title: 双源召回·核对面
  canonical_path: plugin-specs/rule-compliance-verification.yaml
  positioning: 管召回之后的核对与落实：怎么判适用、什么算真落实、偏离怎么登记、预检落实记录写什么、哪些事必须由人决定、什么情况必须停下来
  scope: 要判断某条召回来的约束是否真被遵守、或要处置偏离与停下时，查阅本文件；召回本身怎么走走召回面那一份

  requirements:

    - id: three-tests
      title: 三项判断都成立才算通过
      text: |
        行动前须完成三项判断并各自成立：来源自身生效、该来源适用于当次行动、当次行动被允许。
        三者均须成立，任一不成立即不构成通过；去向不同：生效不成立补来源，适用不成立缩小范围，
        行动允许不成立停止。

        不得为凑齐三项而填写无内容的结论。


    - id: implementation-criteria
      title: 什么算真落实了
      text: |
        一项识别结果构成已落实，须同时满足：有指向，对应到当次行动的一个具体要素，
        即范围、路径、前置条件、是否继续、是否提请人；有改变，该要素与没识别到这一项时不同，
        且不同之处可被指出；有可回指依据，改变的理由能回到该识别结果本身，不是事后归因。

        任一不成立即按「已识别但未落实」处理；不改变任何行动要素的不构成落实，
        也不得以记录齐全替代落实。


    - id: confirmed-no-change
      title: 确认无需改变是结论，不是省略
      text: |
        确认某条约束后判定它不要求改变行动，是合法结论，不属于「已识别但未落实」。
        该结论须在「行动允许」一项下显式写出，并说明该约束为何不要求改变；
        不得靠省略该项或写一句「已遵守」来隐含。

        它不豁免其余识别结果：应改变而未改变的仍按未落实处理。


    - id: order
      title: 识别先于判断，判断先于动作
      text: |
        识别先于判断，判断先于动作，记录与动作同步交还。
        三项判断不得在识别未完成时开始。
        执行中发现新来源时回到识别重做，不得在既有判断上追加补充结论。

        任一环节失败即停止位置：不在该点继续，也不以其余部分已完成而部分交付；
        残留范围须如实进入交还。


    - id: deviation-register
      title: 偏离发现即登记，补做不算没发生
      text: |
        偏离须在发现时立即登记，不得等交还时一并说明。
        登记须含偏离形态、受影响范围、已发生的副作用、待核对项；形态按判据区分：
        来源未被识别、已识别但行动未按其结论改变、判断结论本身不成立、来源互斥而择一执行。

        已发生的偏离不因事后补做识别而视为未发生，也不因补做后记录完整而转为已遵守；
        不得用补做的记录覆盖缺口曾经存在的事实。


    - id: record
      title: 预检落实记录是什么、不是什么
      text: |
        每次行动前核对都须生成预检落实记录，随交还呈现，不要求写入事实源。
        该记录不是事实对象：不进事实源、不按事实对象的准入判据核对、不被召回层检索，
        也不为它新设对象类型或状态字段。

        记录生成后须可回读，当次交还中即可见。写入事实源的部分须保留「经预检发现」这一来源线索，
        使该对象的由来可回指。记录齐全不证明约束已被遵守。


    - id: handover
      title: 交还须说清什么
      text: |
        交还须给出：当次识别的来源范围与结论；三项判断逐项结果与落实的具体形态；
        已验证范围与未验证范围；残留风险；待决定事项；已登记的偏离。

        并须写明据以行动的既有决定及其作用范围，以及下一动作从何处接续、须先补什么。
        须显式区分「已识别未落实」与「已落实」，不得合并为「已遵守」。


    - id: human-decide
      title: 这些事须由人决定
      text: |
        下列事项须由人决定，AI 只出候选与证据：
        - 两个以上来源互斥、需在来源之间取舍；
        - 识别发现既有规则、事实或决定本身有缺口，修复须改动插件规范或根决定；
        - 偏离影响范围已超出当次行动，是否暂停更大范围；
        - 是否接受「识别不完整但已声明缺口」的行动继续；
        - 是否提高召回字节预算、新增更高档位或扩大召回的类型范围。

        提请须带上互斥内容、受影响范围、已声明缺口与可选处置。
        人的决定只证明该决定及其作用范围，不使行动中未经识别的部分转为已识别。


    - id: stop
      title: 这些情况必须停下来
      text: |
        出现下列任一情况须停下：
        - 适用性不确定，而该不确定项可能改变行动是否被允许；
        - 识别结果未改变任何行动要素，却准备以「已遵守」继续；
        - 偏离已登记，后续行动仍建立在偏离之上；
        - 两个来源冲突且已择一执行，未交还裁定；
        - 以补做识别的记录覆盖缺口曾经存在的事实；
        - 以本系统核对替代某系统的专属核对，或反过来；
        - 召回未完成却被当作「无相关约束」继续；
        - 命中被当作适用结论使用，未经适用识别；
        - 召回完成且零命中，却未生成记录或未如实写明召回状态。


    - id: stop-scope
      title: 停下期间能做什么、怎么恢复
      text: |
        停下期间只做：补做受影响的识别、补齐来源读取、登记缺口与偏离、
        把行动范围缩小到已识别部分可支持的范围。不继续受影响行动，也不扩大已声明的范围。

        恢复须与触发原因逐项对应：补齐识别与来源、补做行动要素改变或补出「确认无需改变」的显式结论、
        先处置已登记的偏离、补做交还与裁定、补做召回至完成或缩小范围、补做适用识别、补生成记录。
        恢复只覆盖当前依据支持的范围；补齐后的识别不追溯地使偏离消失。


    - id: risk-tier
      title: 哪些环节走得快，哪些走不得快通道
      text: |
        默认按标准路径办，不得因产物只是判断与记录就默认走快通道。
        纯读取与来源检索环节可以走快通道；三项判断、落实判定与偏离判定须走标准路径以上，
        任何涉及授权边界的判断不得产自快通道。

        实际影响超出事先假设、需写入受控事实对象或涉及受保护内容时须升级，升级不绕过停止。
        不得自行增设标准路径与加固路径之外的中间层。

    - id: evasion-signals
      title: 反逃避信号五类，只聚合不另建审计
      text: |
        执行域须把「以形式成功掩盖实质失败或越权」的行为按反逃避信号聚合识别，信号至少覆盖五类来源：绕过本应承接它的系统而改走普通求解；用默认值、历史记忆或名称相似静默补齐缺失条件；流程失败后不按分流路径处理；用工具、命令或文件存在的形式成功代替实际验证；把超出当次验证范围的结果声明为完成。

        识别到信号时，只在当次预检落实记录或交还里聚合写明触发原因、影响范围与已经采取的停止或降级动作，不逐条做流水记录，也不另建独立审计记录或外部账本。触发即进入停止或降级处置。

    - id: record-reuse
      title: 预检落实记录何时可以直接复用
      text: |
        预检落实记录只可在三个低成本可观察条件同时成立时直接复用：同一会话的连续行动步骤中，人的目标、工作对象与当前行动范围没有实质变化，也没超出上次覆盖范围；上次记录之后，当前工作树中作为预检依据的规则来源与事实载体没有发生变更；没有出现新的召回触发、风险升级、能力缺口或须人决定的信号。

        任一条件不成立，须重新执行受影响部分的预检并形成新记录。不得以「无法证明没有变化」为由无差别重扫全部规则来源或事实来源，只核对当次行动依赖的可观察范围。

    - id: degradation-order
      title: 降级按固定次序，不能直接降到更轻的路径
      text: |
        遇到能力不足、验证失败、结果不可观察或环境限制时，按固定次序降级：
        一、缩小范围，把行动收到当前能力与验证支持得住的范围，并如实报出剩余范围；
        二、风险重分类，只有重新评估确认风险已经降低，且目标、授权、来源要求与最低预检覆盖仍然满足，才可以从加固路径降到标准路径；
        三、切换系统或技术，转交另一个仍然适用且验证要求未被降低的系统，或改用已经验证过的实现手段；
        四、暂停交还，无法继续时暂停受影响范围，形成完整交还并提请人决定。

        不得把能力不足、验证失败或结果不可观察直接当作降为更轻路径的理由；重分类依据须写进预检落实记录。能力不足的分流不是风险降低的证明：不得以降级为名跳过已经触发的验证、掩盖失败、产生超出授权的副作用，或把部分与未验证的结果说成完成。

    - id: degradation-declaration
      title: 降级要声明什么
      text: |
        降级发生时须逐项声明：降级原因与触发条件；降级后的路径、范围与能力差异；因降级而跳过或简化了哪些环节与验证；降级后的残留风险与未验证范围；降级到暂停交还时，那一次完整交还的结构。

    - id: degradation-prohibition
      title: 这些情形不得降级
      text: |
        以下情形不得降级：降级后会违反来源要求的强制内容；降级后无法完成最低预检覆盖；降级后的行动超出人已经明确授权的范围。

        不得为了「让降级显得合法」而临时修改适用要求——临时放宽、临时改写已经冻结的授权、临时变更登记过的验证条件都属此列。另行按受控流程对开发规范、受保护文档或授权做独立修改不属于本禁止，但那次修改须与当次降级分别评估、分别审核、分别取得人的决定并独立提交，不得与降级打包。

    - id: entry-exit-contract
      title: 承接一类动作前先写清进入与退出六件事
      text: |
        承接一类业务动作的系统须先写清六件事，缺一即不构成可用的进入与退出契约：进入信号；适用条件，即须成立哪些输入、前置事实、要求、授权、环境与能力；排除条件，即哪些相近场景不由本系统承接；不确定处理，即哪些信息不足或冲突会挡住适用判断、须补什么；作用范围，即当次覆盖哪些对象、行动、环境与时间；退出条件，即当次职责在什么信号下算收口、转交或进入暂停交还。

        系统被发现、结构校验通过或名称相似，只说明它是候选，不证明已经适用。适用条件无法确认时，不得按最相近的系统猜着执行，须补充依据、改走普通求解、转交其它已经成立的做法，或按降级次序处置。

    - id: conclusion-gate
      title: 把系统结论声明为成立前要逐项满足什么
      text: |
        把系统结论声明为成立，须同时满足：全部必要环节已经执行，或已按分流路径完成；每一环节的结果都在当次可观察范围内取得；验证入口已经通过——未完成、失败或覆盖不足时只能形成部分或未验证的交还；需要回写的事实已经按受控写入要求写入并精确回读；须人决定的事项已经取得作用范围清楚的回应，未取得时只能暂停并交还；声明范围不超过当次依据、验证与完成条件实际支持的范围。

        系统静态存在、环节全部打勾、工具返回成功、人已回应或提交已创建，都不单独替代这六件成立事：全部必要环节已经执行或已按分流路径完成、每一环节的结果在当次可观察范围内取得、验证入口已经通过、需要回写的事实已经写入并精确回读、须人决定的事项已经取得作用范围清楚的回应、声明范围不超过当次实际支持的范围。

    - id: verdict-not-exploration
      title: 探索可以走快通道，带取舍倾向的结论不行
      text: |
        按环节划分风险层时，探索与求解可以留在快通道，但带明确取舍倾向的结论不能留在快通道——推荐方案、定案主张与可直接据以行动的草拟结果都属结论，即使不落盘、不转交受控对象，也须按标准路径完成预检。快通道只允许产出并列选项、权衡材料与待决问题，不得输出已经收敛的单一主张。

        环节划分须事先在系统规范里声明，不得在执行中为规避升级临时切分，也不得把划分宽到使标准路径只剩写入动作。环节边界说不清时，按整个系统取标准路径。

    - id: record-format
      title: 预检落实记录至少要写哪几部分
      text: |
        预检落实记录随交还一起呈现，须覆盖这些面：已确认生效的来源与已确认适用的规则；已确认的授权范围与边界；本轮召回了什么，没有触发召回时标明未触发；明确未验证或无法验证的范围；走快通道时的适用依据，以及从快通道升级时的触发原因、停止范围、补齐的预检与恢复依据。

        走快通道时只记录适用来源要求的召回，没有遍历的全量召回须明确标为未遍历，不得写成已核对。记录可以按当次情况增减条目，但不得省略已确认的来源与适用规则、已确认的授权范围与边界、本轮召回与未召回的部分、未验证或无法验证的范围，以及走快通道与升级时的依据，也不得用「预检已完成」一句话替代实际内容。

    - id: fast-path-declaration
      title: 走快通道时要声明哪五件事
      text: |
        使用快通道时须当场声明，并把五件事写清：适用条件，即哪些场景可以用；排除条件，即哪些场景即使符合也不得用；最低预检覆盖，即仍然必须完成生效、适用、行动允许三段判断；升级触发，即发现哪些信号须停下来补齐标准或加固路径的预检；声明方式，即本次用的是哪条快通道、依据是什么。

        不得以「本系统不属于任何风险层」绕开分层，也不得自设介于快通道、标准路径与加固路径之间的层级。
