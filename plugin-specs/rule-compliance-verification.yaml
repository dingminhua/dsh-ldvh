# 运行时机制：双源召回——核对面这一侧的要求清单。

ldvh_spec:
  spec_key: rule-compliance-verification
  spec_kind: spec
  title: 双源召回·核对面
  canonical_path: plugin-specs/rule-compliance-verification.yaml
  positioning: 管召回之后的核对与落实：怎么判适用、什么算真落实、偏离怎么登记、预检落实记录写什么、哪些事必须由人决定、什么情况必须停下来
  scope: 要判断某条召回来的约束是否真被遵守、或要处置偏离与停下时，查阅本文件；召回本身怎么走走召回面那一份

  carries:
    - "rule-compliance-system-foundation::12. 交还"
    - "rule-compliance-system-foundation::16. 必停情形/16.1 领域触发与影响范围"
    - "rule-compliance-system-foundation::8. 过程机制与分支/8.1 关键机制"
    - "rule-compliance-system-foundation::17. 反过度设计红线"

  requirements:

    - id: three-tests
      title: 三项判断都成立才算通过
      text: |
        行动前须完成三项判断并各自成立：来源自身生效、该来源适用于当次行动、当次行动被允许。
        三者均须成立，任一不成立即不构成通过；去向不同：生效不成立补来源，适用不成立缩小范围，
        行动允许不成立停止。

        不得为凑齐三项而填写无内容的结论。


    - id: implementation-criteria
      title: 什么算真落实了
      text: |
        一项识别结果构成已落实，须同时满足：有指向，对应到当次行动的一个具体要素，
        即范围、路径、前置条件、是否继续、是否提请人；有改变，该要素与没识别到这一项时不同，
        且不同之处可被指出；有可回指依据，改变的理由能回到该识别结果本身，不是事后归因。

        任一不成立即按「已识别但未落实」处理；不改变任何行动要素的不构成落实，
        也不得以记录齐全替代落实。


    - id: confirmed-no-change
      title: 确认无需改变是结论，不是省略
      text: |
        确认某条约束后判定它不要求改变行动，是合法结论，不属于「已识别但未落实」。
        该结论须在「行动允许」一项下显式写出，并说明该约束为何不要求改变；
        不得靠省略该项或写一句「已遵守」来隐含。

        它不豁免其余识别结果：应改变而未改变的仍按未落实处理。


    - id: order
      title: 识别先于判断，判断先于动作
      text: |
        识别先于判断，判断先于动作，记录与动作同步交还。
        三项判断不得在识别未完成时开始。
        执行中发现新来源时回到识别重做，不得在既有判断上追加补充结论。

        任一环节失败即停止位置：不在该点继续，也不以其余部分已完成而部分交付；
        残留范围须如实进入交还。


    - id: deviation-register
      title: 偏离发现即登记，补做不算没发生
      text: |
        偏离须在发现时立即登记，不得等交还时一并说明。
        登记须含偏离形态、受影响范围、已发生的副作用、待核对项；形态按判据区分：
        来源未被识别、已识别但行动未按其结论改变、判断结论本身不成立、来源互斥而择一执行。

        已发生的偏离不因事后补做识别而视为未发生，也不因补做后记录完整而转为已遵守；
        不得用补做的记录覆盖缺口曾经存在的事实。


    - id: record
      title: 预检落实记录是什么、不是什么
      text: |
        每次行动前核对都须生成预检落实记录，随交还呈现，不要求写入事实源。
        该记录不是事实对象：不进事实源、不按事实对象的准入判据核对、不被召回层检索，
        也不为它新设对象类型或状态字段。

        记录生成后须可回读，当次交还中即可见。写入事实源的部分须保留「经预检发现」这一来源线索，
        使该对象的由来可回指。记录齐全不证明约束已被遵守。


    - id: handover
      title: 交还须说清什么
      text: |
        交还须给出：当次识别的来源范围与结论；三项判断逐项结果与落实的具体形态；
        已验证范围与未验证范围；残留风险；待决定事项；已登记的偏离。

        并须写明据以行动的既有决定及其作用范围，以及下一动作从何处接续、须先补什么。
        须显式区分「已识别未落实」与「已落实」，不得合并为「已遵守」。


    - id: human-decide
      title: 这些事须由人决定
      text: |
        下列事项须由人决定，AI 只出候选与证据：
        - 两个以上来源互斥、需在来源之间取舍；
        - 识别发现既有规则、事实或决定本身有缺口，修复须改动插件规范或根决定；
        - 偏离影响范围已超出当次行动，是否暂停更大范围；
        - 是否接受「识别不完整但已声明缺口」的行动继续；
        - 是否提高召回字节预算、新增更高档位或扩大召回的类型范围。

        提请须带上互斥内容、受影响范围、已声明缺口与可选处置。
        人的决定只证明该决定及其作用范围，不使行动中未经识别的部分转为已识别。


    - id: stop
      title: 这些情况必须停下来
      text: |
        出现下列任一情况须停下：
        - 适用性不确定，而该不确定项可能改变行动是否被允许；
        - 识别结果未改变任何行动要素，却准备以「已遵守」继续；
        - 偏离已登记，后续行动仍建立在偏离之上；
        - 两个来源冲突且已择一执行，未交还裁定；
        - 以补做识别的记录覆盖缺口曾经存在的事实；
        - 以本系统核对替代某系统的专属核对，或反过来；
        - 召回未完成却被当作「无相关约束」继续；
        - 命中被当作适用结论使用，未经适用识别；
        - 召回完成且零命中，却未生成记录或未如实写明召回状态。


    - id: stop-scope
      title: 停下期间能做什么、怎么恢复
      text: |
        停下期间只做：补做受影响的识别、补齐来源读取、登记缺口与偏离、
        把行动范围缩小到已识别部分可支持的范围。不继续受影响行动，也不扩大已声明的范围。

        恢复须与触发原因逐项对应：补齐识别与来源、补做行动要素改变或补出「确认无需改变」的显式结论、
        先处置已登记的偏离、补做交还与裁定、补做召回至完成或缩小范围、补做适用识别、补生成记录。
        恢复只覆盖当前依据支持的范围；补齐后的识别不追溯地使偏离消失。


    - id: risk-tier
      title: 哪些环节走得快，哪些走不得快通道
      text: |
        默认按标准路径办，不得因产物只是判断与记录就默认走快通道。
        纯读取与来源检索环节可以走快通道；三项判断、落实判定与偏离判定须走标准路径以上，
        任何涉及授权边界的判断不得产自快通道。

        实际影响超出事先假设、需写入受控事实对象或涉及受保护内容时须升级，升级不绕过停止。
        不得自行增设标准路径与加固路径之外的中间层。
