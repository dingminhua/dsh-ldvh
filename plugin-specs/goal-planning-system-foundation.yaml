# 运行时机制：目标规划这一业务系统的要求清单。

ldvh_spec:
  spec_key: goal-planning-system-foundation
  spec_kind: spec
  title: 目标规划
  canonical_path: plugin-specs/goal-planning-system-foundation.yaml
  positioning: 管把一个模糊意图收紧成可判定目标这件事：什么时候做、怎么做、什么时候停
  scope: 要把一个意图变成可核对的目标、或要判断目标是否已经偏离时，查阅本文件

  requirements:

    - id: what-it-is
      title: 这件事的产出是目标锚与子目标
      text: |
        目标规划的产出有两件：一个可回指、可反复核对而不被重新解释的目标锚，
        以及一组可判定的子目标。

        它管方向，不管步骤：执行计划、验收与具体做法由当次行动承接，不得写进目标。

        目标与子目标的形态可以被核对；目标本身是否正确、子目标是否充分，不能由形态核对得出。
        不得以结构完整或人的确认记录存在，声称目标正确、子目标充分。

    - id: when-it-applies
      title: 什么时候做
      text: |
        出现下列任一情形时做目标规划：
        - 需要建立项目目标锚；
        - 目标在，但子目标空缺或不可判定；
        - 执行中发现实际推进与目标锚不再对应；
        - 人的意图变了，需要修订目标。

        进入须有一个可回指、由人明确表态的来源（初始化或修订对话里的确认）。
        不得从对话的间接推断里自行确立目标；推断出来的目标虽然看起来合理，也不满足进入条件。

    - id: excludes
      title: 什么不进入这里
      text: |
        下列不进入本系统：单个方向、暂时性想法与待调研的问题；已经定下的决策；
        某一轮的执行计划与验收；项目已有的长期价值约束；永远无法被证据判定的使命式表述。

        判定某段内容不进入本系统时，须说明它该去哪里。

        无法判定某段表述是项目目标还是一个方向时，不得按「先落下来以后再提炼」处理：
        须按本文件的判据核对，仍不能判定时登记为待决定事项交人裁定。

    - id: goal-statement-test
      title: 可判定的目标陈述
      text: |
        一条目标陈述构成可判定的目标陈述，须同时满足四项：
        一、能被证据判定：有可以指向的材料，能据以回答「这个目标达成了吗」；
        二、指向未来状态：说的是要实现什么，不是已经在做什么；
        三、不依赖当次会话：写给未来会话与后来的读者也能读懂它的意图与边界，不必回看对话史；
        四、不绑定实现手段：说明要实现什么，不规定怎样实现。

        四项缺一即不构成目标陈述，不得因为看起来合理就落盘。
        第三项按读者判：没有参与当初对话的人读不出意图与边界的，不满足第三项。

    - id: subgoal-test
      title: 可核对的子目标
      text: |
        一条子目标构成可核对的子目标，须同时满足四项：
        一、有可判定的达成条件：能说出「出现哪类材料，就说明它达成了」；
        二、可独立判定：不同子目标的达成条件不互相蕴含，一条达成不能自动推出另一条达成；
        三、不是手段：写的是要出现的结果，不是要做的事；
        四、粒度与目标相称：不设几十条细到管不过来的子目标，也不设几条宽到判不了的子目标。

        达成条件说不出来的子目标不得落盘：这样的子目标在需要判定时无法生效。

    - id: criterion-kind
      title: 展开子目标时须同时说出它将来怎么证明
      text: |
        展开每一条子目标候选时，须同时说明它的达成将来靠什么看出来，三选一：
        看一个能核对的量是否到了事先说定的数或区间；看一类对象是不是都走完了该走的关闭流程；
        看一次能重复做的核验动作是否通过。

        给了类别并不因此就能判定：说不出材料从哪里来的，条件照样判不了。
        类别是形状，可判定性仍是语义判断。

    - id: alignment
      title: 增补子目标须先答两个问题
      text: |
        任何时刻新增一条子目标，都须先回答两个问题：它围绕目标陈述的哪一部分推进；
        为什么不能由既有的某一条子目标承担。

        答案里须出现目标陈述中的具体内容；只写「为实现目标作贡献」一类任何目标都成立的话，
        不构成答案。
        目标早已确立，不使这两个问题免答；也不得先建起一条、事后再补答。
        答不出来时，不建这一条。

    - id: no-inferred-intent
      title: 缺人的明确表态时不得补全
      text: |
        缺少人的明确表态时，不得以「根据对话推断」「按常见做法」补全，须停下来请人给出明确意思。

        沉默与「没有反对」都不构成表态。
        停止期间只做候选与判据自检，不得以未确认的锚推进行动。

    - id: no-picked-reading
      title: 多种解读与内部冲突都不得由 AI 定夺
      text: |
        人的表述存在多种可判定的解读时，不得择一落盘，须把解读差异摆出来请人明确。

        意图内部自相冲突时，不得自行取舍，也不得折中成一个模糊表述；
        冲突须原样交还给人，不得替人消解成一句可执行的话。

    - id: constraint-conflict
      title: 意图与既有约束相悖时
      text: |
        意图与项目已有的长期价值约束相悖时，不得以意图覆盖约束，也不得以约束否决意图，
        须提请人决定。

        人作出决定之前不落盘，也不用这条意图推进行动。

    - id: freeze-path
      title: 从意图到冻结锚的路径
      text: |
        这条路径是单向的，且须人确认：
        一、据人的表述收敛目标陈述候选，按四项判据逐项自检；
        二、从已收紧的目标陈述展开子目标候选，逐条说明达成材料将是什么、属于哪种判据类型、
            对齐目标陈述的哪一部分；不得从原始意图直接跳到子目标；
        三、人逐条确认，这一步不得由 AI 代为完成，也不得以「没有反对」推定为确认；
        四、目标先经带写后读回的受控写入入口落盘，子目标再逐条经受控写入入口落盘并逐条读回。

    - id: two-writes
      title: 目标与子目标分两次落盘
      text: |
        目标与子目标各走各自的受控入口，分两次落盘，不构成一次原子操作。

        子目标落盘失败不回滚已经落下的目标陈述，缺口按「未完成精化」登记，
        不得以「目标已建」掩盖。

        只有目标陈述、尚无子目标，是合法的中间状态：缺的是精化，不是目标本身，
        此时该缺口须在交还里看得见。

    - id: readback
      title: 每次落盘后须逐条读回
      text: |
        目标落盘后须读回整份目标；子目标每落一条须读回该条。
        读回的内容须与人事先逐条确认的那一份相同，结构完整。

        读回结果不一致时，该次落盘不成立，须按原候选重写；说过「已经写了」不构成落盘。
        落盘没成功、也读不回来时停下。

    - id: single-authority
      title: 目标只有一个权威位置
      text: |
        不得在其它文件、笔记或会话状态里保存目标的工作副本并据以推进。
        子目标同理，不得在目标载体、呈现视图或会话状态里存它的状态副本，派生视图一律现算。

    - id: deviation-action
      title: 行动一侧的两种偏离
      text: |
        行动仍在目标范围内，但手段或路径使目标难以达成，属实现偏离：不动目标，
        由当次行动调整做法。

        实际推进的内容已经超出目标陈述覆盖的范围，属范围漂移：先停止超出部分，
        再提请判定是收窄行动还是修订目标。

    - id: deviation-goal
      title: 目标一侧的三种偏离
      text: |
        目标已不反映人的现时意图，属目标过时：提请修订。

        子目标的达成条件已不可能实现或不复有意义，属子目标失效：提请修订该条并说明理由。

        子目标始终无法被证据判定却一直留在目标里，属不可判定延续：按未完成精化处置，
        须提请重写；它不按目标过时处置。

    - id: deviation-evidence
      title: 偏离须可回指，不得事后扩大目标解释
      text: |
        识别偏离须能回指：指出是哪一次行动、哪一条产出越出了哪一段目标原文。
        凭印象报告的偏离不构成偏离，不得据此改动目标或行动。

        不得为避免承认偏离而事后扩大目标解释。

    - id: frozen-no-reinterpretation
      title: 冻结之后不得在行动中重新解释目标
      text: |
        目标一经冻结，其内容不因后续执行便利而自动调整。

        执行中发现目标不合适，须走修订路径；不得在当次行动中把目标解释成便于继续推进的样子，
        也不得以「就这样理解也行」绕开修订。

    - id: cascade-scope
      title: 修订后须界定须核对的范围
      text: |
        目标修订后须界定影响面：名下属于该子目标的在途行动，其作用范围与完成判据是否仍与
        修订后的目标相容；以及各条子目标的对齐说明是否仍成立。

        界定的对象是「须核对」，不是「须一并修改」。
        宁可多标记等待核对，不可少标记让下游在不知情时按旧目标继续。

    - id: cascade-not-modify
      title: 级联是标记，不是动作
      text: |
        不须核对的是：已经完成的行动、属于其它子目标的行动、还没有定形的方向线。

        标记只使受影响项进入待核对状态，不改动它们，也不自动使在途行动失效或改变已完成行动的历史结论。
        目标侧不为级联保存任何下游对象的状态副本，状态以各对象自身为准。

    - id: not-authorization
      title: 目标与子目标都不产生授权
      text: |
        行动落在目标范围内，只说明方向相符，不说明该行动被批准；授权须由它自己的授权程序产生。

        子目标说明走到哪里算成，不说明用什么手段、由谁、何时去做；把它当任务属越界。

        反过来也不成立：行动未获授权，不因目标存在而变得可做；
        目标未变，也不使已经偏离的行动自动回到范围内。

    - id: consumption
      title: 目标须被真实消费
      text: |
        每次行动的起点须能说明它服务哪一条子目标。

        目标被真实消费的标志是：它使某次判断或某个范围界定与「没有这个锚」时不同。
        只在名义上挂着服务关系、而推进内容与目标无关的，不构成消费，属范围漂移。

    - id: recall
      title: 什么时候回来看目标
      text: |
        行动的起点、方案取舍、达成交还与周期性回看，都要回到目标上看一眼：它是否仍反映人的现时意图。

        目标过期不自动失效：它仍以既有状态存在，直到被修订。
        过期是人对它的判断，不是它自身发生的转换。

    - id: human-decide
      title: 这些事须由人决定
      text: |
        下列事项须由人决定，AI 只出候选、只汇总证据：目标确立（逐条确认）、目标修订、
        子目标的精化与增改、目标状态翻转（达成判定）、意图冲突或解读歧义的裁定。

        提请时须带上目标候选、子目标候选及其达成材料说明、未验证范围，使人能作实质判断；
        不得只交一份结构完整却没写判据的候选。

        人确认某个目标，不使该目标里的不可判定表述转为可判定。

    - id: no-fast-path
      title: 目标事项不降级
      text: |
        目标的确立与修订都属于人决定事项，一律不走快通道，也不得因「改动不大」而降级处置。

        它们改变一切下游锚定，结果须经人确认，并留下可回指的理由。

        走加固路径时，子目标的达成材料须逐条可回指，修订还须有影响面界定与理由。

    - id: handover
      title: 交还须说明什么
      text: |
        交还须如实说明：当次做了什么（确立、精化、识别出偏离，还是判定不构成目标事项）；
        候选形态与自检结论、人的确认记录、偏离的可回指依据；
        已验证与未验证的范围——已核实的是形态与确认过程，未核实的是目标是否正确、子目标是否充分，
        须明说；残留风险与待决定事项；未兑现的范围。

        不得以「目标已建」「结构完整」代替这些说明。

    - id: stop
      title: 必须停下来的情形
      text: |
        出现下列任一情况须停下：
        - 拟定第二个项目目标；
        - 从推断里确立目标；
        - 把意图冲突折中成模糊表述；
        - 子目标判不了却落盘；
        - 以「在目标范围内」免除授权程序；
        - 事后扩大目标解释以吞掉偏离；
        - 写入失败且回读不可用；
        - 为目标建立副本并据以推进。

        停下期间只做：补齐候选的判据自检、补齐达成条件、登记偏离与未验证范围、
        把已落盘的不可判定表述退回重写。不得继续用带着停止原因的目标推进行动，也不得扩大已声明的范围。

    - id: semantic-bound
      title: 可判定性不由机械检查保障
      text: |
        可判定性、充分性、对齐是否真实，都是语义判断：机械层只能核对存在性与格式，
        不能判断一条句子是否真的能被证据判定。

        不得以「机械检查已通过」声称目标可判定、子目标充分或方向未偏。
        这类结论由人的确认承担。

    - id: no-overdesign
      title: 不为齐整造目标
      text: |
        不得为每个方向或每轮规划各建一个目标。
        不得以结构、编号、字数齐备当作目标质量的证据。
        不得给子目标设统一数量配额换取整齐；不得让子目标承担执行计划的职责。

    - id: no-auto-transition
      title: 目标状态与回看不由机制代劳
      text: |
        不得自动修订目标，也不得自动翻转目标状态。
        不得以「目标未变」免掉行动前的检查。
        不得为目标的日常回看新建调度机制；回看由行动与交还自然完成。
