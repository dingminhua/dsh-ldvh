ldvh_spec:
  spec_key: report-fact-type
  spec_kind: spec
  title: 报告
  canonical_path: plugin-specs/report-fact-type.yaml
  positioning: 管一次已经收敛的认识怎么写下来：按什么形态写、证据怎么标、什么不该写成报告
  scope: 要写一份调研、总结、审核、行动或参考记录时，查阅本文件

  carries:
    - "report-fact-type::7. 身份与载体"
    - "report-fact-type::8. 字段契约"
    - "report-fact-type::13. 受控操作"
    - "report-fact-type::12. 召回与消费"
    - "report-fact-type::5. 类型定位与价值/五种来源形态（`report_form`）"
    - "report-fact-type::17. 必停情形/17.1 领域触发与影响范围"
    - "report-fact-type::18. 反过度设计红线"

  requirements:

    - id: what-is
      title: 什么算一份报告
      text: |
        一份报告承载一轮已收敛并终止、能用一句话说清回答了什么的认识产物。须同时满足六条：
        已经停下且写得出据实的停止依据；只回答一个问题，两个不统属的问题拆成两份；已形成可回指来源的关键发现；结论今后还有跨行动引用或复读价值；查过重，没有可以无损更新的既有对象；不属明确排除的内容（进行中的工作、方案比较、决定、失败经验、议题、方向规范本身、临时笔记与普通目录下的备忘）。

    - id: five-forms
      title: 五种来源形态
      text: |
        来源面决定形态：对外部技术、工具、项目或实践取证的是调研型；对一个已完成工作阶段作综合结论的是总结型；一次独立审核或复核的完整结论是审核型；一次已完成行动的执行过程与结论是行动型；一条未验证但值得跨行动备查的内容是参考型。
        形态由创建时的实际来源面决定，建好后不得改变；认识变了须新建对象，旧对象按退出处置。

    - id: research-form
      title: 调研型的要求
      text: |
        调研型只承载对外部对象的取证，且该对象能被至少一项长期可复核的外部资料定位。
        来源清单须非空，每项是绝对网址，彼此不重复，并写明它支持了什么、有什么限制；被锚点引用的项须带可识别的标题。
        调研问题须是单句、可独立复读、以外部对象为主体，问的是它是什么、怎么用、边界在哪，并写明这轮调研要支撑项目的哪个判断。问题原文须逐字出现在正文，正文只得在原文之外展开。
        实质改变了调研问题、对象边界或证据解读的澄清须留下记录；未改变方向的问答、寒暄与复述不记。
        每个关键发现末尾须有一行「溯源：网址（位置）」，网址逐字等于清单中某项，位置是来源内可重新定位的地方；外部原文可不复制进对象，核对时按锚点回查。

    - id: internal-forms
      title: 内部来源的写法
      text: |
        总结型、审核型、行动型与参考型都不对外部世界取证，其来源内容须逐字摘录进正文，不得只留指针；这四类的来源清单一律留空。
        每条摘录后须有一行内部锚点，写明取自哪一类出处并给出可重新定位的定位符。可用出处类型有四种：某次提交（40 位小写哈希，首选）、另一个事实对象（对象标识）、某次会话（不作长期权威）、某次运行记录（标识或可复现命令加时间点）。
        不得以 docs/ 下的路径、本机路径或会话内临时路径充当定位；写下的提交须真存在，写下的对象须真可解析；会话标识与运行记录的真实性由声明者据实负责。

    - id: audit-form
      title: 审核型的准入
      text: |
        审核型须让完整正文实际可得：整体判断、逐条证据性发现、未覆盖范围与保证边界都在正文里。只剩概要、完整正文已不可得的，不建对象，记为缺口。
        粒度是一次审核一条：以被审事项为单位，同一次审核的多轮共用一份报告，不按发现逐条拆分。对象装的是这次审核发现了什么，不是审核流程；开销、轮次与工具调用不进来。
        正文还须交代被审对象的标识、属于哪一轴、审核者的来源形态；那不是可解析指针。
        审核轴与复核轴各自按本轴的形态要求出结论，不得跨轴借用另一轴的形式。

    - id: action-form
      title: 行动型的要求与边界
      text: |
        行动型一份只装一次已完成并终止的行动；进行中的行动、多项行动的流水与行动清单不进来。
        正文须有执行过程与结果与结论两段：前者按已发生的事实写实际步骤与关键判断；后者给出可回指、可复用的结论，并分清已达成与未达成。不得用计划或流水账代替已完成的事实。
        与总结型的分别不在偏好而在粒度：总结型面向一个工作阶段的综合结论，重做成了什么、遗留什么；行动型面向一次有界行动的复现，重实际步骤与最终结果。覆盖多项行动且执行细节不是重点的，写总结型。
        还须有可回指的执行证据与跨行动复用价值（后续同类行动可参照其步骤与结论）；不满足的不建对象。

    - id: reference-form
      title: 参考型的未验证语义
      text: |
        参考型只收一条未验证但值得跨行动备查的内容：真伪、版本或有效性尚未核实，而记下来有现实价值。它以「决定留档备查」这个动作终止，不以内容已核实为准入。
        正文须写清记了什么（忠实转述，不冒充已证实）、记自何处、为何值得备查、哪些点没核实、什么信号出现时该核验以及核验后怎么处置。
        已证实声明须为空，未验证内容进未证实与缺口，停止理由不得取「证据充分」。外部材料须逐字摘录进正文，外部链接只作摘录旁的辅助文字，不作来源清单项。
        它只备查一条内容，不推进任何方向；由它引出的方向另立一条方向线。

    - id: body-skeleton
      title: 正文骨架
      text: |
        正文自二级标题起，骨架按形态固定，各段按序出现且只出现一次，五种形态互不通用。
        调研型依次七段：研究问题；输入与边界（来源分工、观察时点、方法与不覆盖范围）；调查阶段（对象、问题或范围启动时还不明确才出现，其内依次四段：调查问题与范围、调查方法与来源、调查发现、调查停止与交接）；关键发现；未证实与缺口；处置意见；后续分流。调查阶段段出现即探索型，不出现即明确方向型；后四种形态不得含该段。
        处置意见每项须写明目标类型、预期目标、验收条件与建不建；不需要对象化的须写判断依据与后续监测条件。后续分流每项须写什么信号出现时创建或更新哪类对象、什么条件下可以继续不对象化。
        总结型四段：范围与目的；工作与结论；证据摘录；遗留与下一步。审核型五段：被审对象与背景；审核结论；证据性发现；未覆盖范围与保证边界；后续处置。行动型五段：行动目标与背景；执行过程；结果与结论；证据摘录；遗留与下一步。参考型五段：参考内容；出处与来源；记录理由；未验证与疑点；后续核验方向。

    - id: findings-and-states
      title: 关键发现与三态证据
      text: |
        合格的关键发现须含四样：一句可独立讨论的声明；从来源提取的浓缩观察（机制、数据或行为）；对管辖项目的价值判断；末尾回指来源的锚点。只有描述没有判断，不构成发现。
        三态各按判据归：已证实 —— 有可回指的来源支持、经核对无实质冲突；未证实 —— 疑点或冲突待裁决、证据不足、不可复核、超出能力或时间范围，每项须记下问题与原因；缺口 —— 已知没取到的信息，写明描述，并按对项目判断的阻塞程度取高、中、低之一，必要时写明阻塞了哪个判断。
        三态至少要有一项成立，不得用空值占位；有来源但存在实质冲突的观察归未证实。
        每条对项目的启发须逐字锚定到某条已证实声明上，不得悬空。
        三态与引用以文件头为机器权威，正文只可展开，不得改变或弱化它们。

    - id: stopping
      title: 停止理由要与三态对得上
      text: |
        停止理由须据实，只有三种取值：证据已充分、再无增益、轮次到顶。
        取「证据已充分」时须有非空的已证实声明，并且没有阻塞项目判断的高优先级缺口；取「轮次到顶」时须在缺口或正文的后续分流段声明未覆盖的范围。
        不得据停止理由声明调研成功、结论正确或证据充分。

    - id: not-report
      title: 这些不写成报告
      text: |
        下列不写成报告：进行中的调研或工作；独立方案、设计与架构的比较；决定；失败经验；待推进的议题；方向规范本身；含执行计划或验收的任务；临时搜索结果、裸链接清单、聊天摘要、运行日志与一次性笔记；docs/ 或普通目录下的备忘本身；一个对象装多个不统属同一问题的内容。
        普通文件能无损承载、又不需要身份、状态与来源锚点的摘要，不建报告。

    - id: carrier
      title: 报告放在哪
      text: |
        一份报告一个平铺文件，放在事实源的报告目录，路径形如 ldvh-base/reports/report-<uid>.md。文件头是机器读的字段区；正文的一级标题只有一个、由写入路径按标题生成，骨架各段从二级标题起。
        机器可读字段只在文件头出现，正文不再承载字段。
        该文件是这份报告唯一的当前权威载体；卡片、索引、呈现与读取结果都只是从它派生的视图，不得另存一份当前权威副本。
        报告不挂目标归属字段；它服务哪个目标由研究目的与正文自述。

    - id: status
      title: 状态与生命周期
      text: |
        只有两个状态：在册与已退休。新建只能是在册，唯一合法转换是在册转已退休，退休后不复开。
        已退休时须写明退出原因（资料失效、被更新、范围不再相关、或本对象自始不承载业务结论），退休时间由系统填写；原因为被更新时须另有一条指向可解析替代报告的关系；变更流水的末条摘要须说明退出依据。在册时不得填退出原因与退休时间。
        退出时正文处置意见段的最后一条须回答：本对象在什么条件下仍可被回查。
        来源定位与摘录写错、同问题同边界的证据补充，属更正或更新，不改变状态；删除不能代替退休。
        内容、关系或状态的每次变化都须走当前指纹绑定的完整更新入口，提交完整新内容，写后精确回读整个对象文件。

    - id: relations
      title: 报告能与谁连边
      text: |
        报告连三种边：由某个对象驱动而建（可指向方向线、方向规范、坑、报告、摩擦或子目标，同源类型每对象至多一条）；本报告的结论应影响某个对象的判断或执行（可指向方向规范、坑、报告、摩擦、子目标或方向线）；本报告更新了同一来源面上更早的报告（只指向报告，每对象至多一条，不等于自身）。
        第二种边是前瞻性影响声明：目标的状态与行动尚未因此改变。
        不得用「取代」表达替代：替代靠新建对象加旧对象退休完成；也不得声明报告依赖别的对象的当前状态。
        关系条目上不得带证据定位：证据只在正文与来源锚点一处成立，关系不另承载第二处证据。

    - id: correction
      title: 已退休报告的更正
      text: |
        已退休的报告只允许事实更正，且每次都要先取得人的明确授权，授权文本逐字进变更流水；没有授权即拒绝。该入口只对已退休对象开放，在册对象的内容修正走普通更新。
        更正只改正文与五项索引：已证实声明、未证实、缺口、项目启发、调研问题。其余字段逐字继承，含状态、退出原因、退休时间、来源清单、调研目的、停止理由与调查阶段段的有无。
        正文骨架、声明与正文发现的逐字对应、问题原文与正文一致，仍须成立；没有实质改动时拒绝。
        该通道只证明该次写入的范围，不得据它声明更正内容正确。

    - id: recall
      title: 什么时候取用报告，取到什么程度
      text: |
        当前判断需要某个外部对象的事实输入，或当前输入精确引用了某份报告的研究问题、对象名或研究目的时，进入候选。默认只取在册的；已退休的只在精确引用、回溯历史或追溯来源时进入。
        候选卡只投影身份、标题、形态、研究问题、研究目的、停止理由与创建时间。
        三态、引用闭环或边界结论影响判断时读全文再作适用判断；需核对具体观察、版本或观察时点时，才按锚点回读实际来源。
        已证实的声明可以引用；未证实与缺口不得写成已证实；已退休的不得作为当前证据输入，除非已按锚点回读实际来源并按结果收紧声明。上下文压缩后，本轮引用过且仍影响判断的报告须重新回读三态、停止理由与边界。
        不得把报告结论当作规则、决定、授权或完成结论，也不得因报告被引用或被吸收而把它转成已退休。

    - id: dedup
      title: 建之前先查重
      text: |
        同一问题与同一来源面即同一个对象。补充资料或刷新观察而主要结论不变的，更新原对象；问题实质变化，或来源面发生足以改变结论的重大变化，新建对象，旧对象按退出处置。
        建之前须召回相邻报告、既有对象、方向规范与普通文档，确认没有可以无损更新的位置；查重未完成不得创建。

    - id: stop-conditions
      title: 这些情况必须停下来
      text: |
        出现下列任一情况时停下：把进行中的工作写成报告，或停止理由与三态结果不符；形态与来源面不符，或形态与正文骨架对不上；正文该有的段缺失、重复、乱序，或调查阶段该有的没有、不该有的反而出现，或更新时企图增删该段；审核型只剩概要而完整正文不可得却仍要建对象；参考型已证实声明非空、停止理由取证据已充分、或没有未证实与缺口；发现单元缺锚点、锚点回指不到来源、内部锚点用了不该用的出处类型、观察凭记忆填写；内部来源只留指针而没有逐字摘录；三态缺失或互相矛盾、用空值占位；更新时试图改变形态，或用「取代」关系冒充对旧对象的处置，或把状态与关系弄到闭集之外、用删除代替退休；把未证实或缺口写成已证实，或把已退休对象当作当前证据；写入后尚未精确回读整个对象文件，就准备继续写入或宣布完成。
        停下时只做回读、取证、补摘录与修复。

    - id: no-overdesign
      title: 不为了齐整造报告
      text: |
        不把进行中的搜索、链接收集或会话过程对象化；不为一次网页阅读、零星网址或普通文件能承载的摘要建报告；不建三态之外的第二证据形态、引用数据库、来源镜像或抓取缓存，调查阶段段不得成为第二证据权威。
        不要求每次读报告都重读全部外部来源或自动联网复核，只按需展开影响判断的来源；摘录以最小足以支撑声明为限，不扩张为全文抄录或网页存档。
        不为调研增加过程日志、轮次或预算流水、搜索历史；不因关系存在、锚点回指或校验通过就声称来源真实、证据充分或结论当前；不为子阶段单设字段，调查阶段段的有无是子阶段的唯一表达。
