ldvh_spec:
  spec_key: controlled-commit
  spec_kind: spec
  title: 受控提交
  canonical_path: plugin-specs/controlled-commit.yaml
  positioning: 管提交这个动作本身：提交消息怎么写、要暂存什么、什么会被拦住、拦住了怎么办
  scope: 要提交改动、或提交被拦下来不知道怎么办时，查阅本文件

  requirements:

    - id: what-counts
      title: 什么样的提交要按受控提交走
      text: |
        暂存内容里出现下列任一类东西，这次提交就要按受控提交的全部要求走：
        - 事实载体（承载事实对象的那批文件）；
        - 规则载体（承载开发规范与运行时机制的那些文件）；
        - 规则载体成员的新增、改名或移除。

        三类都不出现时，这次提交在提交缝直接放行，不进受控流程。
        暂存区为空时仍要进检查，不得当成「没有受管内容」放行。

    - id: message-header
      title: 消息第一行怎么写
      text: |
        提交消息第一行写成 `type: 简短描述`。
        type 用一个或几个小写 ASCII 单词；冒号后空一格，后半句一句话说清这次改了什么。

        过渡期内，`type(scope): 描述` 这种带括号 scope 的双段形式同样被接受；作者不得以「跟历史一致」或「兼容」为由新写这种形式。
        过渡期在存量记录不再需要与新格式共存、或人指定了终止时点时结束；终止后这种双段形式须被拒绝。

    - id: message-body
      title: 消息正文怎么写
      text: |
        第一行之后空一行写消息正文，正文里恰好一个「关键变更:」小标题；标题之下用 `- ` 列表逐项列出这次实际发生的每一项变更。
        列表不得为空，不得用一整段不带列表的文字代替，也不得写两个或更多「关键变更:」小标题。

    - id: message-diff-match
      title: 列表项要与差异逐条对应
      text: |
        每个 `- ` 列表项都要与这次提交的差异逐条对应：不得写出差异里并不存在的变更项，也不得漏掉差异里实际存在的变更项。
        纯机械生成的锁文件可以列为例外，不要求被列表项覆盖。
        这一条是防自欺的核心规则：把没做的写成做了、把做了的藏起来，都算不合规。
        逐条对应确认不了时停下，不改消息，也不建提交。

    - id: message-trailer
      title: 消息末尾的两行取值
      text: |
        消息末尾空一行写两行署名，恰好两行，逐行写入：
        `LDVH-Provider: <当次实际 provider>`
        `LDVH-Model: <当次实际 model>`
        这两行的取值由工具从当次会话记录里机械取得并写入；AI 不判断、不选择、不填写。
        不得用部署默认值、常用值或上一次的取值代替当次实际调用值。

    - id: trailer-unavailable
      title: 取不到当次路由时怎么办
      text: |
        取不到当次会话里的实际路由值时，不得自己编一个填进去，也不得留空继续提交。
        预检遇到这种情况返回「未验证」；真实提交缝把这次提交判为阻断。
        两侧行为不同是刻意安排的：预检是判断候选，提交缝是终闸。

    - id: message-reference
      title: 消息里指称事实对象时怎么写
      text: |
        消息里提到某个事实对象时，须写成「类型短名 + 8 位小写十六进制短标识」；需要据此辨认对象本身时，指称后紧随标题。
        同一处需要绝对唯一、或两个短标识前缀相同时，改用完整标识；不可解析的短标识不得使用，也不得为它补一个类型短名。
        这一面只是书写约定，不构成可拒收的消息约束：预检与提交缝都不校验指称形态；不得因为检查通过就推断指称正确。

    - id: precheck-when
      title: 提交前先跑一次机械预检
      text: |
        形成受控提交候选之后、真实创建提交之前，先跑一次预检。
        预检是只读动作：不改工作树、不改暂存区、不建提交。
        预检通过只说明机械检查过了，不说明这次提交已获授权，也不说明改动内容正确。

    - id: precheck-result
      title: 预检只给三种结果
      text: |
        - 通过：全部机械检查通过，同时给出这次候选的快照指纹；
        - 不通过：至少一项没过，并列出没过的是哪几项；
        - 未验证：输入不足以完成检查（暂存区为空、消息无法解析等），并列出缺什么。

        拿到不通过或未验证，改好输入后重跑；不得跳过，不得把未验证当作通过往下走。
        预检不判断语义是否适用、授权范围够不够、人会不会同意。

    - id: precheck-checks
      title: 预检按面逐项出结论，不含糊过去
      text: |
        预检按面逐项判定，每一面单独给结论：过了哪些面、哪一面没过、哪一面因为什么判不了。
        任一面判不了就按未验证处理，不得把它当通过，也不得用一个笼统的「通过」盖住没判的面。
        预检只下机械结论，不判断这次改动该不该做、授权够不够、人会不会同意；通过只说明这一轮候选在机械面上站得住。
        输入改过就要重跑重判，上一轮的结论不得沿用。

    - id: docs-reference
      title: 不得新增对临时文档目录的引用
      text: |
        `docs/` 只放开发期临时材料，不是要求或事实的依据来源。
        候选里新增或修改的载体，若引用了 `docs/` 下的某个路径、而该路径在候选树里不存在，判不通过；只拦新增与修改，已有存量引用不追溯。

        受这条约束的是 `plugin-specs/` 下承载运行时机制的载体、`ldvh-base/` 下承载事实对象的载体，以及仓库根 `README.md` 与插件目录下的 `README.md`；代码、测试与构建脚本里提到 `docs/` 不算引用。
        `docs/` 内部文件互相引用不检查；名字里带 `docs/` 但独立的目录（`plugin/web/docs/`）不属于这一项。

        已落盘的变更流水条目里提到路径不构成引用：流水记的是已经发生的动作，不是以该路径为依据。

    - id: fact-carrier-identity
      title: 事实载体的声明身份不能与文件名打架
      text: |
        每个事实载体在载体头部声明一个唯一身份，文件名同时编码一份身份；候选里逐个比对两者。
        两侧都有而不一致时判不通过；同一个身份被两条及以上载体声明时判不通过；载体读不出来、或没写这份身份声明时判不通过，不得读作通过。
        文件名里没有编码身份的不判失败：没有第二份可比，也不借此另立一条更严的命名约定。
        只比对候选里的内容，不得拿工作树里的版本替暂存内容通过。

    - id: git-gate
      title: 真实提交时的那道闸
      text: |
        真实创建受控提交时，同一套校验会在提交事件里再跑一遍，判定逻辑相同，只是入口不同：
        预检返回结构化结果供判断，这道闸当场放行或拒绝。
        结果不是通过就拒绝，提交不会落下。
        被拒绝后不得用跳过校验的方式强推（`--no-verify` 一类），须修正后重新提交。

    - id: git-gate-scope
      title: 提交缝按什么决定要不要检查
      text: |
        提交缝看暂存内容有没有触及受管事实载体、规则载体、规则载体成员变更；三类都没有的普通提交直接放行。
        仓库根 `README.md` 只含自身改动时，提交缝直接放行，但预检仍会检查它——
        这是两入口明知并声明的一处差异，不得据预检结果推断提交缝会拦。
        暂存区为空时仍进检查，不得按普通提交放行。

    - id: snapshot-consistency
      title: 提交后核对两入口看的是同一候选
      text: |
        提交缝放行时会输出这次候选的快照指纹。
        提交完成后把该指纹与预检返回的指纹比对，一致才说明两道入口作用于同一份候选。
        不一致时停下，撤回「这次提交已完成」的说法并如实说明。

    - id: stage
      title: 第一步：暂存
      text: |
        只把当次授权范围内的改动放进暂存区，暂存内容要能一项一项对应回授权范围。
        范围外的改动不得混入：未授权的文件、他人的改动、生成产物都不行。
        暂存时显式限定路径范围，只提交自己改动所在的路径；路径限定是预防手段，不替代把范围外内容移出暂存——
        与他人共用目录时，同目录下别人的改动仍在路径范围内。
        路径限定可能让提交缝看到的是暂存索引的子集，而预检读的是全量；两侧作用于不同快照时停下。
        发现混入时先移出再继续，不得带着它提交、事后再补。

    - id: create-commit
      title: 第二步：创建提交
      text: |
        按消息格式写好消息后创建提交，使提交实际包含的内容与暂存内容一致。
        创建后核对：消息的段落与两行取值符合格式要求，提交实际含的变更与「关键变更」逐条对应。
        消息与内容不符时，不得靠改消息追认，须重新组织内容或改消息后重建这次提交。

    - id: readback
      title: 第三步：回读
      text: |
        提交完成后回读实际结果：这次提交的标识，以及它实际包含的文件清单。
        不得用「命令返回成功」代替回读。
        回读结果要与前两步的预期一致。对照面不能用消息列表与差异的匹配结果充当：
        匹配越宽松，越多本不该进来的路径会被判成「已被覆盖」。
        回读的另一个对照面是执行者本次实际改动过的文件清单，两份清单逐个比对。
        回读不可用、结果不符或无法确认时，不得声称提交已完成。

    - id: readback-both-directions
      title: 回读要在「多出」和「漏掉」两个方向都处置
      text: |
        提交实际含了执行者没碰过的文件，是「多出」；执行者改过的文件没进这次提交，是「漏掉」。
        两个方向同样处置：不得声称提交已完成，暂停并如实说明，不得只查一个方向就结案。
        预检通过不构成暂存区干净的证据：正向与反向受同一匹配宽松度影响，宽的时候会一起放行同一批范围外路径。

    - id: self-report-list
      title: 自报触及清单怎么编
      text: |
        执行者本次实际改动了哪些文件，这份清单要以当次真实发生的编辑与写入记录为编制依据。
        不得沿用「哪些改动能进暂存」的归属判定结论来编它；编制依据要一并记下来。
        两种依据在误判时会给出不同清单，差异正是要靠回读暴露的东西。

    - id: ownership
      title: 共用工作区里改动归谁
      text: |
        形成暂存内容前，先按文件判定每处改动归谁；判不了归属的一律按他人的处理，不得默认收入自己的暂存。
        判定粒度是文件：同一文件里混有双方改动时，整个文件不进暂存；确实要提交自己那部分时，须由人给出处置或等对方先落盘。
        被判为他人的改动不得进入暂存。
        结论要写清判了哪些文件、依据是什么、哪些按他人处理，并写进交还；自己的改动被误判为他人或被有意排除，同样要说明。

    - id: worktree-safety
      title: 有他方改动时不得整体改写工作树
      text: |
        工作树里存在别人未提交的改动时，不得做无路径限定的收起、整片丢弃未暂存改动这类操作——
        它们会把他人改动一起卷走，事后也分不清哪些是自己的。
        这条禁止与动机无关；工作树里的改动全部是自己的时，正常的自救性还原不在此列。
        人明确要求整体清理时，按该要求执行，并在交还里说明。

    - id: evidence-boundary
      title: 这些结果各自只能证明什么
      text: |
        预检通过、提交缝放行、提交创建成功、回读一致——每一项只证明它自己的机械范围。
        它们都不单独证明：改动内容正确、这次提交已获授权、工作已经完成、价值已经兑现。
        报告时按已证实、未证实、待查分开说，不得用「提交成功」代替其余几样。

    - id: stop
      title: 这些情况必须停下来
      text: |
        - 预检给出不通过或未验证，而输入还没改好；
        - 提交被闸拦下后想用跳过校验的方式绕过；
        - 消息列表与差异是否逐条对应，确认不了；
        - 提交后的快照指纹与预检给的不一致；
        - 回读发现「多出」或「漏掉」；
        - 机械扫描得到的规则源成员集合，与逐项核对的成员成立条件对不上，或该结论回指不到具体文件与具体条件；
        - 准备用普通提交顶替受控提交流程。
        停下时按最小范围停：只停受影响的这次提交，以及与它相关的那句结论。

    - id: stop-allowed
      title: 停下期间还能做什么
      text: |
        停下期间只做不越过停止边界的动作：定位载体、改消息、核对暂存内容、重跑预检。
        不得继续这次提交，不得宣布它已完成，不得把相关结论说成成立。
        恢复要与停下的原因对应，只覆盖当前依据支持的范围；同一条件恢复后又出现时，交人决定。

    - id: protected-merge
      title: 合并触及受保护文档时
      text: |
        合并触及总纲、仓库说明、面向 AI 的插件文本、许可文本或已登记的版本声明点时，
        不得静默选一侧、不得直接拼接、不得用普通提交流程把冲突盖过去。
        须逐段形成合并结果，把现有内容、拟保留内容、差异与原因摆出来，取得人对该结果的明确同意；
        该同意只覆盖明确列出的文档、段落与结果。
        合并提交须以固定标记 `Merge-Touched` 逐项申报所触及的受保护文档；声明缺失、清单不完整、范围不清时不得进入受控合并。
        冲突标记残留、声明缺失、版本声明点漂移，任一识别不到或未通过即阻断。
        合并提交仍要过提交缝；过了闸不等于合并已获授权、已验证或已完成。
