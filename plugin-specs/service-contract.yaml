# 运行时机制：一份自足的要求清单。
#   身份字段 6 项必填：spec_key / spec_kind / title / canonical_path / positioning / scope
#   需要别处的东西时，用条目自己的话写出来，不引用别的载体。

ldvh_spec:
  spec_key: service-contract
  spec_kind: spec
  title: 回执语义
  canonical_path: plugin-specs/service-contract.yaml
  positioning: 管工具回执长什么样、三个完成状态各意味着什么、什么算部分完成、什么算不可用
  scope: 拿到一个工具回执、不确定某个状态代表什么、或要判断某次调用是否真的做成时，查阅本文件

  carries:
    - "helper-service-contract::8. 最小共同响应语义"
    - "helper-service-contract::6. 公开操作声明与能力发现/6.2 能力发现"
    - "helper-service-contract::6. 公开操作声明与能力发现/6.1 领域操作声明"
    - "helper-service-contract::7. 最小共同请求语义"
    - "helper-service-contract::5. CLI 契约与接入面/5.2 契约边界"
    - "helper-service-contract::9. 读取、预热与事实操作协作/9.3 受控状态变更"
    - "helper-service-contract::12. 必停情形/12.1 领域触发与影响范围"

  requirements:

    - id: what-is-receipt
      title: 什么算一次回执
      text: |
        一次回执就是一次工具调用返回的结果，由两部分组成：机器可读的结果，和可供交还的摘要。

        两部分不得互相矛盾：摘要里说的，须能在机器结果里读到同样的东西。

        回执只覆盖这一次调用，不是发起这次行动的一方的交还，也不替代那份交还。

    - id: no-receipt-before-execute
      title: 还没开始执行就没有回执
      text: |
        请求在进入操作执行之前就被挡下（比如参数不合形状），不产生回执。

        这时要核对的是请求本身缺什么，不得把这种拒绝当作回执来读，也不得据此声称这次操作做成或没做成。

    - id: receipt-echo-operation
      title: 须回显是哪个操作、结果属于哪一类
      text: |
        回执须写明本次调用的是哪个已声明的操作，以及结果属于哪一类。

        回显一个并不存在的操作标识，不使它成为可调用的操作；标识对不上时按请求无效处理。

    - id: result-domain-only
      title: 结果只写该操作自己的领域内容
      text: |
        回执里的结果只承载定义该操作的那套规则已经规定的内容；没有领域结果时明确写为空。

        不得在公共层补造领域字段，也不得用公共层字段顶替本应给出的领域结果。

    - id: scope-entry
      title: 须分开写请求范围、已完成范围与未完成范围
      text: |
        回执须把三件事分开写：本次请求了什么、其中哪些已经做完、哪些还没做完。

        「已完成」只指本次服务处理到的范围，不等于上层任务完成，也不等于某个判断成立。

    - id: sources-entry
      title: 用到的依据须连同可定位信息一起留下
      text: |
        本次实际用到的规则、事实、人的决定、配置、观察或实现依据，须连同能重新找到它的信息一起写进回执。

        回执不为这些依据排权威顺序：谁压过谁由各自的规则决定，不在这层裁。

    - id: gaps-entry
      title: 缺口要写明缺的是哪一类
      text: |
        回执须逐项写明缺什么：缺输入、缺能力、缺依据、缺覆盖、缺实现，还是缺验证。

        不得把缺口写成空数组、一句「成功」或一个已经做完的子范围。

    - id: changes-entry
      title: 变了什么、去哪里回读
      text: |
        可能改变状态的操作，回执只报实际发生的变化和能回读到的位置。

        零写入、被拒绝或失败，不得在回执里写成发生了改变。

    - id: verification-entry
      title: 校验部分只报实际跑了什么
      text: |
        回执里的校验部分只报本次实际执行的机械检查、它的覆盖范围和结果。

        不得把「有这项检查」或「检查通过」写成领域结论、人的决定、价值成立或整体完成。

    - id: follow-up-entry
      title: 下一步从哪里继续
      text: |
        回执须给出可继续的入口：继续读取、翻页、回读、修复、分流，或请人决定。

        没有可信入口时如实写为空，不得编一个入口出来。

    - id: state-completed
      title: completed：请求范围真的做完了
      text: |
        只有未完成项与缺口都为空时，才可以用 completed。

        不得用工具调用返回、进程正常退出、某个子范围完成来冒充 completed。

    - id: state-partial
      title: partial：做成了一部分，还有明确的没做完
      text: |
        已经实际完成某个可以独立判断的子范围，但仍有明确的未完成或未验证范围时，用 partial。

        用了 partial 就须在回执里指出哪部分做成了、哪部分没做成；不得把 partial 说成整体成功。

    - id: state-unavailable
      title: unavailable：前提不足，没能按请求提供
      text: |
        当前的规则、实现、能力、环境、输入或授权前提不足，无法按请求范围提供服务时，用 unavailable。

        「没查过、不知道有没有」不构成 unavailable 的依据；用 unavailable 须指出缺的是哪一项前提。

    - id: state-rejected
      title: rejected：输入够了，是被规则挡下
      text: |
        输入已经形成，但该领域已规定的机械条件、范围或权限检查拒绝了这次操作时，用 rejected。

        用 rejected 须写明是哪一条条件挡下的；拿不出条件依据的拒绝不成立。

    - id: state-invalid-request
      title: invalid_request：请求本身读不通
      text: |
        请求的形状或输入无法解析、或不符合该操作的契约时，用 invalid_request。

        这种情况须在产生任何领域副作用之前返回，因此回执里不得出现已发生的变化。

    - id: state-execution-error
      title: execution_error：开始执行后出了契约没吸收的错误
      text: |
        操作开始执行之后，出现该领域契约没有吸收的错误时，用 execution_error。

        须同时报出实际已经发生的副作用和残留范围；不得暗示可以无条件重试。

    - id: six-states-distinct
      title: 六个状态须分得开
      text: |
        completed、partial、unavailable、rejected、invalid_request、execution_error 六个状态须能互相区分。

        不得把它们压成「成功／失败」两类，也不得另立一个成功标志来替代它们。

    - id: availability-not-outcome
      title: 可用性描述不是调用结果
      text: |
        能力发现给出的可用性（已声明、已实现、当次可调用、部分可调用、不可用）说的是「这个操作现在能不能接」，不是一次调用的结果。

        两者不得混用：问一个操作有没有、能不能用，看可用性；问这次调用做成了什么，看结果状态。

    - id: missing-required-input
      title: 必填输入没给时只能报已声明
      text: |
        操作声明列出了必填输入、而本次请求没有提供时，能力发现只能报「已声明」并列出待补的输入。

        只有没有必填输入的操作，才可能被报成当次可调用。

    - id: callable-does-not-authorize
      title: 当次可调用不等于可以这样用
      text: |
        当次可调用只说明可以试着按契约处理这次请求。

        它不证明这次行动适用、不证明已获人的授权、不证明技术上可行，也不证明上层任务完成。

    - id: catalog-not-whitelist
      title: 操作目录不是行动禁区
      text: |
        操作不存在、未实现、不可用或请求无效，只说明无法按这个操作承接请求，不禁止规则允许的普通求解与其它能力。

        反过来，当定义某件事的规则明确要求某个操作时，那个操作不可用，就须按该规则暂停、缩小范围或改道。

    - id: precheck-before-side-effect
      title: 前提不全时先返回缺口，不动副作用
      text: |
        请求缺必需输入、范围无法唯一定位、依据互相冲突、或输入无法按契约解析时，须在执行任何领域副作用之前返回具体缺口或一条无效请求。

        不得用历史会话、缓存、同名路径、环境变量或未声明的默认值把缺口补上。

    - id: write-readback
      title: 写完回读没成，就不能继续往下写
      text: |
        可能改变状态的操作，只有在写后精确回读、已经触发的完整性审计、以及定义该操作的规定所要求的其它检查都完成时，才谈得上成功。

        其中任何一项未完成、只完成一部分或不满足，须停止受影响的后续写入、提交与成功声明，按必停处置。

    - id: write-success-boundary
      title: 写成功只证明写了这一次
      text: |
        状态变更回执里的成功，只证明实际的服务结果和规定要求的回读与检查范围。

        它不证明载体里的陈述是真的、不证明提交已经发生、不证明已获人的决定，也不证明上层任务完成。

    - id: partial-not-substitute
      title: 部分范围与回执状态不互相替代
      text: |
        事实读取交还的「已完成哪些对象、未完成哪些对象」，与回执的结果状态是两回事。

        不得用其中一个顶替另一个，也不得用其中一个去证明另一个成立。

    - id: read-honest
      title: 只读回执不把候选写成结论
      text: |
        只读操作的回执须如实交还读取范围、用到的依据和未完成范围。

        候选、卡片、概率提示与部分展开，不得写成已读全文、事实适用、行动允许或事实结论。

    - id: no-fake-receipt
      title: 没有实现就按不可用交还
      text: |
        工具没有注册、实现定位不到或当前环境接不上时，须按不可用交还并写明缺的是什么。

        不得为了凑一个回执而伪造结果、状态或依据。
