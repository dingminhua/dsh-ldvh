# 运行时机制：摩擦销账这一业务系统的要求清单。

ldvh_spec:
  spec_key: friction-settlement-system-foundation
  spec_kind: spec
  title: 摩擦销账
  canonical_path: plugin-specs/friction-settlement-system-foundation.yaml
  positioning: 管一个毛病从被发现到被销掉这一段：怎么发现、怎么入账、怎么算修好了
  scope: 要记一笔待修的毛病、或要判断某个毛病是否已经修好时，查阅本文件

  requirements:

    - id: what-it-is
      title: 这件事的产物是账目，不是授权
      text: |
        这里管一段：一个系统性阻碍从被发现，到被记成一笔账，到被判断是否已修好。
        产出只有账目及其当前状态，不是修复授权，不是立项决定，也不是修复完成。

        账目存在、停在待修、或观察次数攒得多，都不说明这个毛病值得修——值不值得修由人定。
        它也不替人排期：账本不是任务队列。

    - id: enters-when
      title: 什么时候进入这里
      text: |
        出现下列任一情形时进入：
        - 同一阻碍第二次及以上出现；
        - 一次阻碍的影响已可指到具体来源（规则、工具或流程）；
        - 人直接提出一项该修的阻碍；
        - 主控发起的摩擦发现交出了候选。

        阻碍可以是规则缺口、工具缺陷、流程迂回、检查失效或它们的组合。
        前提是当次现象能被核对到依据；核对不到的，不进入。

    - id: not-here
      title: 什么不进入这里
      text: |
        下列内容不进入：单次事件、还没收敛的调试过程、情绪化抱怨；业务上的坑（处置方向是怎么绕开，
        不是修）；还没定下来的问题；已经定下的决定；一次性的卡顿。

        判定不进入的，须在交还里写明判定理由。
        同一现象已经在账本里时，这次出现不是新账，是那笔账的又一次观察。

    - id: three-conditions-criteria
      title: 三条件各自的判定判据
      text: |
        一、重复性怎么算：同一阻碍要算作重复出现，每次出现的依据都得能各自回指到时间、场景或记录；
        同一会话里的连续重试算同一次，只说「感觉经常这样」没有出现依据的，不算。
        同一阻碍攒够三次出现，才算得上一笔账。
        二、可归因怎么算：能指出根源落在哪条规则、哪个工具或哪段流程，且别人按同一条路径核得到；
        只说「很难用」不算。
        三、修后更优怎么算：能说出改了什么会让同类代价降低。这一项只要求改善的因果可陈述，
        不要求净收益为正，也不评价修不修得起。

        三项是门槛，不是修复优先级；三项是合取，任一不成立就不立账，理由须随交还写出。
        任一项判不了时，不得先记上再说，须作为待定项交还并写明哪一项不确定、为什么。

    - id: decided-decision-conflict
      title: 与已定决定相抵时分两种
      text: |
        一是价值冲突：已定决定认为这项改造本身不值得做，改善预期被否掉，第三项不成立，不立账。
        二是途径关闭：已定决定关掉了消除途径，而阻碍真实、改善因果仍说得清，第三项成立；
        账照立，之后按不可清偿处置，并在处置段写明是哪条已定决定关掉了途径。

        前者是「不该修」，后者是「确实该修但修不了」，不得把后者按前者拒之门外。

    - id: attribution-conflict
      title: 归因冲突不得两侧各记一笔
      text: |
        两处归因互相排斥时，不得两侧各记一笔，须登记为待定项交还，写明冲突在哪。
        同一阻碍在两处都有账，会使两侧都不完整。

        归因判不了即不立账：须作为待定项交还，写明是哪一项判不了、为什么，
        不得在归因为空缺时先把账立起来，也不得在入账依据里留空。

    - id: dedup
      title: 立账之前先查重
      text: |
        查重没做完，不得进入写入。
        查重的锚是归因落点加机制模式，不是标题与现象的字面相似；字面相似只作查找线索，不作判定依据。
        查重须把归因与归因依据一并纳入对照。
        查重须同时覆盖三层：仍待修的账、已接受的账、缓冲里的同源观察；少查一层就是漏查。

        账本层或缓冲层读不出时按失败即停处理；规避经验层读不出时不停止，
        但须在交还里登记该缺失，且不得据此主张跨类型重复已排除。

        命中已有待修账时，这次观察按补充级更新记入那笔账，不新建账目。

    - id: merge
      title: 合并须能说出为何同源
      text: |
        把两次现象并成一笔账，须能说清它们为何同源；说不清的不得合并。
        合并不成立时各自立账，并在各自正文里写明与另一笔的区别，免得后来又被误合。

        以标题或现象的字面相似替代同源判定，不构成合并依据。

    - id: accepted-hit
      title: 查重命中已接受的账时静默
      text: |
        命中一笔已接受的账时，这次观察静默收场：不新建账、不写观察缓冲、不晋升。
        已接受的存在本身就是「已记录、不再当作待修项报告」这个结论。

        命中这件事须在交还里登记，让复审有入口；不得据此改它的状态，也不得重开它。
        静默的是新建与报告，不是次数——已接受的账仍继续计数。

    - id: cross-type-pair
      title: 同源的规避经验不并账
      text: |
        查重命中同一根源、但对象是规避经验时，不得并入摩擦账目，也不得因此拒绝把这笔账立起来。
        两条记录各自成立，并在摩擦这一侧建一条配对边指向那条经验。

        配对边只在摩擦这一侧写一行，规避经验那侧不写反向边；「这条经验对应哪笔账」由反查这一侧得到。

    - id: discovery-trigger
      title: 摩擦发现由主控当场发起
      text: |
        主控在当次行动里判定出现了阻碍现象时，整理这次发现所需的材料，派一个隔离子代理去跑那套动作。
        它不由计时器、周期调度或静置检查点驱动，也不得在设置面或旁路留下「定时派发」
        「静默一段时间自动跑」的等效结构。执行体当场派生，不向别的会话投递。

        发起不等于做完：完成证据只有执行体的返回值与写后回读。
        同一阻碍判几次就发起几次，写重了由查重承担；不假定跨会话的累计会自动发生。
        不依赖自动重试：失败按失败即停处置。

    - id: discovery-context
      title: 交给发现段的材料须有界
      text: |
        执行体是零上下文派生的，判断要用的材料全部由主控交出。
        交出的至少包括：这次阻碍的原文片段与它的定位信息（缺了或核不到，就不许跑那套动作）；
        仍待修与已接受账目的候选投影；缓冲里待晋升的观察分组；规避经验的薄投影。

        各项投影各自有交付上限，取样对时间无偏：不得按创建时间倒序截断，那会挤掉早记录、反复复现的旧经验。
        超出的登记为未覆盖，不得静默丢掉。

        判断须逐字引证交出的材料原文；引证不在材料里的判断不成立。

    - id: discovery-closed-set
      title: 一次派发内可做的动作只有这些
      text: |
        - 读账本、缓冲与规避经验，按归因落点加机制模式判同源；
        - 写一条观察条目；
        - 同一组待晋升条目攒到三条时，晋升一笔新账；
        - 对既有账目做补充级更新；
        - 写后精确回读；
        - 任一校验不通过时停下该次任务并留痕。

        超出这几件即越界。
        前两件由发现段做；晋升与补充级更新在同一次派发内机械收尾，不再另派执行体。
        机械收尾按同源归属键相等做比较，不重做同源语义判断。

    - id: discovery-mechanical-bound
      title: 机械通道只做三件事
      text: |
        属机械通道的只有：写观察条目、达阈值晋升新账、对既有账目做补充级更新。
        机械通道不得改变任何既有账目的状态——销账、废弃与接受全部由人决定。
        观察条目不得被当作账目处理，也不得据它做任何处置。
        不得据「这套机制存在」主张它已经跑过；它实际有没有跑，只能看运行痕迹。

    - id: promotion
      title: 攒到三条才晋升，且不可配置
      text: |
        同一组的待晋升观察攒到三条时，一次晋升成一笔待修账：次数取该组条目数，
        首次与最近观察时间取组内最早与最近，并把该组全部条目的逐字引证与来源一次写进正文
        ——缓冲会被淘汰，账目里的证据须自足。

        晋升幂等：同一组只晋升一次，已晋升的不再参与计数。
        阈值固定为三条，不设配置载体；人直接提出、当次即时检测、已接受账目的复审都不经这条阈值。
        阈值本身变更须由人决定；已晋升的账目不因阈值变更回退或改写。

        每次运行至多晋升一笔账；其余已达阈值的组如实登记为「本轮未处理」，下次接着来，不算失败。

    - id: buffer-what
      title: 观察缓冲是什么，能装多少
      text: |
        观察缓冲在事实源之外，按项目分载体，不取得对象身份，不承载关系，不参与召回，
        也不产生任何授权或结论。

        条目数上限两百每项目，满了按观察时间最旧优先淘汰并留下记录；条目数须在该项目的容量上限内。
        保留期九十天：到期的待晋升条目在淘汰前须先登记「这一组没攒够就没被晋升」的事实与组内已有条目数
        ——不得静默丢掉已攒到两条的组。到期的待晋升条目转为已淘汰，终态条目到期后整条移除，
        移除在读时惰性发生。

        它的存在、数量与状态变化都不构成任何账目的证据，也不推动状态流转。

        淘汰登记须先按登记键查重：同一条尚未销账的登记不得重复追加。
        登记已写而载体回写失败时，须把该批登记销账并写明未生效，条目保持原状。

    - id: buffer-write
      title: 缓冲怎么写、怎么结算
      text: |
        每个观察条目须记全一次观察的来处与内容：哪个项目、哪次会话、材料在当次的哪里、看到的现象、
        支撑它的原文与出处；还须记下这组观察指向哪个对象、凭什么归成一组、按什么依据归因，
        以及它在缓冲区里的处置。缺项即写入不合法，拒绝该条；具体登记哪些字段以写入入口的字段清单为准。
        项目须与载体分区一致；现象写描述不写结论；证据是交付材料的逐字片段并附来源引用。

        追加条目只有一个入口：发现段，一次运行至多写一条；结算与淘汰不算追加。
        晋升路径把条目结算为已晋升并记下去向，其余内容不再改。
        补充路径（带着目标账目的条目）在补充成功后整条移除，不转入别的状态；
        移除的时机与去向须留在当次运行痕迹里。

        已落盘条目的内容字段写错时，须经人明确授权，对象、字段、原值、新值与判定依据写进授权记录，
        AI 不得自行认定差错；改正前备份原样，改正后精确回读。

    - id: buffer-read
      title: 缓冲只给谁读、能给谁看
      text: |
        唯一读者是摩擦发现的查重与分组；别的执行体与主控不得把它的条目当账目或依据消费。

        展示面只可给出它的存在与数量，以及每条的现象、观察时间、来源会话与状态四项；
        不得展示引证全文，也不得让它点进去成为事实对象。

        缓冲不可写或写后读不回来时按失败即停处理，不得降级成内存记录或日志。
        缓冲与经验积累的载体分开，不得合并成一份。

    - id: measure
      title: 度量只认账目自带的次数与状态
      text: |
        待修与已修复分别进待修数与解决率，已废弃单列废弃率，已接受单列已接受成本。
        不得另立计数字段或度量载体。

        不得引入轻、中、重一类评级；评级不构成销账、废弃或接受的依据。

    - id: resolved
      title: 销账要解药成立
      text: |
        一、解药可回指：修复本身有对象身份，或有一次提交级痕迹。
        二、阻碍不再复现：解药落地之后，观察范围里没再出现。改过不等于不再复现：
        改动可被回退、可被绕过，也可只覆盖部分场景。
        三、覆盖范围一致：账目登记的范围与解药实际覆盖的范围相同；只覆盖一部分时不得整笔销账，
        要么先把账目范围缩小再销，要么保持待修并登记剩余。

        账目若带着配对经验，须在同一次交还里给每条一个去向判定；没作判定不使销账不成立，
        但须如实登记为未履行。销账不追溯成「从来不是问题」：历史与次数保留。

    - id: voided
      title: 废弃只用于记错了
      text: |
        理由须属三类之一：归因错、现象失真（含过度概括、把几个阻碍并成一个）、根本不是系统性阻碍。
        废弃不删载体。

        废弃后同类现象若真实存在须重新入账，不得当作已记录而不再收。
        「不值得修」不是废弃理由，也不产生任何状态变化：账目保持待修，不排期、不立项、不催办。
        不得以「暂不修」改动状态或观察次数，也不得用废弃表达暂不修。

    - id: accepted
      title: 接受只用于清偿不了
      text: |
        理由须属三类之一：消除途径技术上不存在；消除途径存在但不在本项目可动范围（外部系统、平台、
        第三方）；授权上不能动（受保护内容、外部决定、或已定决定关掉了途径）。

        接受由人逐笔决定，终态去向须非空，处置段须写明不可清偿的理由与复审触发。
        接受后不再作为待修项报告，不进待修计数与解决率，不进迭代决策输入；但仍进行动前的默认候选面，
        也仍参与查重。

        它不重开：复审触发出现时，由人新建一笔待修账并接续旧账的身份。

    - id: accepted-experience
      title: 可以改以经验缓解
      text: |
        面对一笔待修的账，除修、废弃、暂不修之外，人还可以选「不修机制、改以经验缓解」：
        把可复用的规避认识沉淀成一条规避经验，从摩擦这一侧建一条配对边指向它，账目随后转已接受，
        处置段写明这是经验缓解而非机制修复，并写出关联对象与不可清偿理由。

        走这条路径不得降低规避经验自己的准入门槛，也不得把「不想修」改称「修不了」。
        主控提请处置一笔待修账时，若该阻碍存在可沉淀的规避认识，须把这条路径作为一个可选方案一并摆出，
        不得只给「修」与「不修」两个选项；采不采用由人定。这条呈报义务无机械可检，如实登记为未覆盖。

    - id: fail-closed
      title: 校验不过就停下
      text: |
        任一项校验不可用、没通过、或写后回读不完整时，停下这次任务，保留已产生的副作用，
        把停止原因写进当次回执与运行痕迹。

        单条晋升或补充失败只影响该条：登记它，继续处理同批其余条目，那组待晋升条目保持原状等下次重跑。
        一拍失败不使另一拍已成功的写入失效。

        停下期间只做取证、补引用、修数据与条件核实，不继续写入，也不宣布已入账。

    - id: record-path
      title: 写入与流转不走快通道
      text: |
        账目的创建与状态流转走标准路径以上，不得降到快通道；查重与现象整理可以走快通道。

        查重是这个系统动作的前置：查重没做完，不得进入受控创建。
        账本读不出来、查重做不成时，不得在未查重的情况下入账，须停下交还，
        并把这次降级本身登记为需要观察的情形。

        账目归因错且已牵连其它账目时，停下并按受影响的最小范围处置。

    - id: handback
      title: 交还须说明什么
      text: |
        须说明：当次判定涉及的现象与范围；三项条件逐项的成立情况与依据；归因结论；
        是并入了既有账还是新建；哪些没核到（哪项条件没核、查重是否完整）；待由人决定的事项。

        交还须明确分开「账目已入册」与「这个毛病值得修」——前者是这里的产出，后者这里不产出。

    - id: human-gate
      title: 这些事须由人决定
      text: |
        是否值得修、是否立项；销账、废弃与接受；账目归因的改判，即这笔账该记到哪个账本。
        这里只出候选与证据。

        机械通道只做写观察、达阈值晋升、补充级更新三件；是否值得修、是否立项、销账、废弃、接受与归因改判
        都不属机械通道，机械通道也不得改变任何既有账目的状态。

        人决定「值得修」不使一个没满足三项条件的现象变成已入账，也不使一条没成立的解药变成已销账。

    - id: stop
      title: 必须停下来的情形
      text: |
        - 没查重就入账，或查重做不成还入账；
        - 把「不值得修」的账按废弃或接受处置；
        - 解药只覆盖账目范围的一部分，却整笔销账；
        - 同一阻碍在两个账本都有账，或归因冲突时两侧各记一笔；
        - 把待修状态或攒够的次数当成立项决定、修复承诺或排期；
        - 用机械通道改变既有账目状态，或把观察条目当账目处置；
        - 机械通道被用在写观察、晋升、补充级更新之外的任何动作上。

    - id: stop-scope
      title: 停下期间能做什么、怎么恢复
      text: |
        停下期间只做：补齐查重、修正归因登记、缩小账目范围、登记缺口。
        不继续入账、销账或废弃受影响账目，也不扩大已声明的范围。

        恢复须与触发原因对应，只覆盖当前依据支持的范围。

    - id: no-overdesign
      title: 不为齐整造东西
      text: |
        不为账本建聚合视图、趋势报表或跨项目分析平台；账目本身与它的状态就是这里的全部产出。
        不另立计数字段或度量载体；不预设修复优先级的评分模型、权重表或算法。

        不把入账做成仪式：三项条件不成立时不记「观察性账目」，也不为凑够重复次数把一次实例拆成多次。
        不把它扩成修复管理者：立项、执行与验收都不在这里。
