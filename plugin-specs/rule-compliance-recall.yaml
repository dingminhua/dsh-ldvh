# 运行时机制：双源召回——召回面这一侧的要求清单。

ldvh_spec:
  spec_key: rule-compliance-recall
  spec_kind: spec
  title: 双源召回·召回面
  canonical_path: plugin-specs/rule-compliance-recall.yaml
  positioning: 管召回这一侧本身：怎么走两侧、什么算命中、候选与依据怎么交、装不下时怎么取舍、召回范围与未命中怎么披露
  scope: 要开工前把该守的约束找出来、或要判断召回本身做得对不对时，查阅本文件；判断某条召回来的约束有没有真被遵守走核对面那一份

  requirements:

    - id: what-it-is
      title: 这件事做什么、不产出什么
      text: |
        双源召回管的是行动前把该守的约束找出来并核对上，分三段：
        取回与当次行动相关的候选；判定其中哪些真的相关、覆盖的是哪一段；
        把判定结果落成对行动的实际改变。三段都走完才算走完——只取候选、只写下判断、
        只生成记录，都不算。

        这件事的产物是当次的适用判断与核对结论，不产生授权，也不产生完成：
        「已识别」不等于「已允许」，「已落实」不等于「已完成」。
        授权只来自它自己的来源程序；完成由行动本身及其验证证明。


    - id: when-it-applies
      title: 什么时候走这一趟
      text: |
        出现下列任一情形时走双源召回：
        - 即将执行会产生副作用或改变状态的动作；
        - 既有规则、事实、决定或授权发生变化；
        - 上一轮交还声明了未验证范围，而本次行动落在其中；
        - 执行中发现实际影响超出事先假设的范围。

        进入不以「已经知道有哪条约束」为前提：不知道有约束正是这里要兜住的形态，
        不得因尚未找到来源就跳过。

        下列不进入：纯读取与纯查询动作；已经完成的行动，不因事后补做识别而视为通过了行动前核对；
        召回时机尚未成立的来源，不因这里而被全量拉取。

        一次核对只覆盖当次行动与当次识别范围，不延续到后续行动；后续行动即使同类也须重新识别，
        复用须有可回指的依据（如同一条约束在同一范围内已核对且未变化），
        不得以「上次已确认」代替本次判断。


    - id: uncertainty
      title: 判不了适用时不得当成没有约束
      text: |
        适用性无法判定时，不得按「无约束」处理：须把该项登记为未验证范围，
        并判断是否升级到标准路径或加固路径。该不确定项可能改变行动是否被允许时，
        须停下并交还，不得先执行后声明。

        来源存在而适用性不明、来源是否存在本身不确定，都按这一条处置。


    - id: two-sources
      title: 两侧都要走，只走一侧要说明
      text: |
        双源指规则与事实两个独立来源：规则来自这个插件的插件规范，以及事实源里的方向规范；
        事实来自事实源中的其余对象。召回须同时尝试两侧。

        只取一侧即退化为单源：单源结果可以交付，但须在交还中声明「本次为单源」，
        不得以单源结果充当双源召回。

        交还里写的来源范围须与实际读过的来源一致，不得把没读的一侧算进已核对范围。


    - id: recall-not-index
      title: 召回不建索引、不写事实源、不替代读原文
      text: |
        召回按需从来源读取，须同时守住三条：不建持久索引，不预建全量规则索引、
        不做实时同步、不建规则依赖图；不写事实源，召回本身不产生任何事实对象或状态变更；
        不替代精确读取，候选只指向来源，条文与对象内容仍须按引用读出。

        被召回不等于相关，未被召回也不等于不存在——两者都不得当作已核对。


    - id: hit-basis
      title: 命中依据须写明字段与值，且可复算
      text: |
        每张候选须写明它命中了哪个字段、命中了什么值，使同一输入与同一来源给出同一结果。
        只写「相关」「匹配度高」不构成命中依据，那是适用判断。

        结构匹配指查询词整值等于结构字段被接受的书写形态：不认子串，也不对字段值做前缀匹配，
        短值不得命中以它为前缀的更长值。结构匹配只产生候选，不产生适用结论。

        不得用相似度、向量嵌入、关键词权重或 AI 输出自动裁决相关性、适用性或事实结论；
        机械层只做确定性的字面或结构匹配。命中依据的可复算性不因匹配方式不同而放宽。


    - id: stable-reference
      title: 候选要带能直达的引用
      text: |
        候选须带可直达的稳定引用：事实一侧给出能直接读取该对象的标识，
        规则一侧给出该份插件规范自身的标识。只给这份插件规范的标识时它是全文入口，交付面须明说，
        不得暗示已定位到具体章节；需要精确章节时须同时给出该章节在这份插件规范内的路径。

        该引用须出现在交付文本里，可原样用作对应读取操作的参数，
        不能只存在于内部结构或文件路径中。取不到时如实标注缺失，不得用文件名或路径冒充可用入口。

        同一标识若还接受短写法，命中理由须写明命中的是哪一种写法，并声明短写法的已知边界：
        短写法存在前缀碰撞的可能，同一次查询会一并命中多个对象，不得据此声称指称无歧义。


    - id: consumption-instruction
      title: 用法须与候选一起交出
      text: |
        交付候选时须同时给出用法：逐条判断是否适用；改变行动范围、路径、前置条件、
        是否继续或是否提请人的，写明依据来自哪一条、改变了什么；确认不改变的，
        说明为何该条不要求改变。

        不得只给候选不给用法，也不得没有候选却给一套用法；
        因预算让位而给不出时须如实披露该项让位，不得假装已给出。


    - id: applicability
      title: 召回到不等于判定适用
      text: |
        候选不是适用结论，不是事实声明，也不证明它已被读过或已被遵守。

        适用识别须从来源中找出与当次行动相关的规则、事实、决定与授权，
        并为每一项给出适用依据：为何相关、覆盖当次行动的哪一段。识别不到的来源不因未被指向而不存在；
        不得以「已召回」代替这一判断，也不得把候选清单直接当作适用结论。

        判断的正确性由发起行动的 AI 承担，不由机械校验保障。
        这里只判定适用与落实，不解释规则的含义——解释规则的含义属规则本身的解释域。


    - id: selection-under-budget
      title: 装不下时先取证据强的
      text: |
        预算、条数或来源范围不足以交付全部候选时，按证据强度先取：命中更精确字段、
        命中更多实义词的强命中先于弱命中。该次序只决定预算先满足谁，不产生谁更适用的结论，
        也不得据此把被省略者说成不相关。

        四条必保项不得为腾出字节而删：命中依据、交付面的稳定引用、消费用法、完整度与未检查范围。
        取舍方向固定为先减少候选条数；让位仍装不下某项时如实披露。

        条数上限由该类对象自身的插件规范或调用方给出，不由召回机制自定；超出时须标明截断来源。


    - id: norm-directory
      title: 方向规范的索引只是索引
      text: |
        事实源里的方向规范须以索引形态每回合在场，作为自己的一行注入，
        写清它管什么、何时该展开，使读者不依赖当次用词就能判断该读哪一份；
        内容稳定也照注，只在同一批次内去重。

        该索引不带命中理由与排序权重，不占候选条数，也不带适用性断言——它不是候选，
        不参与词法匹配，只声称看得见。索引段自成一节，段头标明类型与在场口径，
        段尾声明该段是索引、不证明适用，并写明「摘录只用于判断该读哪份，
        命中者须先展开正文核对再行动」。

        零词法命中的回合，只要有索引内容仍须注入；「本类为空」的披露不构成注入理由。
        预算分配先满足方向规范索引，再满足其余词法候选。


    - id: index-budget
      title: 索引装不下时须逐项披露
      text: |
        索引段装不下时，标题行必出、定位摘录可降级；不得为腾出披露位置而撤标题。
        降级须在段尾写明另有几条定位摘录未附出；因正文里提取不出定位句而导不出的，
        须写明条数、明示不表示该份没有定位，并给出读正文的入口。
        两种计数互斥、不得重叠：在场标题数等于已附摘录数、降级数与不可用数之和。

        整段让位须留痕迹：写明哪一类未展开、共几条、取全量的入口；
        让位次序与注入次序相反，最后被满足的最先让出。

        索引不得把候选区挤掉：预算不足时先让索引降级，不得删掉候选区的命中依据、
        稳定引用或范围披露。


    - id: experience-on-demand
      title: 经验不常驻，只留一行可发现入口
      text: |
        经验不常驻。索引区只留一行可发现入口，写明当前在场的经验条数与取全量的工具入口，
        使「本类为空」「未列出」「读不到」三件事可分辨。

        该行的总数须真实；所给入口须真实存在且能取到全量，不得指向不存在的通道；
        该行只表明「有 N 条、去这里取」，不得表述为「已检查 N 条」或「无相关问题」。

        这一行不占候选条数名额，须自证未判定适用，不得与候选混排；
        经验本身的候选仍按词法匹配取用。


    - id: recall-scope-disclosure
      title: 召回范围怎么披露
      text: |
        召回结果须带完整度取值并逐类列出未检查范围。

        完成（complete）：声明范围内没有未返回的部分，无超预算裁剪、无条数截断、
        无过滤掉的相关候选、两源均可读。
        部分（partial）：已取得部分候选，但存在因预算、条数、过滤或单源不可读而未返回的部分。
        不可用（unavailable）：至少一源不可读，且当次未取得任何可用候选。

        取值须按这三态的名称给出，不得用转述代替。

        未检查范围须写明哪些来源未读、哪些被类型或状态过滤挡掉、哪些被结构字段收窄挡掉
        并带上它在收窄字段上的实际取值、哪些因预算或条数未返回。
        只给取值不给清单，或只写「已裁剪」，都等同静默截断。


    - id: zero-hit-exit
      title: 零命中也要留下记录
      text: |
        召回取值为完成且未发现任何相关约束来源时，仍须生成预检落实记录并随交还呈现，
        如实写明「已完成双源召回、未发现相关约束来源」以及已读与未读范围。

        不得写成「已检查」，也不得以「预检已完成」一句带过。


    - id: incomplete-recall
      title: 没走完的召回不能拿未命中当答案
      text: |
        召回取值为部分或不可用，含单源不可读、被预算或条数截断时，
        任何未命中都不构成「无相关」的证据。

        此时只能缩小行动范围到已识别部分可支持的范围后继续，并如实交还取值与未检查范围，
        或停止交还。不得以未命中断言无相关约束并据此继续；也不得以降级为名在未识别范围内行动。


    - id: budget
      title: 召回有预算，超了要说清
      text: |
        召回须有字节预算，并区分两个预算：注入进对话的路径一个，直接调用的路径一个，
        两者分别承载，不得互相代入。

        上限以具名常量或已登记的档位集合承载，运行期只在已登记档位中选择，
        未登记档位须报错，不得静默回落默认值。

        超限时须分页、继续缩小或返回部分结果，不得静默截断，
        并须标明截断来源是预算还是条数、实际用量，以及未返回的部分不代表不存在。


    - id: conflict
      title: 缺依据与来源互斥都不得自行补或选
      text: |
        缺少目标锚（当次行动所服务的目标）、缺少可回指的约束来源、或两个来源给出互斥要求时，
        不得以推测补全：须升级处置并暂停受影响范围。冲突须登记为待决定事项交还，
        由人裁定，不得由执行体自行选择较方便的一方，也不得以来源层级或先后自动裁决；
        裁定前不得在冲突范围内继续。


    - id: cross-cut
      title: 横切是适用面，不是替代
      text: |
        双源召回适用于全部业务系统，但不取代任何系统自身的判据：
        在某个系统内执行时，本系统的核对与该系统的专属核对须合并执行，不得因一边已做而免掉另一边。

        横切指适用面，不指替代，也不要求别处重复这边的判据。
