# 运行时机制：项目目标这一事实对象的要求清单。
# 身份字段 6 项：spec_key / spec_kind / title / canonical_path / positioning / scope。

ldvh_spec:
  spec_key: goal-fact-type
  spec_kind: spec
  title: 项目目标
  canonical_path: plugin-specs/goal-fact-type.yaml
  positioning: 管一个项目级的目标：它是什么、怎么定、什么时候算达成、什么时候要改
  scope: 要确定项目朝哪走、或要判断某个目标是否达成时，查阅本文件

  requirements:

    - id: what-is
      title: 什么算一个项目目标
      text: |
        一个项目目标是一条项目级意图的冻结锚，回答两件事：这个项目为什么存在、要实现什么。
        粒度是项目级单例：一个项目至多一个目标，不是每个方向、每轮规划或每条任务各一个。
        挂在它下面的子目标不在这个对象里；「已经展开哪些子目标」是由子目标回指反查出来的视图，不存副本。

    - id: not-goal
      title: 什么不形成项目目标
      text: |
        下列内容不形成项目目标：
        单个方向或一个还想不清的问题，留作方向线（一条跨行动保留的悬置问题）；已定下的决策，由人的决定与项目规则承载；对外部对象的深度调研结论，写成调研报告；某一轮的执行计划与验收，在当次行动里承接，不单独立对象；项目自己的价值约束，由项目级规则承载；永远无法判定的使命宣言式文本；跨多个项目共用的目标。

    - id: single-instance
      title: 一个项目只能有一个目标
      text: |
        目标的身份就是它所在的位置：放在项目事实源的固定单一位置，不分配对象标识，不建类型子目录，不按文件名编码；一个项目里至多一份。
        受控创建在目标已存在时须零写入拒绝，不得创建第二个。
        这个约束由位置唯一性机械承担：不做相似度裁决，也不靠语义比对判断「是不是同一个目标」。
        目标不走候选召回：使用它的地方按固定位置直读全文，不建候选投影、索引或缓存副本。

    - id: statement-only
      title: 目标里只有一条目标陈述
      text: |
        目标只承载一条目标陈述：一段话，写清「为什么做」与「要实现什么」，写给未来会话与后来的读者。
        它是这个类型唯一的内容：不并存短版与长版，不设任何摘要型字段；同一句话在概览与详情里都按原文呈现。
        不得引入摘要字段，也不得为同一意图另存第二份陈述。

    - id: limits
      title: 陈述与标题的字数上限
      text: |
        目标陈述去除首尾空白后不得超过 200 个字符；标题不得超过 40 字。
        计数单位是字符串长度，段内换行与空白照常计入。
        不得把「怎么做」「做到哪算成」「为什么这样拆」写进这两处。超限时须拒绝写入，不得截断后写入，也不得把细节塞进标题。
        标题不得承载子目标内容。

    - id: statement-decidable
      title: 目标陈述须可判定
      text: |
        目标陈述须能被证据判定、指向未来状态、不依赖当次会话、不绑定实现手段。
        它的来源是人的决定本身，不适用外部证据锚定；不得用外部资料、代码输出或推测生成陈述。
        不得据字数达标声称陈述可判定；这一项是语义判断，由人确认承担，机械检查只保证长度。

    - id: body-structure
      title: 正文只有一块目标陈述
      text: |
        正文只有一块固定二级标题段「目标陈述」；一级标题只有一个、与标题一致，且由写入入口生成；正文从二级标题写起；该段须存在且非空。
        不得为目标追加第二块内容段，也不得把子目标列进正文。

    - id: frontmatter-authority
      title: 载体头部是唯一权威文本
      text: |
        目标载体头部的权威字段是唯一权威文本，正文对应段只作展开，两者须逐字一致。
        两者不一致时以载体头部为准，须先改正正文再据此读取或呈现，不得反过来用正文改写载体头部。

    - id: subgoals-not-stored
      title: 子目标不放进目标载体
      text: |
        目标载体不得列出子目标条目，也不得存子目标的状态副本；子目标的判据、状态与变更都不在这里。
        子目标各自带上「挂在哪个目标下」的引用指回来；增删或作废子目标不经目标的更新入口，也不为目标追加变更记录。
        反向投影（本项目有哪些子目标）由反查得到，呈现不回写。

    - id: no-upstream
      title: 目标没有上游，只有下游指上来
      text: |
        目标是引用链的顶端：没有上游、没有平级，因此不建关系记录。
        唯一合法的边由下游自带——子目标指向目标，服务中的对象再指向子目标。
        要问「这个目标下面有什么」，反查得到；目标侧不存副本。

    - id: states
      title: 两种状态与各自的成立条件
      text: |
        目标只有两种状态：active 与 achieved。
        active 表示目标正在生效、项目还在推进；新建目标必为 active；它不说明进展顺利，也不说明子目标已经齐备。
        achieved 表示全部子目标的达成判定成立，并且人已经决定收官；翻转之后目标冻结为历史档案，不再修改。

    - id: no-other-states
      title: 没有放弃、退役、替代与重开
      text: |
        目标不设放弃、退役、替代与重开四种状态。
        项目放弃等于项目退役，目标载体随项目目录留作历史档案；不存在删除操作。
        目标被根本推翻走修订——改陈述、留理由，不是状态转换。

    - id: human-decides
      title: 创建与修改目标都须人先决定
      text: |
        创建目标、以及目标的任何修改，都须先取得人的明确决定；AI 只能提出候选，没有直接写入的路径。
        「没有反对」不算决定，沉默不算决定。

    - id: create
      title: 创建目标只经一条路径
      text: |
        创建只经项目初始化对话这一条路径；写入前须确认目标载体尚不存在，已存在即拒绝，不得创建第二个。
        AI 只能提出候选，落盘须人确认；创建后须精确回读，回读不通过时该次创建不成立。

    - id: update-record
      title: 每次修改留一条变更记录
      text: |
        每一次实际发生的修改恰好留一条变更记录，理由须能独立回答「改了什么、为什么改」，不得写成「按讨论调整」这类空话；变更须对应一次人的确认，没有确认记录的修改不成立。
        创建时间由受控创建入口填写，AI 不得填写；变更的时间与署名由受控入口托管，AI 只提供一句话语义摘要。

    - id: correction-vs-update
      title: 更正与更新不是一回事
      text: |
        更正只改错述，不动已经作出的判断结论；要改结论就属更新。
        两者的权限与纪律相同：都须人的确认，都留恰好一条变更记录。
        不得以更正之名改变判断结论。

    - id: achieved-evidence
      title: 宣布收官前逐条核对证据
      text: |
        宣布达成之前，须取出挂在该目标下的全部子目标，逐条核对其约定的判据，并确认每条都有可回读的、判据所指的材料。
        有缺口时须保持生效状态并把缺口列出来；不得补造证据，也不得掩盖缺口。

    - id: empty-subgoals
      title: 子目标为零或全部作废时不满足收官前提
      text: |
        子目标为零、或已全部作废时，不满足收官前提，也不得以「没有反对意见」推定为可以收官。
        这种状态须在交还与呈现里显式标注为「未完成精化」，让缺口看得见。
        目标刚建立、尚无子目标时，对象本身已经成立：欠的是精化环节。

    - id: revision-cascade
      title: 目标修订后要标记受影响的下游
      text: |
        修订落盘后，须按回指取出全部子目标，再扫这些子目标名下服务的在途对象，逐个标记为「目标已改、待核对」并生成待办。
        子目标自身是否仍对齐目标，同属须核对项，结论记在各自对象的变更记录里。
        只到在途对象，还没定形、仍在悬置的问题不在此列；每一跳只是标记，不是动作。

    - id: cascade-no-storage
      title: 级联不在目标侧留下任何状态
      text: |
        目标侧不得为级联保存下游状态、标记清单或索引；标记与待办落在被标记的对象与待办本身。
        下游有什么、标记了谁，都靠反查得到。

    - id: authorization-anchor
      title: 授权提请必须锚定到子目标
      text: |
        每次授权提请都须写明这次行动服务哪一条子目标，直引其标识与标题，并能解析到对应的子目标对象。
        解析不到子目标时，提请没有锚，不得受理。

    - id: missing-goal
      title: 目标缺失时
      text: |
        目标缺失时授权没有可引的锚，须拒绝受理；不设「缺失」这种状态，也不拿别的文件顶替。

    - id: reads-not-blocked
      title: 目标缺失不拦读操作
      text: |
        目标缺失时，读操作不受阻：调研、讨论、浏览、方向线探索照常进行。
        不得以「还没有目标」为由拒绝这些读操作。

    - id: empty-subgoal-hint
      title: 目标在、子目标为空时怎么办
      text: |
        目标存在但子目标为空时，对象可以照常走；注入与呈现须提示「子目标待精化」，这个缺口在交还里须看得见。

    - id: session-injection
      title: 每次会话注入什么
      text: |
        每次会话都注入目标陈述，以及服务中对象的一行摘要。
        目标缺失时改注入「项目未初始化」的提醒。

    - id: projection
      title: 呈现当前目标时投影什么
      text: |
        呈现当前目标时，投影目标陈述与子目标的派生概览；子目标为空时一并给出提示。
        不得为呈现另存副本，投影不回写。

    - id: evidence-layers
      title: 达成判定的三层互不替代
      text: |
        机械层只反查子目标与各条名下对象的关闭记录，校验存在性与格式，不判断材料是否满足判据。
        AI 层逐条审核材料是否覆盖判据，发现缺口须列出，不得补造证据。
        人层终判。

    - id: assembly-check
      title: 装配方案依据前核对目标服务性
      text: |
        装配方案依据（把方案收敛成可执行方向的工作）之前，须核对本次方案服务的子目标，并确认它与目标陈述覆盖的方向一致。
        对不上时先纠正范围，不得带着不对齐的方案继续装配。

    - id: decision-bound
      title: 人的决定不替代这些判断
      text: |
        人的决定不得被用来说明：陈述可判定、子目标可观测、达成证据完整、目标与进展的偏离已被证据支持、目标本身正确。

    - id: stop
      title: 这些情况必须停下来
      text: |
        出现下列任一情况，须暂停受影响的目标写入与呈现：
        准备创建第二个目标；准备在目标载体里重新承载子目标条目或状态副本；AI 未经人确认直接执行修订；达成提议存在子目标证据缺口；级联扫描发现受影响对象存在而标记遗漏。
        暂停期间只允许证据补取、引用修复、授权补走与条件核实。恢复须与触发原因逐项对应；同一停止条件若在恢复后再次出现，改由人决定处置。
