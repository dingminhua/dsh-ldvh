# 运行时机制：摩擦账本的要求清单。

ldvh_spec:
  spec_key: friction-fact-type
  spec_kind: spec
  title: 摩擦账本
  canonical_path: plugin-specs/friction-fact-type.yaml
  positioning: 管一笔已经立账、还没销掉的系统性毛病：什么算一笔账、怎么攒、怎么销、怎么接受它不修
  scope: 要登记一笔待修的毛病、或要判断某笔毛病是否已经销掉时，查阅本文件

  carries:
    - "friction-fact-type::13. 受控操作"
    - "friction-fact-type::12. 召回与消费"
    - "friction-fact-type::9. 状态与生命周期/9.4 配对的转换义务"
    - "friction-fact-type::9. 状态与生命周期/9.2 状态转换"
    - "friction-fact-type::9. 状态与生命周期/9.3 补充级更新"
    - "friction-fact-type::4. 适用范围/4.2 明确排除与证明边界"
    - "friction-fact-type::11. 关系契约"

  requirements:

    - id: what-is
      title: 什么算一笔摩擦账
      text: |
        一笔摩擦账是一笔可以单独处置的待修阻碍：一句现象、一份入账依据、一个归因（可以后补）、一处处置（条件出现时）。

        它须能单独销账、单独统计，是度量聚合的最小单位。

        它的初态就是待修态。不设「已经看见但还不够格」的观察态——那种观察不进账本，留在别处的缓冲里。

    - id: not-friction
      title: 什么不算一笔摩擦账
      text: |
        下列内容不立摩擦账：
        - 业务上的坑：应对方式是保持系统不变时的规避做法，记成规避经验；
        - 还没定下来的问题：归因与「修了会更好」都还判不了，够不上条件；
        - 已经定下的决定与已被方向规范吸收的改进：规则归方向规范承载，账目可作触发证据，但不承担规则；
        - 一次性的卡顿、情绪化的抱怨、纯偏好与审美之争。

        修了会更好的判断不成立的，一律不记。

    - id: friction-or-lesson
      title: 与规避经验怎么分
      text: |
        同一根源可以两边各记一条，不互斥。分诊只问两件：

        一、问角色：这条记录主张的是「这里有笔该修的账」，消除途径要改系统本身（接口、流程、工具配置），记摩擦；还是主张「系统不动时怎样避免损失」，记规避经验。

        二、问同源：两条记录的归因落点与反复产生的机制模式是否相同，不看标题与现象的字面相似。同源且同角色时不新建，把这次观察补进既有那一笔；同源跨角色各自成立，并在摩擦这一侧建一条配对边。

        「修不修得起」不得用作分诊依据。「技术上不可能」「代价上不值得修」「授权上不能动」是三件不同的事，后两件正是本账本该收录的。

    - id: three-conditions
      title: 入账要三项全中
      text: |
        一、重复出现：同一阻碍已被独立观察到三次以上，或有证据等价的重复性。

        二、可归因：能指向具体的子系统、规则或流程。归因暂缺也可以入账，但须在入账依据段写明归因为何暂缺，不得默默省略。

        三、修了会更好：修复有可感知的改善预期。这一项只要求改善的因果可以陈述；不要求净收益为正，也不得在这一步评价修复方案是否可行。

    - id: threshold
      title: 账目成立以同源观察攒够三条为前提
      text: |
        机械晋升是唯一自动产生账目的路径：同一阻碍的同源观察攒到三条时，一次晋升为一笔新账，并把全部同源观察证据一次写入正文。攒不到三条的观察留在缓冲，不进账本，也不得提前立账。

        人直接提出、当次即时检测与已接受账目的复审不经过阈值判定：由人判断阻碍是否真实存在，不要求缓冲里另有同源条目。

        机械通道只做两件事：写观察条目；同源观察达阈值时晋升为一笔待修账。不得扩张出第三类触发，也不得作用于任何已存在账目的状态变更。

        晋升只改变账面分类，不得据此产生排期、优先级或立项。

    - id: dedup
      title: 建账之前先查重
      text: |
        查重结论须写进创建提案；没有查重结论不提请、不落盘。

        查重的锚是归因落点加机制模式：同一机制在不同场景下措辞不同，仍须补进同一笔账；现象相似而根源不同是两笔账，不得并账。

        查重须同时查三处：仍待修的账、已接受的账、缓冲里的同源观察。只查其中一处即构成漏查重。

        查不到现存配对时不得据此推断不存在同源记录：一条记录的半边载体可能已经不在，缺一半须如实登记为缺口。

        命中已接受的那笔时静默收场：不新建账、不写缓冲、不晋升。已有同题待修账时，这次观察只补进那笔待修账。

    - id: identity-carrier
      title: 身份与存放
      text: |
        一笔账一个平铺文件，放在所在事实源的摩擦目录里，文件名由身份编码决定；不建子目录，不另设目录。

        两处落点按根源判定，不按发生地：阻碍的根源在插件自身的规则、工具或流程，记到插件仓库的账本；根源在某个项目自身的构建、依赖或流程，记到那个项目的账本。

        身份由写入路径生成，终身不变，不得挪给另一笔账用；创建时间与变更流水由写入路径填写，不得自行填。

    - id: title-phenomenon
      title: 标题与现象
      text: |
        标题不超过 30 字，用来说清是什么阻碍，不复制现象全文。

        现象是一句可就事论事的陈述，不是结论：写可观测的量与次数，不写「太慢」「不合理」这类判断。

        重复频次以发生次数为机械权威，正文现象段是人类可读的投影；两者不一致时以发生次数为准，差异只报告、不阻断写入。

    - id: attribution
      title: 归因指向根源
      text: |
        归因指向阻碍的根源落在哪个子系统、规则或流程。根源常常就是流程本身而没有对象身份，所以归因允许是一句自由文本。

        需要精确指向某个既有对象时，用对象身份作引用；引用出现时须能在同项目内解析，解析不到即零写入拒绝。

        引用没有出现时，归因是否真实属审核判断。

    - id: occurrence
      title: 每笔账都要带发生次数
      text: |
        创建时须带发生次数：累计被独立观察到的次数，加上首次与最近一次观察的时间。初值取该账成立时已确认的观察次数。

        此后它只经由补充级更新递增，不得回填或改写更早的观察时间。

        已修复与已废弃后，次数与两个时间冻结；已接受只递加次数、更新最近一次观察时间。

        例外：因状态闭集收缩而改判为已废弃的账目可以没有它。

    - id: disposition
      title: 终态要有一句话的去向
      text: |
        账目落到已废弃或已接受时，须附一句话的终态去向，说明为何废弃或为何不可清偿，不得为空；其他状态不得带它。

        它是薄索引，供列表直接读出；完整理由写进处置段，两处不互相替代。

        已修复的账不设这一项：它的去向由指向解药的关系边机械承载，另设一项会造出第二个来源。

    - id: relations
      title: 只带两种关系边
      text: |
        一、指向解药：仅在已修复状态出现，一到多条，目标须是现存事实对象。解药本身没有对象身份、只是一次提交级修复时，目标可以直接取那次提交；仅在无对象可指时这样做，不得用来回避本可指向的对象。

        二、配对的经验：任何状态都可出现，零到多条，目标须是同项目的一类规避经验对象，不校验它当前的状态。

        两种边都只在摩擦这一侧写一行，经验侧不写反向边；「这条经验对应哪笔账」由反查这一侧得到。

        只是消费了某次修复、并非由它解决本账的，那是证据而不是解药：记在处置段，不得指向那个消费者对象当解药。

        配对目标已被废弃但有同一机制的转正版时，配到转正版；没有转正版就让配对暂缺，不得配到废弃版。

        提交级证据定位只允许挂在指向解药的那条边上，且该提交须在受控仓库里真实可解析。关系的写入须走当前指纹绑定的完整更新入口，写后精确回读。

    - id: states
      title: 四种状态
      text: |
        待修：阻碍仍在、还欠一次修复，参与攒账与度量。

        已修复：修复完成，并带一条指向解药的关系边。

        已废弃：这笔账记错了——归因错、现象失真、或根本不算系统性阻碍；不再参与查重、度量与决策输入。

        已接受：阻碍真实，但消除途径不存在、不在本项目可动范围，或授权上不能动；记录一次后不再作为待修项报告。

        四种之外没有别的状态；待修是初态，其余三种都是终态。

    - id: accepted-boundary
      title: 已接受只收不可清偿
      text: |
        已接受只收「不可清偿」，不收「代价不值得修」：后者是权衡结论，账目保持待修。

        判成已接受须属三类之一：消除途径技术上不存在；消除途径不在本项目可动范围（外部系统、平台、第三方）；授权上不能动（受保护内容、外部决策已经关掉消除途径）。

        「修得起但不想修」不得走这一状态。

    - id: resolved
      title: 销账
      text: |
        销账须由人决定，并同时说明解药指向何处。指向解药的边须至少一条、目标可解析。

        销账时若这笔账带着配对经验，须在同一次交还里给每条配对经验一个去向：保留、改写、还是退休，并写出理由；已作出的判定须能在处置段回读到。

        销错之后只能走终态更正，不得重开。

    - id: voided
      title: 废弃
      text: |
        废弃由人决定。处置段须写出废弃理由，属三种之一：归因错误、现象描述失真、根本不是系统性阻碍；终态去向须非空，且不得带指向解药的边。

        废弃不删配对边——「曾认为二者同源」是历史事实；但须说明配对经验是否随之失去依据，失去依据的那一侧须移交复审。

    - id: pairing-lesson-discarded
      title: 配对的经验被废弃时复审归因
      text: |
        反查发现配对的那条经验已被废弃时，须复审本账目的归因是否仍成立：原配对基于那条经验的机制判断，该判断被否定时本账目可能建立在同一错误前提上。

        复审在下次触及本账目时进行（补充级更新或流转），并须留痕；本账目不因对方废弃而自动改状态，状态变更仍由人决定。

        配对边不删：曾认为二者同源是历史事实。

    - id: accepted-transition
      title: 接受不可清偿
      text: |
        接受由人决定。终态去向须非空，处置段须写出不可清偿的理由，并写明复审触发：什么条件出现时该重审。

        这项流转不触发配对复审——债没有清偿，规避经验仍然需要，配对边保持有效。

        已接受的账不得带指向解药的边。

    - id: no-reopen
      title: 终态不重开，也不删除
      text: |
        三种终态都不重开。环境变化使接受的前提消失时，由人新建一笔待修账，并在正文接续旧账的身份；旧载体保持只读。

        终态的载体一律保留可追溯；不存在删除操作。

        销错或接受错了，走终态更正这一条通道，不走状态转换。

    - id: correct-terminal
      title: 终态账目怎么更正
      text: |
        终态账目的内容更正只改正文与关系；状态、标题、现象、归因与归因引用、发生次数与创建时间逐字不变。

        只对已修复、已废弃、已接受三种终态开放：待修账的内容修正走补充级更新或状态流转，不得用本入口。

        须带人的授权记录（谁、何时、覆盖什么），缺它即拒绝。授权记录是自报文本，它被写进流水只证明记录已提交，不得据此声称人真的作过这次授权。

        没有实际变更的更正须拒绝，不得留下一条声称更正过的流水；更正后须写后精确回读。

        更正后若一句话去向与正文理由不一致，须在同一次交还里说明分歧与以哪一处为准，不得借更正去改那一句话去向。

        分状态另须成立：已修复须至少一条指向解药的关系且目标可解析；已废弃与已接受须不带指向解药的关系。

    - id: correct-fields
      title: 终态更正能在字段上做什么
      text: |
        终态更正可以在字段上做两件事，此外不得新增字段、不得改字段的值：

        一、删字段：只允许删已退出字段闭集的字段、其存在本身就违反字段约束的字段、以及目标对象已退役或将退役的锚点字段。删锚点字段的机械判据是目标在写入时刻解析不到；「将退役」须由人在授权记录里言明，不得据此删除目标仍可解析的锚点。

        二、补字段：只允许补新进入闭集的字段，值须可由既有载体据实推得；推不出时不得补填，该字段缺失的事实如实保留。

        两类动作都须带授权记录，也都不构成「本入口可以改字段值」的先例。

    - id: supplement-update
      title: 补充级更新
      text: |
        补充级更新只作用于已成立且待修的账，记录「成立之后又观察到同一阻碍」。每次变更以完整文件为界、恰好一条流水，写明改了什么。

        一、次数加一，最近观察时间改成本次；这两项与现象段扩展须在同一次更新内完成，它们是同一事实的两个承载面。

        二、归因可以后补，表述可以澄清，配对边可以在这一步建立与更正；加一条配对不走状态流转。

        三、状态不得改变，变了即拒绝——状态变化走流转；现象语义实质变了（成了另一个阻碍）也走新账目。

    - id: accepted-still-counts
      title: 已接受仍然计数
      text: |
        已接受是唯一仍然计数的终态：它的语义就是阻碍真实且消除途径不存在，这类事会继续发生。口径是三件事分开落地：

        一、不重复记录：命中即静默，不新建账、不新建观察组、不晋升。

        二、不报告：不进待修计数、不进解决率分母、不进决策输入。

        三、但次数加一、最近观察时间更新，走与待修账同一条受控更新入口。

        这次观察须确系并入本账目才计数；已有同题待修账时它只并入那笔待修账。

        只增数字不增叙述：现象段保持终态冻结时的内容，此后复现也不改变按文本命中的面。这个计数不构成复审触发，复审仍只由处置段写明的外部条件决定。

    - id: recall-decision
      title: 按账本作决定的两个面
      text: |
        一、迭代决策输入只取待修的账，按归因聚合；已接受的不进这一面——它是已经接受的成本，不是待修项。

        二、度量按状态可机械统计：待修与已修复分别进待修数与解决率；已废弃单列废弃率，不进解决率分母；已接受单列已接受成本，同样不进解决率分母、不计入待修数。

        缓冲里的观察条目不是账目，不得与账目计数相加或混报。

    - id: recall-candidates
      title: 行动前的默认候选面
      text: |
        默认候选面只含待修与已接受两种账；已修复的只在精确引用或历史追溯时展开，已废弃的不进候选面。

        已接受的账进候选面，让人动手前看见这类仍然存在的阻碍；但不得据此提议修复、排期、立项或新建账目，据它作判断前须先读处置段。

        候选面有分节名额：证据强度相同时待修先于已接受；被裁掉的部分须标明未返回，不得把未返回读作不存在。

    - id: pair-lookup
      title: 从经验反查账目
      text: |
        给定一条规避经验，须能反查出所有配对指向它的账目，含终态——配对不随债的清偿消失。

        返回集有上限，被截断时须标明返回不完整；未完整时不得把「没查到」当作「没有配对」。

        落盘后的回读须验证反查能命中本笔账目，且返回集完整。

    - id: no-obligation
      title: 入账不产生修订义务
      text: |
        账本不产生修订义务：一笔账存在、处在待修、或攒了很多条，都不证明阻碍真实、值得修或修复有效。

        修不修、什么时候修，永远是迭代决策；攒得再多也不得据此产生排期、优先级或立项，也不得自动触发任何行动。

        不得据账目数量或存在本身声明阻碍值得修、修复有效或效用已成立。

    - id: no-decoration
      title: 不设没有消费方的东西
      text: |
        不设严重级、优先级、标签这类没有消费方的字段；一个字段的每个消费方都须能指认到投影、消费面或校验。只由展示支撑、判据不可复现的分级不得设立。

        不设外部链接字段：摩擦是内部体验，不依赖外部证据。

        不建账目之间的关系边：同一阻碍的重复走补充级更新补进同一笔账，不在账与账之间织网；配对边连的是跨类型的同源对象，不是账目网络。

        已接受这个状态须有三个消费方：查重命中即静默、度量单列、行动前候选呈现；任一未实现时不得声称它已成立，也不得为凑状态数保留无消费方的取值。

    - id: body-sections
      title: 正文固定三段
      text: |
        正文的一级标题只有一个，由写入路径按标题生成；三段内容都从二级标题起写。

        现象——阻碍的具体表现、重复出现的证据与首次观察来源。

        入账依据——三项条件逐项核对：为何算重复、归因到哪、修了会改善什么。

        处置——解药记录、废弃理由或不可清偿理由。

        第三段只在已修复、已废弃、已接受时存在，待修时必不在。前两段在任何状态都须非空且答全；只把标题逐字抄一遍不算展开。

    - id: stop
      title: 这些情况必须停下来
      text: |
        - 建账前发现同题待修账已存在，而查重还没查完；
        - 三项条件核对不齐：重复性没有证据、既无归因又未在入账依据段说明为何暂缺、修益判断为空；
        - 现象为空或读不出；
        - 准备用补充级更新改变状态或换掉现象语义；
        - 销账缺解药边或目标解析不到；
        - 废弃缺处置段，或带着指向解药的边；
        - 接受缺终态去向、缺不可清偿理由或复审触发，或带着指向解药的边；
        - 准备把「代价不值得修」按已接受处置；
        - 机械通道的语义查重被判定为误判（把不同阻碍当作同题而错误递增发生次数），却准备据该次数继续判定或流转——须先按原次数复核并更正，该次观察的处置如实登记；
        - 度量消费时把终态计入待修，或把缓冲条目当作账目计入待修累计；
        - 准备不经人决定、又不属机械晋升范围就写账或流转。

        停下期间只做取证、修引用、补授权与条件核实；恢复须与触发原因逐项对应，同一条件恢复后再次出现，交人决定。
