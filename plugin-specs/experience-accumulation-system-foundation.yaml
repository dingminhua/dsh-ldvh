# 运行时机制：经验积累这一业务系统的要求清单。

ldvh_spec:
  spec_key: experience-accumulation-system-foundation
  spec_kind: spec
  title: 经验积累
  canonical_path: plugin-specs/experience-accumulation-system-foundation.yaml
  positioning: 管一条经验怎么被留下来、怎么被分流、什么时候该回头看它
  scope: 要留下一条经验、或要判断某条经验该怎么用时，查阅本文件

  requirements:

    - id: what-it-is
      title: 这件事只有一件产出
      text: |
        经验积累只有一件产出：一份从目标、判断、行动、结果、摩擦与反馈里收上来的候选经验认识，
        以及这条认识该落到哪里的去向判定。

        它管「这条认识值不值得留、留下之后算什么」，不管留存动作本身怎么执行，
        也不管事实对象的字段、状态与写入怎么做。

        它不产生行动授权、规则效力或完成结论：候选形成、候选留下、反思结论生成，
        都不使任何约束或行动获得效力。它的产物存在、数量或状态，也不证明项目的经验已经积累够了。

    - id: when-it-applies
      title: 什么时候进入
      text: |
        出现下列任一情形时进入：
        - 一次失败已经解决，而它的机制可能重现；
        - 同一类障碍在多个会话或多次行动中重复出现，需要判定是否同一机制；
        - 产生了一份认识，需要判定它是方向、决定、经验、规则还是摩擦；
        - 既有经验所依赖的平台、依赖或环境发生变化，需要重检它是否仍然成立；
        - 当次行动中发现一条已经查明验证、且可能重现的失败机制。

        最后一项不等待空闲期，也不要求已经有跨运行的观察区间。每一项进入都由发起那次行动的一方在每轮结束时固定自查一遍：本轮有无可回指的材料（原文＋定位）；有材料即当场派生执行体，不预判它是否成立、不因「判不准」而跳过——成立判定是执行体的事。自查是每轮都做的本职，不靠计时器、周期调度或静置检查点驱动；触发派发的始终是「有可回指材料」这一条件，不是「又过了一轮」。

    - id: entry-prerequisite
      title: 进入的前置条件
      text: |
        当次认识须有可回指的行动、观察或材料作为证据基础，且它的适用范围可以被说出来。
        适用范围说不出来的认识，即使真实，也不满足进入条件——它无法在后续行动里被判定是否适用。

        一份经验只覆盖它声明的适用范围；后续情形相近，不因相近而自动适用，
        须重新核对适用范围与它的重检信号。

    - id: excludes
      title: 什么不进入这里
      text: |
        下列内容不进入：
        - 单次调试过程尚未收敛为可说的机制 → 留在会话记录；
        - 未实际发生的风险假设 → 不承载，出现之后再判；
        - 纯粹的个人偏好与本机环境配置 → 归插件规范或方向规范；
        - 已由规则吸收为强制做法的规避 → 归插件规范，经验可以作为它的来源被引用；
        - 已存在同机制的经验 → 并入既有那条或登记为已存在；
        - 独立审核或复核收敛后的完整结论报告 → 归报告。

        单个决定本身的取舍判定、纯粹的外部事实调查、该修而尚未修的系统性阻碍，也不在本系统内承载，
        它们各有自己的去处。

    - id: not-candidate-reason
      title: 判为不构成候选须写清理由
      text: |
        判定某份认识不构成候选时，须把理由写进当次的形成说明并让它可回读，
        不得只给一个「不登记」的结论——那是一个判断，不是一个省略。

        「不构成候选」是形态判定，不是价值判定：本系统不作出「这条经验没用」的结论，
        是否值得推进由人在处置时决定。

    - id: unsure-routing
      title: 归不了类时不得先记下来再分流
      text: |
        判不了某份认识属于经验、方向、决定还是规则时，不得按「先记下来、以后再分流」处理：
        对象会出生在错误的类型里，它的字段、状态与消费方随之全部错位。

        此时按分流次序逐项核对；仍然判不了，登记为待决定事项交还，不先创建对象。
        材料不足以判定某段内容是否构成失败现象时，同样不下判断，不得为了推进而作出机制判断。

    - id: capture-before-draft
      title: 捕获先于成文
      text: |
        捕获与成文是两拍，不得合并成一次「总结一下」：捕获只记材料、不下判断；
        成文须以已经留住的材料为输入，不得回头去读实时对话补写。

        由发起那次行动的一方在当次交出材料、派生一个零上下文的代理起草的那条路径，
        以交出的那份材料为证据基准——材料还在手上，不是回头补写；它仍须逐项满足留存与候选成立的判据，
        并且先核对去向，归属不是经验就不写。

    - id: retention-test
      title: 什么算值得留存的经验认识
      text: |
        一份认识构成值得留存的经验认识，须同时满足四项：
        一、有可复现的机制：能说出在什么条件下会发生什么，而不只是「那次出了问题」；
        二、有消费对象：能说出将来的什么行动、什么判断会因为这条经验而不同；
        三、有适用边界：能说出它在什么范围内可信、超出范围为何不可信；
        四、有明确去向：能落到某个去处，或判定不留存。

        四项缺一不构成留存；回答不出「谁会在什么时候用它」的认识，不构成留存。

    - id: candidate-test
      title: 一条候选成立的判据
      text: |
        一条候选经验成立，须同时满足五项：
        一、正文的七段齐备且每段非空；
        二、逐段可回指证据：每段的依据都能回到具体材料条目或对象引用，某段回指不了，
        该段不成立、候选随之不成立；
        三、逐字引证与来源标识已复制进正文，不得只留一个可淘汰的缓冲引用；
        四、适用范围已说出：能回答何时可能踩到、何时可信；
        五、对既有同类对象的比对结论已记录，未记录等同未做；比对不建立相似度自动裁决。

        七段可以被填满而毫无依据；不得以段落齐备替代每段的证据。

    - id: routing-order
      title: 分流按次序核对
      text: |
        分流按下列次序逐项核对，取第一个成立项，不得按内容来自内部还是外部而回退：
        - 它是一条无论是否被记住、行动都不得越过的约束 → 插件规范，且须经人决定；
        - 它是一个尚待推进的方向或未决问题，核心是一个待答问题、有停止边界 → 方向线；
        - 它是一笔该修而尚未修的系统性阻碍，可归因、反复出现、修后更优 → 摩擦账目；
        - 它是一条已验证的失败机制，症状可识别、触发条件明确、根因有判断、解法已实际采用 → 踩坑经验；
        - 它是一份已收敛的调研、阶段性总结或独立审核的完整结论报告 → 报告；
        - 以上皆不成立 → 不承载，作为普通文档随当次交还呈现。

        约束先于其余项：一份内容若同时是约束与别的性质，走插件规范。
        约束先于失败机制：一条认识一旦上升为约束，就不再按经验留存，不得在两处同时承载同一内容。

        分流结论一旦作出，成文即停止：不得为凑满七段而把应归别类的认识写成经验。
        不得为同一批内容另建一套自己的次序。

    - id: no-fixability-judgement
      title: 分流不得改用能不能修好当判据
      text: |
        「该修而尚未修」问的是阻碍的性质，不是修复的可行性。
        代价上不值得修、授权上不能动，都仍是该被记下的账；不得以可修性替代性质判定。

        同一根源的阻碍可修，也不使它的规避经验不成立；债清之后经验仍可能被取用，其去留由复审决定，
        而不是在入口处预先排掉。

    - id: pairing-not-either
      title: 阻碍与失败机制是角色分工
      text: |
        同一条根源同时主张「这里有笔该修的账」与「这里有套可复用的规避」时，不是择一落位，而是角色分工：
        两种角色都成立时两条都写，各自满足其类型的成立条件；
        不得以「已经有一个对象了」把另一项硬塞或丢弃，也不得为回避两条而把其中一项弱化到不成立。

        配对关系只在摩擦账目那一侧记录一条带向经验的边，经验这一侧不写反向边；两条由此共同变化。
        不同根源时仍按次序取第一个成立项：一笔阻碍归摩擦账目，一个失败机制归踩坑经验，各归其位。

    - id: routing-split
      title: 一项认识可以分裂为多项
      text: |
        一份认识里同时含有一个待推进的方向与一条已验证的失败机制时，不是二选一，而是分别落位；
        每项须各自满足其去处的成立条件，不得以「反正已经有一个对象了」把另一项硬塞进去。
        分裂本身须写进当次的形成说明。

        同一份工作也可能同时留下多条不同去向的认识，此时按各自判据分别落位，
        不因已经有了一个对象而合并或丢弃。

    - id: experience-not-rule
      title: 经验不自行取得规则效力
      text: |
        经验与规则是两种效力的东西：经验是在适用时会被想起的依据，规则是无论是否被想起都不得越过的约束。
        经验处于任何状态，都不使任何约束成立；把经验当规则，会使未经人决定的判断自动获得强制力。

        规则的存在也不使某条经验失效，不替代它的触发信号与适用范围。
        规则只能由插件规范承载并经人决定，本系统不提供替代路径。

    - id: rule-absorbs
      title: 规则吸收了某条经验的规避之后
      text: |
        规则吸收了某条经验的规避后，该经验按其类型的受控操作处置状态，
        并在正文里保留「已被哪条规则吸收」的可回指依据，使后来的人能追到它去了哪里。

        吸收这件事本身不使这条经验立即失效，也不产生作废结论：作废是受控的状态变化，须由人决定。

    - id: reflection-triggers
      title: 什么时候该回头看一条经验
      text: |
        反思是重检既有经验是否仍然适用。出现下列任一情形时触发，按序核对：
        - 经验所依赖的平台、依赖版本或宿主机制发生变更 → 检视受影响经验的根因与解法是否仍成立；
        - 一次行动落入某条经验的影响范围，而它没能阻止问题 → 检视它的触发条件或适用范围是否有误；
        - 插件规范吸收了某条经验的规避 → 检视该经验是否应退出、去向是否已登记；
        - 人要求重检 → 检视指定范围。

    - id: reflection-output
      title: 反思只产出修订意见
      text: |
        反思不直接改写既有经验：它产出的是修订意见——对这条经验是否仍然成立、
        适用范围应否收窄或扩大的判断，连同依据。

        修订意见须经相应类型的受控更新落盘，在没有人的决定之前不改变既有对象的效力。
        「反思发现它已经不对」不等于「它已经被作废」：作废是受控的状态变化，不是反思的副产物。

        反思结论若指向「这里该有一条规则」，那只是提请的一项输入，规则本身仍须走插件规范并经人决定。

    - id: write-readback
      title: 写入后须精确回读
      text: |
        每次写入后须精确回读所写对象：正文七段齐备，每段的证据与逐字引证仍与写入前一致，
        来源标识可原样取用。

        回读不通过时，该次写入不成立，不得以「已写入」代替回读结果；写入失败且回读不可用时停下。
        不得只把引证留在缓冲里：缓冲是可淘汰的中间产物，候选须在它淘汰之后仍能被独立核对。

    - id: consumption
      title: 什么时候取用、什么算被取用
      text: |
        值得把经验取回来的时机有四种：行动落入某条经验的影响范围时，在动手之前对照它；
        出现相似症状时，作为诊断的候选机制；调研吸收时，作为已验证证据的输入；反思时，作为被检视对象。

        一条经验被真实消费的标志是：它使某次判断或行动与「没有这条经验」时不同。
        仅仅被检索到、被引用、被列在清单里，不构成消费。

    - id: overdue
      title: 过了重检时点不等于失效
      text: |
        超过重检时点未被检视的经验，不自动失效；但再次取用时须如实声明它的可信度已因未重检而降级，
        不得当作刚核对过的依据使用。

        不得给经验设统一的保质期来简化重检；重检由触发信号驱动，不由日历驱动。

    - id: conflict
      title: 两种互斥经验并存时
      text: |
        两种相互矛盾的经验并存时（例如对同一机制给出互斥的根因），不得自行择一保留：
        须分别承载它们的适用范围，或登记为待决定事项交还。

        冲突本身须登记，不得静默略过。

    - id: risk-tier
      title: 哪些环节走得快，哪些走不得快通道
      text: |
        默认按标准路径办，不得因为产物只是一份认识就默认走快通道；
        去向判定涉及「经验还是规则」时不得走快通道。

        标准路径下，分流判据须已核对并记录，候选的七段与证据回指须已自检；
        加固路径下，查重结论、适用范围与重检信号须另有可回指的依据，
        反思结论引起的修订须经受控更新落盘。

        认识涉及对象准入、规则效力的产生或人的根决定事项时须升级，并在交还中说明升级理由。

    - id: human-gate
      title: 这些事须由人决定
      text: |
        下列事项须由人决定，本系统只给判据与候选，不产生结论：
        作废一条经验；对经验质量作终审（本系统只判形态，不判价值）；把一条经验上升为规则；
        分流存疑时的最终归类；本系统的职责构成与承接范围的变更。

        提请须带上候选的成立依据、未验证的范围与残留风险，使人能对「该不该留下」作实质判断；
        不得只提交一份形态合规的候选而不说明它的证据强度。

    - id: human-decision-bound
      title: 人的决定只证明决定本身
      text: |
        人的决定只证明该决定及其作用范围，不替代候选各段依据的可回指性、分流判据的成立或复现验证的完成。
        人批准某份候选留下，不使其中未经复现验证的机制转为已验证。

    - id: stop
      title: 这些情况必须停下来
      text: |
        出现下列任一情况须停下：
        - 某段的依据回指不到具体材料，而该段被写成已成立；
        - 为凑齐形态而填入推测、占位符或「待查明」；
        - 类型归属存在实质争议，按次序判不了；
        - 经验与规则被混同使用：把经验当强制约束消费，或把规则当可选项消费；
        - 两种互斥经验并存而冲突未被登记；
        - 受控写入失败且回读不可用；
        - 某项校验不可用而准备降级为「尽力而为」。

    - id: stop-scope
      title: 停下期间能做什么、怎么恢复
      text: |
        停下期间只做：补齐每段的回指依据、补做比对、登记未验证范围与缺口、
        把被误当约束消费的经验退回其对象。不继续以带着停止原因的经验推进，
        也不为使形态齐备而填入推测，也不以其余段落已写好为由部分交付。

        恢复须与触发原因逐项对应，只覆盖当前依据支持的范围；补齐后的回指不追溯地把已经写成的错误结论
        转为正确。

    - id: handover
      title: 交还须说明什么
      text: |
        交还须如实说明：
        当次形成了哪条候选、分流到哪个类型，还是判定不构成候选；
        候选的成立依据（哪些证据支撑哪些段落），或判为不构成候选的理由与所依据的材料；
        已核实的是陈述可回指到证据，未核实的是该机制在将来仍会如此发生，须明确说出；
        残留风险与待决定事项——是否留下、是否作废、是否形成规则，三项都不在本系统内闭合，须逐项列出交回；
        运行机制未就绪、校验不可用或材料不可读时据实声明，不得以「推测已完成」代替。

    - id: semantic-bound
      title: 形态齐备不发证明
      text: |
        形态齐备、流程走完、比对已做，都只能证明当次的形态与流程，
        不能单独证明这条经验成立、适用范围正确或已被后续行动吸收；成立与否只能由复现验证与后续消费来检验。

        机械检查只能核对存在性与格式，判不了分段质量、判据是否成立、是否需要反思；
        不得以「检查已通过」声称经验成立或已被复用。

    - id: no-parallel-store
      title: 不另建存储与检索通道
      text: |
        不得为经验另建存储或检索通道：经验使用既有事实对象与既有召回路径，平行存储会造成两处权威。

    - id: no-volume-as-evidence
      title: 不以数量与形态冒充积累
      text: |
        不得以条目数量、候选生成率、检索命中数或页面呈现作为经验被积累的证据。
        不得要求「留存一切以免遗漏」：没有消费对象的留存不属于留存。
        不得把七段写成填空模板而把证据留空。
