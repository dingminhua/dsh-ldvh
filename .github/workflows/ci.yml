name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify JavaScript syntax
        run: |
          node --check lib/index.js
          node --check lib/client.js

      - name: Verify package contents
        run: npm pack --dry-run

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # 必须显式指定版本：action-setup@v4 未指定时既不读 lockfile 也无默认值，
          # 直接以 "No pnpm version is specified" 失败（package.json 无
          # packageManager 字段）。
          # 取 10：pnpm 11 要求 Node >= 22.13，与本 job 的 node-version 20 冲突
          # （实测报 ERR_UNKNOWN_BUILTIN_MODULE 与 "requires at least Node.js v22.13"）；
          # pnpm 9 则拒绝本仓库的 pnpm-workspace.yaml（只设 allowBuilds、无 packages
          # 字段，报 "packages field missing or empty"）。10 兼容 Node 20，
          # 且实测可完成 --frozen-lockfile 安装。
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: plugin/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      # 构建先于测试：产物存在后，spa-asset-base-contract 才在真实 dist/index.html
      # 上生效（dist/ 不入库，全新检出为空）。该用例在 dist 缺失时跳过，不误报。
      # 不带 --base=/ldvh/ 的构建会生成 /assets/... 引用，使 /ldvh 页面白屏，
      # 且构建本身不报错——故必须在 CI 内跑正确的 build:dsh 并由用例守住。
      - name: Build SPA under the /ldvh base
        run: pnpm build:dsh

      - name: Run Web contract tests
        run: pnpm test:web:api
