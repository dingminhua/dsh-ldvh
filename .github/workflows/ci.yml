name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify JavaScript syntax
        run: |
          node --check lib/index.js
          node --check lib/client.js

      - name: Verify package contents
        run: npm pack --dry-run

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # 必须显式指定版本：action-setup@v4 未指定时既不读 lockfile 也无默认值，
          # 直接以 "No pnpm version is specified" 失败（package.json 无
          # packageManager 字段）。
          # 取 11（与本地开发一致）：web/pnpm-workspace.yaml 只设 allowBuilds、
          # 无 packages 字段，pnpm 9 会以 "packages field missing or empty" 拒绝；
          # 10 与 11 均可用，取较新者以贴合本地环境。
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: plugin/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      # 构建先于测试：产物存在后，spa-asset-base-contract 才在真实 dist/index.html
      # 上生效（dist/ 不入库，全新检出为空）。该用例在 dist 缺失时跳过，不误报。
      # 不带 --base=/ldvh/ 的构建会生成 /assets/... 引用，使 /ldvh 页面白屏，
      # 且构建本身不报错——故必须在 CI 内跑正确的 build:dsh 并由用例守住。
      - name: Build SPA under the /ldvh base
        run: pnpm build:dsh

      - name: Run Web contract tests
        run: pnpm test:web:api
