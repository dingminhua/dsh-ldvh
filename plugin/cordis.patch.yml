# dsh-ldvh bundle patch.
#
# 用途：把 LDVH 作为一行 host-plane Cordis 插件接入 DSH。插件自身在
#   apply(ctx) 中通过 inject 获取宿主 webServer / settings / shellEnv 等
#   服务：注册 /ldvh/api（后端 API）与 /ldvh（前端 SPA）prefix 路由，
#   注册 dsh-ldvh 设置命名空间与 Client 设置面板。资源生命周期由
#   ctx.effect 承担，插件停用/卸载即清理，不占 webServer fallback 席位。
#
# 安装方式：`dsh plugin --profile <profile> add <本包>`。与 DSH 官方 webServer
#   共存；若宿主未装载 webServer（headless 无 web 表层），插件宿主管线在
#   inject 落空时保持 fail-closed，不声明 Web 能力已就绪。
- insert:
    - id: dsh-ldvh
      name: 'dsh-ldvh'